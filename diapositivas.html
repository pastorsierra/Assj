/* ===== Estructura y diseños de cada tipo de diapositiva ===== */
const SLIDE_CSS = `
.fit{--u:1cqw}
.sl{position:absolute;inset:0;overflow:hidden;color:var(--fg);background:var(--bg1);font-family:var(--fb);font-size:2.4u;line-height:1.35;--hlc:inherit;--is:3.3u}
.sl *{box-sizing:border-box}
.sl .bg,.sl .orn,.sl .wm,.sl .frm{position:absolute;inset:0;pointer-events:none}
.sl .wm{background-position:center;background-repeat:no-repeat;background-size:auto 64%;opacity:var(--wmo,.1)}
.sl .frm{inset:2.4u;border:.18u solid var(--ac);opacity:.55}
.sl .in{position:absolute;inset:0;padding:6u 8.5u 8.5u;display:flex;flex-direction:column;justify-content:center;gap:2.4u;z-index:2}
.sl .ft{position:absolute;left:6.4u;right:6.4u;bottom:4.4u;display:flex;justify-content:space-between;gap:2u;font-size:1.45u;letter-spacing:.05em;color:var(--fg);opacity:.82;text-shadow:0 0 .5u var(--bg1),0 0 .25u var(--bg1);z-index:4}
.sl .h{font-family:var(--fd);font-weight:var(--tw);text-transform:var(--tt);letter-spacing:var(--ls);line-height:1.08;margin:0;font-size:calc(6u*var(--hm,1));color:var(--hc,var(--fg))}
.sl .sub{font-size:calc(2.7u*var(--bm,1));color:var(--mut);line-height:1.35}
.sl .k{font-size:1.9u;letter-spacing:.22em;text-transform:uppercase;color:var(--ac);font-weight:700}
.sl .rule{width:9u;height:.5u;background:var(--ac);border-radius:.3u}
.sl mark{background:var(--hl);color:var(--hlc);padding:0 .22em;border-radius:.18em}
.sl b{font-weight:800}
.sl sup.vn{font-size:.52em;color:var(--ac);font-weight:700;margin-right:.25em;vertical-align:.55em;line-height:0}
.sl .qz{border-bottom:.2u dotted var(--ac)}
.sl.qzhide .qz{color:transparent;border-bottom:.28u solid var(--ac)}
.sl.hid .rv{opacity:0}.sl .rv{transition:opacity .35s}
/* portada y cierre */
.t-portada .h,.t-cierre .h{font-size:calc(9.4u*var(--hm,1))}
.t-portada.v-a .in,.t-cierre.v-a .in{align-items:flex-start;text-align:left;justify-content:flex-end;padding-left:9u;padding-bottom:15u}
.t-portada.v-b .in,.t-cierre.v-b .in{align-items:center;text-align:center}
.t-portada.v-c .in,.t-cierre.v-c .in{align-items:flex-start;text-align:left;padding-left:9u;padding-right:40u}
.t-portada.v-c .in::after,.t-cierre.v-c .in::after{content:"";position:absolute;right:0;top:0;bottom:0;width:30u;background:var(--ac);opacity:.92}
.t-portada.lt .h,.t-cierre.lt .h{font-size:calc(6.6u*var(--hm,1))}.t-portada.xt .h,.t-cierre.xt .h{font-size:calc(5u*var(--hm,1))}
.t-cierre .ref{font-family:var(--fd);color:var(--ac);font-size:2.8u}
/* sección */
.t-seccion .num{font-family:var(--fd);font-size:calc(25u*var(--hm,1));line-height:.9;color:var(--ac);font-weight:var(--tw)}
.t-seccion .h{font-size:calc(7.2u*var(--hm,1))}
.t-seccion.v-a .in{flex-direction:row;align-items:center;gap:6u;padding-left:10u}
.t-seccion.v-a .tx{flex:1;display:flex;flex-direction:column;gap:2u}
.t-seccion.v-b .in{align-items:center;text-align:center}.t-seccion.v-b .tx{display:flex;flex-direction:column;gap:2u;align-items:center}
.t-seccion.v-c .in{align-items:flex-start;justify-content:flex-end;padding-left:9u;padding-bottom:14u}.t-seccion.v-c .tx{display:flex;flex-direction:column;gap:2u}
/* versículo */
.t-versiculo{--vs:4.2u}
.t-versiculo.s1{--vs:5.6u}.t-versiculo.s2{--vs:4.7u}.t-versiculo.s3{--vs:3.9u}.t-versiculo.s4{--vs:3.2u}.t-versiculo.s5{--vs:2.7u}.t-versiculo.s6{--vs:2.3u}
.t-versiculo .ref{font-family:var(--fd);font-size:calc(3.3u*var(--hm,1));color:var(--ac);font-weight:var(--tw);text-transform:var(--tt);letter-spacing:var(--ls);display:flex;align-items:center;gap:1.4u;flex-wrap:wrap}
.t-versiculo .vlb{display:inline-block;font-family:var(--fb);font-size:1.45u;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:.35u 1u;border-radius:.5u;border:.14u solid currentColor;line-height:1.3}
.t-versiculo .ref .vlb{color:var(--vc)}.t-versiculo .vh .vlb{color:var(--v2)}
.t-versiculo .vt{font-size:var(--vs);line-height:1.3;color:var(--vc);text-wrap:pretty}
.t-versiculo .vl2{margin-top:2.2u;padding-top:2u;border-top:.16u solid var(--line2);display:flex;flex-direction:column;gap:1.2u}
.t-versiculo .vt2{font-size:calc(var(--vs)*.86);line-height:1.3;color:var(--v2)}
.t-versiculo.v-a .in{align-items:center;text-align:center}.t-versiculo.v-a .ref{justify-content:center}
.t-versiculo.v-b .in{flex-direction:row;align-items:center;gap:5u}.t-versiculo.v-b .ref{flex:0 0 23u;flex-direction:column;align-items:flex-start;font-size:calc(4.4u*var(--hm,1))}.t-versiculo.v-b .vbody{flex:1;min-width:0}
.t-versiculo.v-c .vbody{background:var(--card);border:.2u solid var(--line2);border-radius:1.6u;padding:4u 5u}
.t-versiculo .miss{opacity:.55;font-style:italic;font-size:3u}
/* punto, personaje, columnas */
.sl .z1{--is:3.9u}.sl .z2{--is:3.3u}.sl .z3{--is:2.8u}.sl .z4{--is:2.4u}
.sl ul,.sl ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1.8u}
.sl .li{display:flex;gap:1.7u;align-items:flex-start;font-size:calc(var(--is)*var(--bm,1));line-height:1.3}
.sl .li>span{min-width:0}
.sl .mk{flex:none;width:var(--mkw,1.2u);height:var(--mkh,1.2u);background:var(--ac);border-radius:var(--mkr,50%);transform:rotate(var(--mkt,0deg));margin-top:calc(var(--is)*.62 - .6u)}
.t-punto .h{font-size:calc(5.4u*var(--hm,1))}
.t-punto .callout{margin-top:2.6u;font-family:var(--fd);font-size:calc(3.2u*var(--hm,1));color:var(--ac);padding-top:1.8u;border-top:.16u solid var(--ac);line-height:1.2}
.t-punto.v-b .in{flex-direction:row;align-items:center;gap:6u}.t-punto.v-b .h{flex:0 0 31%}.t-punto.v-b .lw{flex:1;min-width:0}
.t-punto.v-c ul{display:grid;grid-template-columns:1fr 1fr;gap:2u}
.t-punto.v-c .li{background:var(--card);border:.15u solid var(--line2);border-radius:1.2u;padding:2.2u 2.4u}
.t-personaje .nm{font-family:var(--fd);font-weight:var(--tw);text-transform:var(--tt);letter-spacing:var(--ls);font-size:calc(7.4u*var(--hm,1));line-height:1.05;color:var(--hc,var(--fg))}
.t-personaje .rf{font-size:2.2u;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);font-weight:700;margin-top:1.4u}
.t-personaje .role{font-size:calc(2.7u*var(--bm,1));color:var(--mut);margin-top:1.6u;line-height:1.35}
.t-personaje.v-a .in{flex-direction:row;align-items:center;gap:6u}.t-personaje.v-a .hd{flex:0 0 38%}.t-personaje.v-a ul{flex:1}

let IDBX=null; const MEM={};
function idbOpen1(){return new Promise(res=>{let kick=null;const end=v=>{if(kick)clearInterval(kick);res(v)};try{if(indexedDB.databases){const k=()=>{try{indexedDB.databases().catch(()=>{})}catch(e){}};k();kick=setInterval(k,120)}const r=indexedDB.open('taller-predicador',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>end(r.result);r.onerror=()=>end(null);setTimeout(()=>end(undefined),2500)}catch(e){end(null)}})}
async function idbOpen(){for(let i=0;i<4;i++){const d=await idbOpen1();if(d!==undefined)return d}return null}
function kvGet(k){return new Promise(res=>{if(!IDBX)return res(MEM[k]);try{const q=IDBX.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(MEM[k])}catch(e){res(MEM[k])}})}
function kvSet(k,v){MEM[k]=v;return new Promise(res=>{if(!IDBX)return res();try{const t=IDBX.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})}
function kvDel(k){delete MEM[k];return new Promise(res=>{if(!IDBX)return res();try{const t=IDBX.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})}
function kvKeys(){return new Promise(res=>{if(!IDBX)return res(Object.keys(MEM));try{const q=IDBX.transaction('kv').objectStore('kv').getAllKeys();q.onsuccess=()=>res(q.result);q.onerror=()=>res([])}catch(e){res([])}})}

let DBC=null, SYNC='local'; // local | ok | saving | error
const dbQueue=new Map(); let dbTimer=null, dbBusy=false;
function setSync(s){SYNC=s;const e=$('#syncchip');if(e)e.innerHTML=syncHTML()}
function syncHTML(){const m={local:'Solo en este dispositivo',ok:'Guardado',saving:'Guardando…',error:'No se pudo respaldar'};return '<span class="chip" title="Estado del guardado">'+(SYNC==='ok'?ic('check'):'')+m[SYNC]+'</span>'}
function dbPut(key,obj){return;dbQueue.set(key,obj);setSync('saving');clearTimeout(dbTimer);dbTimer=setTimeout(dbFlush,1400)}
async function dbFlush(){if(dbBusy||!DBC)return;dbBusy=true;let bad=false;
  try{while(dbQueue.size){const [k,v]=dbQueue.entries().next().value;dbQueue.delete(k);try{if(v===null)await DBC.doc(k).delete();else await DBC.doc(k).set(v)}catch(e){bad=true}}}
  finally{dbBusy=false;setSync(bad?'error':'ok')}}

}

async function dbPull(){ // trae del respaldo lo que falte o sea más nuevo
  if(!DBC)return;let n=0;
  try{const snap=await DBC.get();
    for(const d of snap.docs){const b=d.data()||{};REMOTE[d.id]=b.t||1;
      if(d.id==='settings'&&b.json&&!S.settingsFromDb){const cur=await kvGet('settings');if(!cur){S.set=Object.assign(S.set,JSON.parse(b.json));await kvSet('settings',S.set)}}
      else if(d.id.startsWith('deck_')&&b.json){const dk=JSON.parse(b.json);const loc=S.decks[dk.id];if(!loc||(dk.updated||0)>(loc.updated||0)){S.decks[dk.id]=dk;await kvSet('deck:'+dk.id,dk);n++}}
      else if(d.id.startsWith('img_')&&b.data){const iid=d.id.slice(4);if(!IMG[iid]){IMG[iid]=b.data;await kvSet('img:'+iid,b.data)}}
      else if(d.id.startsWith('bible_')&&b.json&&!BIB[d.id.slice(6)]){/* las Biblias son grandes: no se respaldan */}
    }
  }catch(e){setSync('error')}

const nrm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\./g,'').replace(/\b(primera|primero|i)\b(?=\s*[a-z])/g,'1').replace(/\b(segunda|segundo|ii)\b(?=\s*[a-z])/g,'2').replace(/\b(tercera|tercero|iii)\b(?=\s*[a-z])/g,'3').replace(/^libro de\s+/,'').replace(/\s+/g,' ').trim();
const KEYS={};CANON.forEach((n,i)=>{KEYS[nrm(n).replace(/ /g,'')]=i});Object.keys(ALIAS).forEach(k=>{if(!(k in KEYS))KEYS[k]=ALIAS[k]});
function bookIdx(name){const k=nrm(name).replace(/ /g,'');if(k in KEYS)return KEYS[k];if(k.length<3)return -1;const hits=new Set();for(const key in KEYS){if(key.startsWith(k)&&!/^\d?[a-z]{1,3}$/.test(key))hits.add(KEYS[key])}return hits.size===1?[...hits][0]:-1}

function buildBooks(j){ // devuelve array de 66 libros -> capítulos -> versículos
  const out=Array.from({length:66},()=>[]);
  const put=(b,c,v,t)=>{if(b<0||b>65)return;const ch=out[b];while(ch.length<c)ch.push([]);const arr=ch[c-1];while(arr.length<v)arr.push('');arr[v-1]=String(t).trim()};
  if(Array.isArray(j)&&j.length&&j[0]&&Array.isArray(j[0].chapters)){
    j.forEach((bk,i)=>{let b=j.length===66?i:bookIdx(bk.name||bk.abbrev||'');bk.chapters.forEach((ch,ci)=>{(ch||[]).forEach((t,vi)=>put(b,ci+1,vi+1,t))})});return out}
  if(Array.isArray(j)&&j.length&&Array.isArray(j[0])&&typeof j[0][0]==='string'&&Array.isArray(j[0][j[0].length-1])){
    j.forEach((bk,i)=>{const ch=bk[bk.length-1];const b=j.length===66?i:bookIdx(bk[0]);ch.forEach((vs,ci)=>(vs||[]).forEach((t,vi)=>put(b,ci+1,vi+1,t)))});return out}
  if(Array.isArray(j)&&j.length&&j[0]&&('verse' in j[0]||'versiculo' in j[0])){
    j.forEach(r=>{put(bookIdx(r.book||r.libro||r.book_name||''),+(r.chapter||r.capitulo),+(r.verse||r.versiculo),r.text||r.texto)});return out}
  if(j&&typeof j==='object'&&!Array.isArray(j)){
    Object.keys(j).forEach(k=>{const v=j[k];const b=bookIdx(k);
      if(b>=0&&Array.isArray(v)){v.forEach((ch,ci)=>(ch||[]).forEach((t,vi)=>put(b,ci+1,vi+1,t)))}
      else if(b>=0&&v&&typeof v==='object'){Object.keys(v).forEach(c=>{const cv=v[c];if(cv&&typeof cv==='object')Object.keys(cv).forEach(vn=>put(b,+c,+vn,cv[vn]))})}

const USFM_CODES='GEN EXO LEV NUM DEU JOS JDG RUT 1SA 2SA 1KI 2KI 1CH 2CH EZR NEH EST JOB PSA PRO ECC SNG ISA JER LAM EZK DAN HOS JOL AMO OBA JON MIC NAM HAB ZEP HAG ZEC MAL MAT MRK LUK JHN ACT ROM 1CO 2CO GAL EPH PHP COL 1TH 2TH 1TI 2TI TIT PHM HEB JAS 1PE 2PE 1JN 2JN 3JN JUD REV'.split(' ');

function bAppend(out,b,c,v,t){if(b<0||b>65||c<1||v<1||!t)return;const ch=out[b];while(ch.length<c)ch.push([]);const a=ch[c-1];while(a.length<v)a.push('');a[v-1]=(a[v-1]||'')+t}
function bFinish(out){let n=0;out.forEach(b=>b.forEach(c=>{for(let i=0;i<c.length;i++){c[i]=String(c[i]||'').replace(/\s+/g,' ').trim();if(c[i])n++}}));return n>20?out:null}
const decodeEnt=s=>s.replace(/&#x([0-9a-f]+);/gi,(m,h)=>String.fromCodePoint(parseInt(h,16))).replace(/&#(\d+);/g,(m,d)=>String.fromCodePoint(+d)).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');

function parseUSFX(xml){
  const out=Array.from({length:66},()=>[]);const re=/<(\/?)([A-Za-z][A-Za-z0-9:_-]*)([^>]*?)(\/?)>|([^<]+)/g;

    if(close){for(let i=stack.length-1;i>=0;i--){if(stack[i]===tag){stack.length=i;break}}if(USFX_SKIP.has(tag)&&skip>0)skip--;continue}
    if(tag==='book'){b=usfmBook(aid());c=0;v=0}

function parseUSFM(texts){

      let m=ln.match(/^\\id\s+([A-Z0-9]{3})/);if(m){b=usfmBook(m[1]);c=0;v=0;continue}
      if(b<0)continue;
      m=ln.match(/^\\c\s+(\d+)/);if(m){c=+m[1];v=0;continue}
      if(/^\\(s\d?|r|mt\d?|h|toc\d|ide|rem|sts|cl|cp|cd|ms\d?|mr|sp|d|periph|usfm)\b/.test(ln))continue;
      ln=ln.replace(/\\f\s.*?\\f\*/g,'').replace(/\\x\s.*?\\x\*/g,'').replace(/\\fig\s.*?\\fig\*/g,'').replace(/\\\+?w\s+([^|\\]*)(\|[^\\]*)?\\\+?w\*/g,'$1').replace(/^\\(p|m|q\d?|pi\d?|ph\d?|li\d?|nb|b|qc|qr|mi|pc|pr|cls)\b\s*/,'');
      const parts=ln.split(/\\v\s+(\d+)(?:[-,]\d+)?\s*/);
      if(parts[0]&&v)bAppend(out,b,c,v,' '+parts[0].replace(/\\[a-z0-9+]+\*?\s?/gi,''));
      for(let i=1;i<parts.length;i+=2){v=+parts[i];bAppend(out,b,c,v,' '+(parts[i+1]||'').replace(/\\[a-z0-9+]+\*?\s?/gi,''))}
    }}

  if(!opt.split&&total<=420){const s=blank('versiculo',{ref:lbl,text:all.map(([v,t])=>(all.length>1?'{'+v+'} ':'')+t).join(' '),ver1:B?B.name:''});s.min=2;out.push(s)}

  if(opt.two&&S.set.b2&&S.set.b2!==bid){const B2=await ensureBib(S.set.b2);if(B2)for(const s of out){const r=lookup(s.f.ref,S.set.b2);if(r&&r.text.length<420){s.f.text2=r.text;s.f.ver2=B2.name}}}

openSheet=function(html){const sh=$('#sheet'),pr=$('#pres');if(P.on&&pr&&sh.parentElement!==pr)pr.appendChild(sh);else if(!P.on&&sh.parentElement!==document.body)document.body.appendChild(sh);return v26openSheet0(html)};
toast=function(msg,ms){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;(document.fullscreenElement||document.webkitFullscreenElement||document.body).appendChild(t);setTimeout(()=>t.remove(),ms||2600)};
document.addEventListener('pointerup',e=>{if(e.target.closest&&e.target.closest('#pres #sheet'))e.stopPropagation()},true);
(function(){const st=document.createElement('style');st.textContent='#pres #sheet{color:var(--ink);user-select:text;-webkit-user-select:text}#pres #sheet .btn{background:var(--panel);color:var(--ink);border-color:var(--line)}#pres #sheet .btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}#pres #sheet .btn.gold{background:var(--gold);color:#16110a}';document.head.appendChild(st)})();

/* ---------- 13. Logo oficial de la IPUC (viene en la app) ---------- */
const V26IPUC={color:['marca/ipuc-color.png','A color (fondos claros)'],oscuro:['marca/ipuc-color-oscuro.png','A color (fondos oscuros)'],blanco:['marca/ipuc-blanco.png','Blanco'],negro:['marca/ipuc-negro.png','Negro'],gris:['marca/ipuc-gris.png','Gris suave (marca de agua)']};
const v26IsDark=th=>{const t=THEMES.find(x=>x.id===th);const m=t&&String(t.vars).match(/--bg1:\s*#([0-9a-f]{6})/i);if(!m)return true;const n=parseInt(m[1],16);return ((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000<128};
async function v26UseIpuc(v){const get=async u=>{const r=await fetch(u);if(!r.ok)throw 0;const b=await r.blob();return addImage(new File([b],'ipuc.png',{type:'image/png'}),'logo')};
  toast('Poniendo el logo de la IPUC…',1500);try{S.set.logo=await get(V26IPUC[v][0]);S.set.ipuc=v;S.set.logoDark=(v==='color'||v==='negro'||v==='gris')?await get(V26IPUC.oscuro[0]):null;saveSettings();openSheet(identHTML());if(S.view==='studio')refreshAll();else renderLib();toast('Listo: logo de la IPUC')}catch(e){toast('No se pudo leer el logo. Abra la app una vez con internet.',4000)}}
const v26ident0=identHTML;
identHTML=function(){return v26ident0().replace('<div class="row"><button class="btn" data-act="pickLogo">','<div class="fld"><span class="lbl">Logo de la IPUC (oficial)</span><div class="row">'+Object.entries(V26IPUC).filter(([k])=>k!=='oscuro').map(([k,[u,n]])=>'<button class="btn sm'+(S.set.ipuc===k?' pri':'')+'" data-act="v26ipuc" data-v="'+k+'"><img src="'+u+'" alt="" style="height:26px;'+(k==='blanco'?'background:#15305B;border-radius:4px;padding:2px':'')+'">'+n+'</button>').join('')+'</div><span class="hint">En los diseños oscuros, «Solo el logo» usa sola la versión para fondo oscuro.</span></div><div class="row"><button class="btn" data-act="pickLogo">')};
ACT2.v26ipuc=e=>v26UseIpuc(e.dataset.v);
/* «Solo el logo»: versión correcta según el fondo */
const v26LogoHTML0=v26LogoHTML;
v26LogoHTML=function(){const d=curDeck()||{};const dark=v26IsDark(d.th||'medianoche');if(dark&&S.set.logoDark&&IMG[S.set.logoDark]){const keep=S.set.logo;S.set.logo=S.set.logoDark;try{return v26LogoHTML0()}finally{S.set.logo=keep}}return v26LogoHTML0()};

const LST_RV='RVR1960';
const LISTAS=[
{k:'liderazgo',t:'Liderazgo cristiano',g:'Escuela de líderes',d:'Llamado, confirmación y condiciones del líder que Dios usa',s:[
 ['portada',{kicker:'Escuela de líderes',title:'Liderazgo cristiano',sub:'Conocer el camino, andar en él y mostrarlo'},1,'Basado en la presentación «Liderazgo cristiano», rehecha para la iglesia.'],
 ['frase',{text:'Un líder es aquel que conoce el camino, anda en el camino y muestra el camino.',by:'John C. Maxwell'},1,'El que guía tiene que haber caminado primero. Nadie puede mostrar con autoridad un camino que no ha andado.'],
 ['versiculo',{ref:'2 Timoteo 3:16-17',text:'{16}Toda la Escritura es inspirada por Dios, y útil para enseñar, para redargüir, para corregir, para instruir en justicia, {17}a fin de que el hombre de Dios sea perfecto, enteramente preparado para toda buena obra.'},2,'Este es el objetivo del taller: que cada líder quede preparado para toda buena obra, y que esa preparación venga de la Palabra.'],
 ['seccion',{num:'A',title:'¿Qué es un líder?',sub:'El que va adelante. Dirige a otros, y ellos lo siguen de buena voluntad.'},1,'La palabra clave es «voluntad». Al líder no lo siguen por obligación; lo siguen porque confían en él.'],
 ['punto',{title:'¿Se nace o se hace?',items:'Se dice que los líderes nacen y no se hacen\nEs verdad en parte: hay niños que desde pequeños guían a otros\nEl líder cristiano se forma: Dios lo llama, lo trata y lo prepara',hl:''},3,'Hay rasgos que se traen, pero Moisés pasó cuarenta años en el desierto antes de guiar a Israel. Dios forma a sus siervos.'],
 ['seccion',{num:'B',title:'El liderazgo en la Biblia',sub:'Dios levantó hombres para guiar a su pueblo en cada época.'},1,''],
 ['punto',{title:'Hombres que Dios levantó',items:'Patriarcas: Noé, Abraham y José\nCaudillos y reyes: Moisés, Josué, Gedeón y David\nProfetas: Samuel, Daniel y Juan el Bautista\nApóstoles: Pedro y Pablo',hl:''},3,'Ninguno fue perfecto. Lo que tuvieron en común fue un corazón dispuesto delante de Dios.'],
 ['versiculo',{ref:'1 Samuel 16:7',text:'Y Jehová respondió a Samuel: No mires a su parecer, ni a lo grande de su estatura, porque yo lo desecho; porque Jehová no mira lo que mira el hombre; pues el hombre mira lo que está delante de sus ojos, pero Jehová mira el corazón.'},2,'Samuel miraba la estatura de Eliab. Dios estaba mirando a un muchacho que cuidaba ovejas en el campo.'],
 ['pasos',{title:'Lo que Dios hace con sus líderes',items:'Los elige y los llama. Hechos 9:15\nLos capacita. Éxodo 4:12\nPelea por ellos. Éxodo 14:14\nLos guía para que guíen a otros. Juan 16:13\nDecide cuándo termina su carrera. 2 Timoteo 4:7'},4,'Más pasajes para el maestro: Éxodo 3:10; Lucas 12:12; Jeremías 1:19; Salmo 48:14; Deuteronomio 32:50. Todo empieza y termina en Dios. Él llama, él capacita, él respalda y él dice cuándo se acaba la tarea.'],
 ['frase',{text:'Los líderes son necesarios, pero no imprescindibles. Solo Dios lo es.',by:''},1,'Esto nos guarda del orgullo. La obra sigue cuando nosotros pasamos.'],
 ['seccion',{num:'C',title:'El llamado divino',sub:'Dios sigue llamando hoy, y lo hace de muchas maneras.'},1,''],
 ['punto',{title:'¿Cómo llama Dios?',items:'Hablando al corazón. Oseas 2:14\nCon voz audible, como a Moisés, a Samuel y a Pablo\nPor sueños, como a Jacob y a José\nPor medio de profetas y de su Palabra\nPor hermanos guiados por su Espíritu',hl:''},4,'Pregunte a la clase cómo los llamó Dios a ellos. Casi siempre aparece la Palabra y la voz de un hermano.'],
 ['seccion',{num:'D',title:'La confirmación del llamado',sub:'Hay que estar seguro de que el llamado viene de Dios.'},1,'Pedir confirmación no es falta de fe cuando se hace con un corazón sincero.'],
 ['personaje',{name:'Gedeón',ref:'Jueces 6:11-24',role:'Dios lo llamó mientras sacudía el trigo escondido de los madianitas.',items:'El ángel le dijo: Jehová está contigo, varón esforzado y valiente\nGedeón pidió una señal, y Dios no se ofendió\nFuego salió de la peña y consumió la ofrenda\nCuando Dios llama, también confirma'},3,'Gedeón se veía pequeño: «mi familia es pobre en Manasés, y yo el menor en la casa de mi padre». Dios lo llamó valiente antes de que lo fuera.'],
 ['seccion',{num:'E',title:'Los liderazgos en la iglesia',sub:'Dios pone a cada miembro en su lugar para edificar el cuerpo.'},1,''],
 ['versiculo',{ref:'Efesios 4:11-12',text:'{11}Y él mismo constituyó a unos, apóstoles; a otros, profetas; a otros, evangelistas; a otros, pastores y maestros, {12}a fin de perfeccionar a los santos para la obra del ministerio, para la edificación del cuerpo de Cristo.'},2,'Los ministerios no son títulos para lucir. Existen para perfeccionar a los santos.'],
 ['versiculo',{ref:'1 Corintios 12:11',text:'Pero todas estas cosas las hace uno y el mismo Espíritu, repartiendo a cada uno en particular como él quiere.'},1,'Uno y el mismo Espíritu: el único Dios es quien reparte los dones y dirige su iglesia.'],
 ['seccion',{num:'F',title:'Lo que Dios pide al líder',sub:'Siete condiciones que Dios espera ver.'},1,''],
 ['punto',{title:'Condiciones del líder (1)',items:'Obediencia. Hechos 9:6\nHumildad. Mateo 20:26\nSantidad. 1 Timoteo 3:2\nLealtad. 1 Samuel 24:10',hl:''},3,'David tuvo a Saúl en sus manos y no lo tocó. La lealtad se prueba cuando sería fácil traicionar.'],
 ['punto',{title:'Condiciones del líder (2)',items:'Fidelidad. Daniel 3:17-18\nValentía. Josué 1:6\nHonestidad. 1 Pedro 5:2',hl:'El siervo del Señor no debe ser contencioso, sino amable para con todos. 2 Timoteo 2:24'},3,''],
 ['seccion',{num:'G',title:'Para responder',sub:'Cinco preguntas para conversar en grupo.'},1,''],
 ['reflexion',{label:'Pregunta 1 de 5',text:'¿Ha sentido el llamado a un liderazgo o a un ministerio específico?'},2,''],
 ['reflexion',{label:'Pregunta 2 de 5',text:'¿Se ha asegurado de que se trata de un llamado genuino?'},2,''],
 ['reflexion',{label:'Pregunta 3 de 5',text:'Si todavía no lo ha hecho, ¿cómo buscaría la confirmación de Dios?'},2,''],
 ['reflexion',{label:'Pregunta 4 de 5',text:'¿Está trabajando ahora en algún área de la iglesia?'},2,''],
 ['reflexion',{label:'Pregunta 5 de 5',text:'Si aún no ha sentido un llamado, ¿en qué área le gustaría servir?'},2,''],
 ['seccion',{num:'H',title:'Reflexión final',sub:'Lo que se ve en el líder que Dios usa.'},1,''],
 ['punto',{title:'El líder que Dios usa (1)',items:'Escucha un buen consejo\nSe deja ayudar\nDelega lo que otros pueden hacer\nValora, anima e inspira a sus ayudantes\nDeja que los nuevos líderes crezcan',hl:''},3,'Moisés aprendió a delegar por el consejo de Jetro. Éxodo 18:17-23.'],
 ['punto',{title:'El líder que Dios usa (2)',items:'Soporta la crítica con paciencia\nSabe que puede ser traicionado, aun por quien menos espera\nNo busca aplausos ni agradar a los hombres\nTiene los ojos puestos en Jesús. Hebreos 12:2\nAdmite sus errores y es considerado con los ajenos',hl:''},3,''],
 ['versiculo',{ref:'Gálatas 1:10',text:'Pues, ¿busco ahora el favor de los hombres, o el de Dios? ¿O trato de agradar a los hombres? Pues si todavía agradara a los hombres, no sería siervo de Cristo.'},2,''],
 ['versiculo',{ref:'1 Timoteo 4:12',text:'Ninguno tenga en poco tu juventud, sino sé ejemplo de los creyentes en palabra, conducta, amor, espíritu, fe y pureza.'},2,'Pablo le escribe a un joven. El respeto del líder se gana con el ejemplo, no con la edad.'],
 ['punto',{title:'Descubra el líder que hay en usted',items:'Dentro de cada seguidor de Jesús hay alguien que puede guiar a otros\nNací para servir y guiar, pero tengo que formarme\nEl liderazgo verdadero se nota en el servicio',hl:''},3,''],
 ['cierre',{title:'Conocer el camino, andar en él y mostrarlo',sub:'Puestos los ojos en Jesús, el autor y consumador de la fe.',ref:'Hebreos 12:2'},1,'']]},

{k:'lidersiervo',t:'El ministerio del líder siervo',g:'Principios de liderazgo',d:'Alcanzar la madurez espiritual: el maduro y el inmaduro, y siete rasgos del líder maduro',s:[
 ['portada',{kicker:'Principios de liderazgo cristiano',title:'El ministerio del líder siervo',sub:'Alcanzando la madurez en el ministerio'},1,'Basado en «Principios de liderazgo cristiano 13: Ministerio del Lidersiervo» (F. Cataño, AGAPE), rehecho para la iglesia.'],
 ['punto',{title:'Muchos quieren ser líderes',items:'Pocos están dispuestos a esforzarse para servir con madurez\nEl líder siervo obedece la Palabra, pone a Cristo en el centro y trabaja en el poder del Espíritu\nEsta tarea pide madurez física, mental y espiritual',hl:''},3,''],
 ['versiculo',{ref:'1 Corintios 13:11',text:'Cuando yo era niño, hablaba como niño, pensaba como niño, juzgaba como niño; mas cuando ya fui hombre, dejé lo que era de niño.'},2,'Crecer es dejar cosas. Hay maneras de hablar y de reaccionar que ya no le quedan a un siervo de Dios.'],
 ['punto',{title:'El problema en muchas iglesias',items:'Insistimos en la conversión y descuidamos el crecimiento\nMuchos no crecen, no colaboran y solo ocupan una banca\nArrastran la vida vieja: orgullo, resentimiento, chisme, desobediencia y pereza para servir',hl:'Hace falta una visión clara de lo que es la madurez en Cristo.'},3,''],
 ['punto',{title:'¿Sabemos definirla?',items:'Un estudio del Grupo Barna en Estados Unidos encontró que muchos cristianos, líderes y pastores no saben definir la madurez espiritual\nCasi todos los pastores dijeron que la falta de madurez es uno de los mayores problemas de la iglesia\nPocos la medían por la relación personal con Jesús',hl:''},3,'No fue en Latinoamérica, pero nos obliga a preguntarnos qué entendemos nosotros por un cristiano maduro.'],
 ['pasos',{title:'Antes de seguir, pregúntese',items:'¿Qué es para mí un cristiano maduro?\n¿Cómo reconozco a una persona espiritualmente madura?\n¿Qué me enseñaron sobre esto mis padres y mis líderes?\n¿Qué textos de la Biblia hablan de crecer?\n¿Qué se debe ver en la vida de un creyente maduro?'},4,'Deje unos minutos para que la clase responda en voz alta o por escrito.'],
 ['seccion',{num:'I',title:'¿Qué es la madurez espiritual?',sub:'Crecer hasta la estatura de Cristo.'},1,''],
 ['versiculo',{ref:'Efesios 4:13',text:'hasta que todos lleguemos a la unidad de la fe y del conocimiento del Hijo de Dios, a un varón perfecto, a la medida de la estatura de la plenitud de Cristo;'},2,'La medida no es el hermano más antiguo de la iglesia. La medida es Cristo.'],
 ['versiculo',{ref:'Romanos 8:29',text:'Porque a los que antes conoció, también los predestinó para que fuesen hechos conformes a la imagen de su Hijo, para que él sea el primogénito entre muchos hermanos.'},2,''],
 ['frase',{text:'La persona madura vive en armonía con Dios, con su prójimo y consigo misma, con equilibrio en el cuerpo, la mente, los afectos y el espíritu.',by:'Diccionario hispanoamericano de la misión (adaptado)'},2,''],
 ['punto',{title:'Señales de un creyente maduro',items:'Ora y vive en la Palabra\nTestifica de Cristo y anda lleno del Espíritu Santo\nEs buen mayordomo y sirve en un ministerio\nAma a la iglesia y obedece',hl:''},3,'Félix Ortiz, en «Claves para un ministerio bíblico, fuerte y en crecimiento», resume la madurez en estas áreas.'],
 ['seccion',{num:'II',title:'¿Qué es la inmadurez espiritual?',sub:'La Biblia la describe con claridad.'},1,''],
 ['versiculo',{ref:'1 Corintios 14:20',text:'Hermanos, no seáis niños en el modo de pensar, sino sed niños en la malicia, pero maduros en el modo de pensar.'},2,''],
 ['versiculo',{ref:'Efesios 4:14-15',text:'{14}para que ya no seamos niños fluctuantes, llevados por doquiera de todo viento de doctrina, por estratagema de hombres que para engañar emplean con astucia las artimañas del error, {15}sino que siguiendo la verdad en amor, crezcamos en todo en aquel que es la cabeza, esto es, Cristo,'},2,'El inmaduro se deja llevar por cualquier viento. El maduro tiene raíces en la verdad.'],
 ['versiculo',{ref:'Hebreos 5:12-13',text:'{12}Porque debiendo ser ya maestros, después de tanto tiempo, tenéis necesidad de que se os vuelva a enseñar cuáles son los primeros rudimentos de las palabras de Dios; y habéis llegado a ser tales que tenéis necesidad de leche, y no de alimento sólido. {13}Y todo aquel que participa de la leche es inexperto en la palabra de justicia, porque es niño;'},2,''],
 ['versiculo',{ref:'Hebreos 5:14',text:'pero el alimento sólido es para los que han alcanzado madurez, para los que por el uso tienen los sentidos ejercitados en el discernimiento del bien y del mal.'},2,'«Por el uso». La madurez se ejercita, como un músculo.'],
 ['seccion',{num:'III',title:'El maduro y el inmaduro',sub:'Se conocen por su fruto: con Dios, con la iglesia y con los que no creen.'},1,''],
 ['versiculo',{ref:'Gálatas 5:22-23',text:'{22}Mas el fruto del Espíritu es amor, gozo, paz, paciencia, benignidad, bondad, fe, {23}mansedumbre, templanza; contra tales cosas no hay ley.'},2,''],
 ['columnas',{title:'Con Dios',aT:'El maduro',aItems:'Busca la comunión con Cristo\nMira lo que le pasa desde la perspectiva de Dios',bT:'El inmaduro',bItems:'No tiene tiempo para Dios, la Biblia ni la oración\nCulpa a Dios de todo lo que le pasa'},3,''],
 ['columnas',{title:'Con la iglesia (1)',aT:'El maduro',aItems:'Busca la comunión con los hermanos\nEs un agente de paz\nTiene su lugar y su ministerio',bT:'El inmaduro',bItems:'No conoce el perdón que nace de la comunión\nLleva a conflictos y divisiones\nNo sirve en nada y asiste de vez en cuando'},3,''],
 ['columnas',{title:'Con la iglesia (2)',aT:'El maduro',aItems:'Ordena su vida alrededor de la Palabra y la iglesia\nQuiere trabajar y servir',bT:'El inmaduro',bItems:'Ordena su vida alrededor del dinero y la profesión\nEspera que los líderes lo entretengan'},3,''],
 ['columnas',{title:'Con los que no creen',aT:'El maduro',aItems:'Invita siempre a personas nuevas\nVe en cada incrédulo un futuro discípulo y un futuro líder',bT:'El inmaduro',bItems:'Se encierra en su grupo de amigos\nVe en cada incrédulo un problema'},3,''],
 ['seccion',{num:'IV',title:'La meta: la madurez',sub:'A Dios le interesa más nuestra madurez que nuestra comodidad.'},1,''],
 ['original',{q:'',w:'τέλειος',tr:'téleios',st:'G5046',mean:'Maduro, completo, que llegó a su fin',ref:'Mateo 5:48',note:'En la Biblia, perfecto no quiere decir sin defectos. Quiere decir maduro.'},2,''],
 ['versiculo',{ref:'Mateo 5:48',text:'Sed, pues, vosotros perfectos, como vuestro Padre que está en los cielos es perfecto.'},1,''],
 ['seccion',{num:'V',title:'Siete rasgos del líder maduro',sub:'Lo que se espera de quien quiere ser un líder espiritual.'},1,''],
 ['punto',{title:'Rasgos del líder maduro (1)',items:'Amor incondicional: ama a la persona aunque no apruebe lo que hace. 1 Corintios 13:4-8\nDisponibilidad: pone su tiempo, sus fuerzas y sus bienes al servicio de la obra. Hechos 2:44-45\nTransparencia: habla la verdad en amor y no lo encierra todo en sí mismo. Efesios 4:15; Santiago 5:16',hl:''},4,''],
 ['punto',{title:'Rasgos del líder maduro (2)',items:'Apertura: escucha, revisa las costumbres y recibe buenas ideas\nResponsabilidad: cumple con fidelidad la tarea que le encomendaron\nSujeción: se somete a la autoridad de la iglesia y cuida la unidad. Efesios 4:11-16\nIntegridad: es honesto, no se deja comprar y cumple lo que promete',hl:''},4,''],
 ['frase',{text:'Nuestra tarea como líderes siervos es dar a cada creyente la oportunidad y el conocimiento para crecer a la imagen de Cristo.',by:''},1,''],
 ['frase',{text:'La madurez no llega en un día ni con el solo paso de los años. Hay que conocer sus rasgos y moldear la conducta en esa dirección.',by:''},1,''],
 ['versiculo',{ref:'Filipenses 3:12',text:'No que lo haya alcanzado ya, ni que ya sea perfecto; sino que prosigo, por ver si logro asir aquello para lo cual fui también asido por Cristo Jesús.'},1,''],
 ['versiculo',{ref:'Filipenses 3:13-14',text:'{13}Hermanos, yo mismo no pretendo haberlo ya alcanzado; pero una cosa hago: olvidando ciertamente lo que queda atrás, y extendiéndome a lo que está delante, {14}prosigo a la meta, al premio del supremo llamamiento de Dios en Cristo Jesús.'},2,'Pablo, después de tantos años de ministerio, dice que todavía no ha llegado. El maduro sabe que le falta.'],
 ['cierre',{title:'Prosigo a la meta',sub:'Al premio del supremo llamamiento de Dios en Cristo Jesús.',ref:'Filipenses 3:14'},1,'']]},

{k:'servicio1',t:'El servicio que Dios quiere',g:'Servicio a Dios · 1',d:'Un servicio que nace de la misericordia, de corazón, en santidad y con humildad',s:[
 ['portada',{kicker:'Servicio a Dios · 1',title:'El servicio que Dios quiere',sub:''},1,''],
 ['versiculo',{ref:'Romanos 12:1',text:'Así que, hermanos, os ruego por las misericordias de Dios, que presentéis vuestros cuerpos en sacrificio vivo, santo, agradable a Dios, que es vuestro culto racional.'},2,'Pablo no empieza pidiendo. Empieza recordando las misericordias de Dios. Todo el servicio sale de ahí.'],
 ['original',{q:'',w:'λατρεία',tr:'latreía',st:'G2999',mean:'Servicio, culto: lo que se ofrece a Dios',ref:'Romanos 12:1',note:'Servir a Dios y adorarle se dicen con la misma palabra.'},2,'Barrer el templo, enseñar a los niños o cantar en el coro también es culto delante de Dios.'],
 ['seccion',{num:'I',title:'Nace de la misericordia',sub:'Primero Dios nos alcanzó. Después nosotros le servimos.'},1,''],
 ['punto',{title:'Le servimos porque él nos sirvió primero',items:'Nos libró de la potestad de las tinieblas. Colosenses 1:13\nVino a servir y a dar su vida en rescate. Marcos 10:45\nAl que mucho se le perdona, mucho ama. Lucas 7:47',hl:''},3,'Dios mismo, manifestado en carne, se hizo siervo. Quien entiende eso no sirve por obligación.'],
 ['versiculo',{ref:'Marcos 10:45',text:'Porque el Hijo del Hombre no vino para ser servido, sino para servir, y para dar su vida en rescate por muchos.'},2,''],
 ['seccion',{num:'II',title:'Con todo el corazón',sub:'Dios no recibe un servicio a medias.'},1,''],
 ['versiculo',{ref:'Deuteronomio 10:12',text:'Ahora, pues, Israel, ¿qué pide Jehová tu Dios de ti, sino que temas a Jehová tu Dios, que andes en todos sus caminos, y que lo ames, y sirvas a Jehová tu Dios con todo tu corazón y con toda tu alma;'},2,''],
 ['punto',{title:'Lo que Dios mira cuando servimos',items:'El ánimo voluntario. 1 Crónicas 28:9\nLa alegría. Salmo 100:2\nLa fidelidad en lo poco. Lucas 16:10',hl:'Dios escudriña los corazones y entiende todo intento de los pensamientos.'},3,'David le dijo a Salomón: «sírvele con corazón perfecto y con ánimo voluntario». Lo que se hace a regañadientes pierde su olor grato.'],

const LST_TH='t26-ipuc';
function lstThemeOk(){return THEMES.some(t=>t.id===LST_TH)?LST_TH:v26Th()}
function lstBuild(L){const sl=L.s.map(([ty,f,m,n])=>{const f2=Object.assign({},f);['items','hl','aItems','bItems'].forEach(x=>{if(f2[x])f2[x]=f2[x].replace(/\b([123]) (?=[A-ZÁÉÍÓÚ])/g,'$1\u00a0').replace(/ (?=\d{1,3}:\d)/g,'\u00a0')});const s=blank(ty,f2);s.min=m;s.notes=n||'';if(ty==='versiculo'&&!s.f.ver1)s.f.ver1=LST_RV;return s});
  const d=newDeck(L.t,lstThemeOk(),null,sl);d.target=Math.max(10,Math.round(planned(d)/5)*5);d.lista=L.k;return d}
function lstCopy(k){return Object.values(S.decks).find(d=>d.lista===k&&!d.temp)}
function lstPreview(L){const s=blank('portada',Object.assign({},L.s[0][1]));return fitHTML(s,{deck:{th:lstThemeOk(),slides:[s]},i:0,n:L.s.length})}
function lstMin(L){return L.s.reduce((a,x)=>a+(+x[2]||0),0)}
function lstHTML(){return '<div class="lst"><div class="lst-hd"><div class="lbl">Presentaciones listas</div><p class="hint">Talleres ya preparados. Al tocar «Usar» se guarda una copia en sus presentaciones para ajustarla a su gusto.</p></div><div class="cards">'+
  LISTAS.map(L=>{const c=lstCopy(L.k);return '<div class="card lst-c"><div class="th" data-act="lstuse" data-k="'+L.k+'">'+lstPreview(L)+'</div><div class="bd"><span class="lst-g">'+esc(L.g)+'</span><b>'+esc(L.t)+'</b><div class="meta">'+L.s.length+' diapositivas · '+lstMin(L)+' min</div><p class="lst-d">'+esc(L.d)+'</p><div class="row">'+
   (c?'<button class="btn sm pri" data-act="open" data-id="'+c.id+'">Abrir mi copia</button><button class="btn sm gold" data-act="v26play" data-id="'+c.id+'">'+ic('play')+'Proyectar</button><button class="btn sm" data-act="lstnew" data-k="'+L.k+'">Otra copia</button>'
     :'<button class="btn sm pri" data-act="lstuse" data-k="'+L.k+'">Usar</button><button class="btn sm gold" data-act="lstplay" data-k="'+L.k+'">'+ic('play')+'Proyectar</button>')+'</div></div></div>'}).join('')+'</div></div>'}
function lstMake(k,force){const L=LISTAS.find(x=>x.k===k);if(!L)return null;const c=!force&&lstCopy(k);if(c)return c;const d=lstBuild(L);if(force)d.title=L.t+' (copia)';S.decks[d.id]=d;saveDeck(d);return d}
Object.assign(window.ACT2,{
  lstuse:e=>{const c=lstCopy(e.dataset.k);const d=lstMake(e.dataset.k);if(!d)return;openDeck(d.id);if(!c)toast('Listo: «'+d.title+'» ya está en sus presentaciones')},
  lstnew:e=>{const d=lstMake(e.dataset.k,true);if(d){openDeck(d.id);toast('Se creó otra copia')}},
  lstplay:e=>{const d=lstMake(e.dataset.k);if(d){openDeck(d.id);setTimeout(()=>startPresent('p'),60)}}});
const lstRenderLib0=renderLib;
renderLib=function(){lstRenderLib0();const lib=$('#lib');if(lib&&!V26L.q)lib.insertAdjacentHTML('beforeend',lstHTML())};

(async function boot(){
  try{IDBX=await idbOpen()}catch(e){IDBX=null}
  injectSlideCss();
  S.set=Object.assign({},DEF_SET,(await kvGet('settings'))||{});S.set.bibles=S.set.bibles||[];
  for(const k of await kvKeys()){if(typeof k==='string'&&k.startsWith('deck:')){const d=await kvGet(k);if(d&&d.id&&Array.isArray(d.slides))S.decks[d.id]=d}}
  await loadAllImgs();await loadBibles();
  render();
  try{const q=new URLSearchParams(location.search).get('ens');if(q){history.replaceState(null,'',location.pathname);await createFromEns(q)}const l=new URLSearchParams(location.search).get('lib');if(l!=null){history.replaceState(null,'',location.pathname);const it=(await libItems()).find(x=>x.i===+l);if(it)await makeDeck(libMd(it),{titulo:it.t});else toast('No encontré esa enseñanza')}}catch(e){console.error(e)}
  try{await v26Params()}catch(e){console.error(e)}
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&curDeck())saveDeck(curDeck())});
})();
</script>
