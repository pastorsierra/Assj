<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Mulish:wght@400;600;800&family=IM+Fell+English:ital@0;1&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Anton&family=Barlow:wght@400;600;700&family=Figtree:wght@400;600;800&family=Bricolage+Grotesque:wght@500;800&family=Instrument+Sans:wght@400;600&family=Abril+Fatface&family=Lora:ital,wght@0,400;0,600;1,400&family=Rozha+One&family=Jost:wght@400;500;600&family=Josefin+Sans:wght@400;600&family=Young+Serif&family=Karla:wght@400;600;700&family=Caveat:wght@500;700&family=Patrick+Hand&family=Bowlby+One&family=Poppins:wght@400;600;700&display=swap">
<style>
/* Layout: biblioteca de talleres + estudio de tres zonas (diapositivas, escenario, contenido) */
:root{
  --bg:#F6F5F1; --panel:#FFFFFF; --ink:#1B2230; --mute:#69707C; --line:#E2DFD7;
  --brand:#1D3557; --brand-ink:#FFFFFF; --gold:#C9962B; --gold-soft:#F6E7BE; --danger:#B3261E; --ok:#1F7A55;
  --shadow:0 1px 2px rgba(20,33,61,.08),0 8px 24px rgba(20,33,61,.08);
  --ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --head:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1322; --panel:#141D30; --ink:#E8EDF7; --mute:#97A3BE; --line:#27324C;
  --brand:#9DBBFF; --brand-ink:#0C1322; --gold:#E2B54A; --gold-soft:#3A2F12; --danger:#FF8A80; --ok:#6FD3A6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1322; --panel:#141D30; --ink:#E8EDF7; --mute:#97A3BE; --line:#27324C;
  --brand:#9DBBFF; --brand-ink:#0C1322; --gold:#E2B54A; --gold-soft:#3A2F12; --danger:#FF8A80; --ok:#6FD3A6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--ui);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ic{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;gap:.45em;min-height:40px;padding:0 14px;border:1px solid var(--line);background:var(--panel);border-radius:10px;font-weight:600;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.gold{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.btn.icon{padding:0;width:40px;justify-content:center}
.btn.icon.sm{width:34px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
h1,h2,h3{font-family:var(--head);margin:0;text-wrap:balance}
.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld textarea,.fld select,.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;min-height:40px}
.fld textarea{resize:vertical;min-height:84px;line-height:1.4}
.hint{font-size:12px;color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--gold-soft);color:var(--ink)}

/* top bar */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
#top a.btn{text-decoration:none;color:inherit}
#top .ttl{flex:1;min-width:140px;font-family:var(--head);font-weight:800;font-size:18px;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px}
#top .ttl:focus{border-color:var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:800;font-size:20px}
.brand i{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:var(--gold)}

/* library */
#lib{padding-block:22px 60px;max-width:1100px;margin-inline:auto}
.lib-head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.lib-head h1{font-size:30px;line-height:1.1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);min-width:0}
.card .th{background:#000;cursor:pointer}
.card .bd{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card .bd b{font-family:var(--head);font-size:17px;overflow-wrap:anywhere}
.card .meta{font-size:12px;color:var(--mute)}

/* studio */
#studio{display:grid;gap:12px;padding-block:12px 90px;grid-template-columns:150px minmax(0,1fr) 330px;grid-template-areas:"rail stage insp"}
#rail{grid-area:rail;display:flex;flex-direction:column;gap:8px;min-width:0}
#stage{grid-area:stage;min-width:0;display:flex;flex-direction:column;gap:10px}
#insp{grid-area:insp;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;align-self:start}
.slist{display:flex;flex-direction:column;gap:8px}
.sitem{position:relative;border:2px solid transparent;border-radius:9px;padding:0;background:none;text-align:left;display:block;width:100%}
.sitem.on{border-color:var(--gold)}
.sitem .n{position:absolute;left:5px;top:5px;z-index:2;background:rgba(0,0,0,.62);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px}
.sitem .fit{border-radius:6px;overflow:hidden}
.fit{position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size;overflow:hidden;background:#000}
.canvas{border-radius:12px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold);border-radius:99px}
.meter.over i{background:var(--danger)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:none;gap:6px}
.tabs button{flex:1;min-height:40px;border:1px solid var(--line);background:var(--panel);border-radius:10px;font-weight:600}
.tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.type-grid button{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-height:46px;padding:6px 8px;font-weight:600;font-size:13px;display:flex;gap:7px;align-items:center;text-align:left}

/* sheets */
#sheet{position:fixed;inset:0;z-index:60;background:rgba(8,12,24,.6);display:none;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
#sheet.open{display:flex}
#sheet .box{background:var(--panel);width:min(980px,100%);max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
#sheet .box>.hd{display:flex;align-items:center;gap:10px}
#sheet .box>.hd h2{flex:1;font-size:21px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.thc{border:2px solid var(--line);border-radius:12px;padding:6px;background:var(--bg);display:flex;flex-direction:column;gap:6px;text-align:left}
.thc.on{border-color:var(--gold)}
.thc .fit{border-radius:7px}
.thc>b{font-size:13px}
.thc>span{font-size:12px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:90;max-width:90%;box-shadow:var(--shadow)}

/* present */
#pres{position:fixed;inset:0;background:#000;z-index:80;display:none;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#pres.open{display:block}
#pres .pstage{position:absolute;inset:0;display:grid;place-items:center}
#pres .pfit{width:min(100vw,calc(100vh*16/9));max-width:100%}
#pres .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);color:#fff}#pres .btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1405}
#pres.speaker .pfit{width:min(62vw,calc(100vh*16/9))}
@media (max-width:700px){#pres.speaker .pfit{width:min(100vw,calc(54vh*16/9))}}
#pres .hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;gap:8px;align-items:center;background:linear-gradient(#000c,#0000);transition:opacity .25s;z-index:3}
#pres .hud.hide{opacity:0;pointer-events:none}
#pres .hud .tm{font-variant-numeric:tabular-nums;font-weight:700;background:#ffffff22;border-radius:8px;padding:6px 10px;font-size:14px}
#pres .hud .tm.over{background:#b3261e}
#pres .zone{position:absolute;top:0;bottom:0;z-index:2}
#pres .pbar{position:absolute;left:0;bottom:0;height:4px;background:var(--gold);z-index:4;transition:width .25s}
#pres .blank{position:absolute;inset:0;background:#000;z-index:5;display:none}
#pres .blank.on{display:block}
#pres.speaker .pstage{inset:0 38% 0 0;padding:0}
#pres .side{display:none}
#pres.speaker .side{display:flex;position:absolute;top:0;right:0;bottom:0;width:38%;flex-direction:column;gap:10px;padding:calc(64px + env(safe-area-inset-top,0px)) 14px 14px;overflow:auto;background:#0d1322;z-index:2}
#pres .side .notes{font-size:19px;line-height:1.45;white-space:pre-wrap;flex:1}
#pres .side .nx{border-radius:8px;overflow:hidden}

#pdot{position:fixed;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#ff2d2d;box-shadow:0 0 0 6px rgba(255,45,45,.3),0 0 22px 6px rgba(255,45,45,.7);z-index:7;pointer-events:none;display:none}
#pres .rchip{font-size:12px;font-weight:700;background:#1f7a55;border-radius:8px;padding:6px 10px;display:none}
#pres .rchip.on{display:inline-block}

/* control remoto (celular) */
#rem{position:fixed;inset:0;z-index:85;background:#0A1020;color:#fff;display:none;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
#rem.open{display:flex;flex-direction:column;gap:12px}
#rem .rh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#rem .rh b{font-family:var(--head);font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rem .tm{font-variant-numeric:tabular-nums;font-weight:700;background:#ffffff1f;border-radius:8px;padding:6px 10px;font-size:14px}
#rem .tm.over{background:#b3261e}
#rem .rst{font-size:12px;font-weight:700;border-radius:8px;padding:6px 10px;background:#7a5a10}
#rem .rst.ok{background:#1f7a55}
#rem .rfit{touch-action:none;border-radius:10px;overflow:hidden;position:relative;box-shadow:0 0 0 1px #ffffff22}
#rem .rnx{display:flex;gap:10px;align-items:center}
#rem .rnx .fit{width:36%;flex:none;border-radius:6px;overflow:hidden}
#rem .rnotes{background:#111a30;border-radius:12px;padding:12px 14px;line-height:1.5;white-space:pre-wrap;flex:1;min-height:90px;overflow:auto}
#rem .rbtns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;position:sticky;bottom:0;padding-top:6px;background:linear-gradient(#0A102000,#0A1020 30%)}
#rem .rbtns .btn{min-height:84px;font-size:20px;justify-content:center;border-radius:14px}
#rem .rwait{padding:30px 10px;text-align:center;color:#b6c2e0}
#rem .rdot{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#ff2d2d;box-shadow:0 0 14px 4px rgba(255,45,45,.7);display:none;pointer-events:none;z-index:5}

/* responsive */
@media (max-width:1060px){
  #studio{grid-template-columns:120px minmax(0,1fr);grid-template-areas:"rail stage" "insp insp"}
}
@media (max-width:700px){
  #studio{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "tabs" "rail" "insp"}
  .tabs{display:flex;grid-area:tabs}
  #rail .slist{flex-direction:row;overflow-x:auto;padding-bottom:6px}
  #rail .sitem{flex:0 0 120px;width:120px}
  #studio[data-tab="slides"] #insp{display:none}
  #studio[data-tab="edit"] #rail{display:none}
  .btn span.t{display:none}
  #pres.speaker .pstage{inset:0 0 46% 0}
  #pres.speaker .side{width:auto;top:auto;height:46%;left:0;padding-top:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ===== Diseños de diapositiva: 11 temas con identidad propia ===== */
const svgUrl = s => 'url("data:image/svg+xml,' + encodeURIComponent(s) + '")';
const SV = (b, v) => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="none">' + (v||'') + b + '</svg>';
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function flame(seed,base,amp,fill,op){const r=rng(seed);let d='M0 720 L0 '+base,x=0;while(x<1280){const w=50+r()*70,h=base-amp*(.4+r()*.9);d+=' Q '+(x+w*.25)+' '+(base-amp*.2)+' '+(x+w*.5)+' '+h+' Q '+(x+w*.75)+' '+(base-amp*.1)+' '+(x+w)+' '+base;x+=w}return '<path d="'+d+' L1280 720 Z" fill="'+fill+'" opacity="'+op+'"/>'}
function wave(y,amp,len,fill){let d='M0 '+y;for(let x=0;x<=1280+len;x+=len)d+=' q '+(len/4)+' '+(-amp)+' '+(len/2)+' 0 t '+(len/2)+' 0';return '<path d="'+d+' L1400 720 L0 720Z" fill="'+fill+'"/>'}
function branch(x0,y0,cx,cy,x2,y2,n,col,col2,seed){const r=rng(seed);let o='<path d="M'+x0+' '+y0+' Q'+cx+' '+cy+' '+x2+' '+y2+'" fill="none" stroke="'+col2+'" stroke-width="5" stroke-linecap="round"/>';
  for(let k=1;k<=n;k++){const t=k/(n+1),mt=1-t;const px=mt*mt*x0+2*mt*t*cx+t*t*x2,py=mt*mt*y0+2*mt*t*cy+t*t*y2;const dx=2*mt*(cx-x0)+2*t*(x2-cx),dy=2*mt*(cy-y0)+2*t*(y2-cy);const a=Math.atan2(dy,dx)*180/Math.PI;const side=k%2?1:-1;const ang=a+side*(42+r()*14);
    o+='<ellipse cx="'+(px+Math.cos(ang*Math.PI/180)*30).toFixed(1)+'" cy="'+(py+Math.sin(ang*Math.PI/180)*30).toFixed(1)+'" rx="34" ry="11" fill="'+col+'" opacity="'+(.75+r()*.2).toFixed(2)+'" transform="rotate('+ang.toFixed(1)+' '+(px+Math.cos(ang*Math.PI/180)*30).toFixed(1)+' '+(py+Math.sin(ang*Math.PI/180)*30).toFixed(1)+')"/>';
    if(k%4===0)o+='<ellipse cx="'+(px+Math.cos((ang+side*30)*Math.PI/180)*16).toFixed(1)+'" cy="'+(py+Math.sin((ang+side*30)*Math.PI/180)*16+14).toFixed(1)+'" rx="9" ry="12" fill="#3B4A1E"/>'}
  return o}
function arches(x,w,cols){let o='',y=34;for(let i=0;i<3;i++){const h=196,c=cols[i%cols.length];const d='M'+x+' '+(y+h)+' L'+x+' '+(y+w/2)+' A'+w/2+' '+w/2+' 0 0 1 '+(x+w)+' '+(y+w/2)+' L'+(x+w)+' '+(y+h)+' Z';
  o+='<path d="'+d+'" fill="'+c+'" stroke="#05050a" stroke-width="6"/><path d="M'+(x+w/2)+' '+y+' L'+(x+w/2)+' '+(y+h)+' M'+x+' '+(y+h*.55)+' L'+(x+w)+' '+(y+h*.55)+'" stroke="#05050a" stroke-width="4" fill="none"/><path d="'+d+'" fill="url(#gl)" opacity=".5"/>';y+=h+18}return o}

const THEMES = [
{id:'medianoche',name:'Medianoche',desc:'Azul profundo y dorado, la identidad de la iglesia',
 vars:'--bg1:#0A1B45;--fg:#F4F0E2;--mut:#AEBCDC;--ac:#D8A93B;--ac2:#8CC3F0;--hl:rgba(216,169,59,.38);--vc:#F4F0E2;--v2:#8CC3F0;--fd:Cinzel,serif;--fb:Mulish,sans-serif;--tt:uppercase;--tw:700;--ls:.04em;--hm:.86;--card:rgba(255,255,255,.07);--line2:rgba(216,169,59,.4);--onac:#0A1B45;--mkr:0;--mkt:45deg',
 css:()=>`.th-medianoche .bg{background:radial-gradient(ellipse at 82% 112%,#1D44A0 0%,transparent 55%),linear-gradient(160deg,#0C2257,#06102D)}
.th-medianoche .orn{background:${svgUrl(SV('<g fill="none" stroke="#D8A93B" stroke-opacity=".2"><circle cx="1280" cy="720" r="250"/><circle cx="1280" cy="720" r="320"/><circle cx="1280" cy="720" r="390"/></g><g fill="#D8A93B"><path d="M58 72 l9 9 -9 9 -9 -9z"/><path d="M1222 72 l9 9 -9 9 -9 -9z"/><path d="M58 648 l9 9 -9 9 -9 -9z"/><path d="M1222 648 l9 9 -9 9 -9 -9z"/></g>'))} 0 0/100% 100%}
.th-medianoche .frm{border:.7u double var(--ac);inset:3u;opacity:.7;border-radius:0}`},
{id:'pergamino',name:'Pergamino',desc:'Manuscrito antiguo: tinta oscura y rojo bermellón',

/* ===== Estructura y diseños de cada tipo de diapositiva ===== */
const SLIDE_CSS = `
.fit{--u:1cqw}
.sl{position:absolute;inset:0;overflow:hidden;color:var(--fg);background:var(--bg1);font-family:var(--fb);font-size:2.4u;line-height:1.35;--hlc:inherit;--is:3.3u}
.sl *{box-sizing:border-box}
.sl .bg,.sl .orn,.sl .wm,.sl .frm{position:absolute;inset:0;pointer-events:none}
.sl .wm{background-position:center;background-repeat:no-repeat;background-size:auto 64%;opacity:var(--wmo,.1)}
.sl .frm{inset:2.4u;border:.18u solid var(--ac);opacity:.55}
.sl .in{position:absolute;inset:0;padding:6u 8.5u 8.5u;display:flex;flex-direction:column;justify-content:center;gap:2.4u;z-index:2}
.sl .ft{position:absolute;left:4.8u;right:4.8u;bottom:2.8u;display:flex;justify-content:space-between;gap:2u;font-size:1.3u;letter-spacing:.05em;color:var(--mut);z-index:3}
.sl .h{font-family:var(--fd);font-weight:var(--tw);text-transform:var(--tt);letter-spacing:var(--ls);line-height:1.08;margin:0;font-size:calc(6u*var(--hm,1));color:var(--hc,var(--fg))}
.sl .sub{font-size:calc(2.7u*var(--bm,1));color:var(--mut);line-height:1.35}
.sl .k{font-size:1.9u;letter-spacing:.22em;text-transform:uppercase;color:var(--ac);font-weight:700}
.sl .rule{width:9u;height:.5u;background:var(--ac);border-radius:.3u}
.sl mark{background:var(--hl);color:var(--hlc);padding:0 .22em;border-radius:.18em}
.sl b{font-weight:800}
.sl sup.vn{font-size:.52em;color:var(--ac);font-weight:700;margin-right:.25em;vertical-align:.55em;line-height:0}
.sl .qz{border-bottom:.2u dotted var(--ac)}
.sl.qzhide .qz{color:transparent;border-bottom:.28u solid var(--ac)}
.sl.hid .rv{opacity:0}.sl .rv{transition:opacity .35s}
/* portada y cierre */
.t-portada .h,.t-cierre .h{font-size:calc(9.4u*var(--hm,1))}
.t-portada.v-a .in,.t-cierre.v-a .in{align-items:flex-start;text-align:left;justify-content:flex-end;padding-left:9u;padding-bottom:15u}
.t-portada.v-b .in,.t-cierre.v-b .in{align-items:center;text-align:center}
.t-portada.v-c .in,.t-cierre.v-c .in{align-items:flex-start;text-align:left;padding-left:9u;padding-right:40u}
.t-portada.v-c .in::after,.t-cierre.v-c .in::after{content:"";position:absolute;right:0;top:0;bottom:0;width:30u;background:var(--ac);opacity:.92}
.t-portada.lt .h,.t-cierre.lt .h{font-size:calc(6.6u*var(--hm,1))}.t-portada.xt .h,.t-cierre.xt .h{font-size:calc(5u*var(--hm,1))}
.t-cierre .ref{font-family:var(--fd);color:var(--ac);font-size:2.8u}
/* sección */
.t-seccion .num{font-family:var(--fd);font-size:calc(25u*var(--hm,1));line-height:.9;color:var(--ac);font-weight:var(--tw)}
.t-seccion .h{font-size:calc(7.2u*var(--hm,1))}
.t-seccion.v-a .in{flex-direction:row;align-items:center;gap:6u;padding-left:10u}
.t-seccion.v-a .tx{flex:1;display:flex;flex-direction:column;gap:2u}
.t-seccion.v-b .in{align-items:center;text-align:center}.t-seccion.v-b .tx{display:flex;flex-direction:column;gap:2u;align-items:center}
.t-seccion.v-c .in{align-items:flex-start;justify-content:flex-end;padding-left:9u;padding-bottom:14u}.t-seccion.v-c .tx{display:flex;flex-direction:column;gap:2u}
/* versículo */
.t-versiculo{--vs:4.2u}
.t-versiculo.s1{--vs:5.6u}.t-versiculo.s2{--vs:4.7u}.t-versiculo.s3{--vs:3.9u}.t-versiculo.s4{--vs:3.2u}.t-versiculo.s5{--vs:2.7u}.t-versiculo.s6{--vs:2.3u}
.t-versiculo .ref{font-family:var(--fd);font-size:calc(3.3u*var(--hm,1));color:var(--ac);font-weight:var(--tw);text-transform:var(--tt);letter-spacing:var(--ls);display:flex;align-items:center;gap:1.4u;flex-wrap:wrap}
.t-versiculo .vlb{display:inline-block;font-family:var(--fb);font-size:1.45u;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:.35u 1u;border-radius:.5u;border:.14u solid currentColor;line-height:1.3}
.t-versiculo .ref .vlb{color:var(--vc)}.t-versiculo .vh .vlb{color:var(--v2)}
.t-versiculo .vt{font-size:var(--vs);line-height:1.3;color:var(--vc);text-wrap:pretty}
.t-versiculo .vl2{margin-top:2.2u;padding-top:2u;border-top:.16u solid var(--line2);display:flex;flex-direction:column;gap:1.2u}
.t-versiculo .vt2{font-size:calc(var(--vs)*.86);line-height:1.3;color:var(--v2)}
.t-versiculo.v-a .in{align-items:center;text-align:center}.t-versiculo.v-a .ref{justify-content:center}
.t-versiculo.v-b .in{flex-direction:row;align-items:center;gap:5u}.t-versiculo.v-b .ref{flex:0 0 23u;flex-direction:column;align-items:flex-start;font-size:calc(4.4u*var(--hm,1))}.t-versiculo.v-b .vbody{flex:1;min-width:0}
.t-versiculo.v-c .vbody{background:var(--card);border:.2u solid var(--line2);border-radius:1.6u;padding:4u 5u}
.t-versiculo .miss{opacity:.55;font-style:italic;font-size:3u}
/* punto, personaje, columnas */
.sl .z1{--is:3.9u}.sl .z2{--is:3.3u}.sl .z3{--is:2.8u}.sl .z4{--is:2.4u}
.sl ul,.sl ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1.8u}
.sl .li{display:flex;gap:1.7u;align-items:flex-start;font-size:calc(var(--is)*var(--bm,1));line-height:1.3}
.sl .li>span{min-width:0}
.sl .mk{flex:none;width:var(--mkw,1.2u);height:var(--mkh,1.2u);background:var(--ac);border-radius:var(--mkr,50%);transform:rotate(var(--mkt,0deg));margin-top:calc(var(--is)*.62 - .6u)}
.t-punto .h{font-size:calc(5.4u*var(--hm,1))}
.t-punto .callout{margin-top:2.6u;font-family:var(--fd);font-size:calc(3.2u*var(--hm,1));color:var(--ac);padding-top:1.8u;border-top:.16u solid var(--ac);line-height:1.2}
.t-punto.v-b .in{flex-direction:row;align-items:center;gap:6u}.t-punto.v-b .h{flex:0 0 31%}.t-punto.v-b .lw{flex:1;min-width:0}
.t-punto.v-c ul{display:grid;grid-template-columns:1fr 1fr;gap:2u}
.t-punto.v-c .li{background:var(--card);border:.15u solid var(--line2);border-radius:1.2u;padding:2.2u 2.4u}
.t-personaje .nm{font-family:var(--fd);font-weight:var(--tw);text-transform:var(--tt);letter-spacing:var(--ls);font-size:calc(7.4u*var(--hm,1));line-height:1.05;color:var(--hc,var(--fg))}
.t-personaje .rf{font-size:2.2u;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);font-weight:700;margin-top:1.4u}
.t-personaje .role{font-size:calc(2.7u*var(--bm,1));color:var(--mut);margin-top:1.6u;line-height:1.35}
.t-personaje.v-a .in{flex-direction:row;align-items:center;gap:6u}.t-personaje.v-a .hd{flex:0 0 38%}.t-personaje.v-a ul{flex:1}
.t-personaje.v-b .hd{padding-bottom:2u;border-bottom:.2u solid var(--ac)}
.t-columnas .h{font-size:calc(5u*var(--hm,1))}
.t-columnas .cols{display:grid;grid-template-columns:1fr 1fr;gap:4.5u;align-items:start}
.t-columnas .col h3{font-family:var(--fd);font-weight:var(--tw);font-size:calc(3.5u*var(--hm,1));color:var(--ac);margin:0 0 1.8u;text-transform:var(--tt);letter-spacing:var(--ls);padding-bottom:1.2u;border-bottom:.2u solid var(--ac)}
.t-columnas.v-b .col{background:var(--card);border-radius:1.4u;padding:3u 3.2u;border:.15u solid var(--line2)}
/* pasos */
.t-pasos .h{font-size:calc(5.2u*var(--hm,1))}
.t-pasos .st{display:flex;gap:2.4u;align-items:center;font-size:calc(var(--is)*var(--bm,1));line-height:1.25}
.t-pasos .sn{flex:none;width:5.2u;height:5.2u;border-radius:50%;background:var(--ac);color:var(--onac);display:grid;place-items:center;font-family:var(--fd);font-size:2.7u;font-weight:var(--tw);line-height:1}
.t-pasos.v-b ol{flex-direction:row;gap:2u;position:relative;align-items:flex-start}
.t-pasos.v-b ol::before{content:"";position:absolute;left:2.6u;right:2.6u;top:2.5u;height:.3u;background:var(--ac);opacity:.5}

let IDBX=null; const MEM={};
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('taller-predicador',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}})}
function kvGet(k){return new Promise(res=>{if(!IDBX)return res(MEM[k]);try{const q=IDBX.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(MEM[k])}catch(e){res(MEM[k])}})}
function kvSet(k,v){MEM[k]=v;return new Promise(res=>{if(!IDBX)return res();try{const t=IDBX.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})}
function kvDel(k){delete MEM[k];return new Promise(res=>{if(!IDBX)return res();try{const t=IDBX.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})}
function kvKeys(){return new Promise(res=>{if(!IDBX)return res(Object.keys(MEM));try{const q=IDBX.transaction('kv').objectStore('kv').getAllKeys();q.onsuccess=()=>res(q.result);q.onerror=()=>res([])}catch(e){res([])}})}

function dbPut(key,obj){return;dbQueue.set(key,obj);setSync('saving');clearTimeout(dbTimer);dbTimer=setTimeout(dbFlush,1400)}
async function dbFlush(){if(dbBusy||!DBC)return;dbBusy=true;let bad=false;
  try{while(dbQueue.size){const [k,v]=dbQueue.entries().next().value;dbQueue.delete(k);try{if(v===null)await DBC.doc(k).delete();else await DBC.doc(k).set(v)}catch(e){bad=true}}}

async function dbPull(){ // trae del respaldo lo que falte o sea más nuevo

    for(const d of snap.docs){const b=d.data()||{};REMOTE[d.id]=b.t||1;

const CANON='Génesis|Éxodo|Levítico|Números|Deuteronomio|Josué|Jueces|Rut|1 Samuel|2 Samuel|1 Reyes|2 Reyes|1 Crónicas|2 Crónicas|Esdras|Nehemías|Ester|Job|Salmos|Proverbios|Eclesiastés|Cantares|Isaías|Jeremías|Lamentaciones|Ezequiel|Daniel|Oseas|Joel|Amós|Abdías|Jonás|Miqueas|Nahúm|Habacuc|Sofonías|Hageo|Zacarías|Malaquías|Mateo|Marcos|Lucas|Juan|Hechos|Romanos|1 Corintios|2 Corintios|Gálatas|Efesios|Filipenses|Colosenses|1 Tesalonicenses|2 Tesalonicenses|1 Timoteo|2 Timoteo|Tito|Filemón|Hebreos|Santiago|1 Pedro|2 Pedro|1 Juan|2 Juan|3 Juan|Judas|Apocalipsis'.split('|');

const nrm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\./g,'').replace(/\b(primera|primero|i)\b(?=\s*[a-z])/g,'1').replace(/\b(segunda|segundo|ii)\b(?=\s*[a-z])/g,'2').replace(/\b(tercera|tercero|iii)\b(?=\s*[a-z])/g,'3').replace(/^libro de\s+/,'').replace(/\s+/g,' ').trim();
const KEYS={};CANON.forEach((n,i)=>{KEYS[nrm(n).replace(/ /g,'')]=i});Object.keys(ALIAS).forEach(k=>{if(!(k in KEYS))KEYS[k]=ALIAS[k]});
function bookIdx(name){const k=nrm(name).replace(/ /g,'');if(k in KEYS)return KEYS[k];if(k.length<3)return -1;const hits=new Set();for(const key in KEYS){if(key.startsWith(k)&&!/^\d?[a-z]{1,3}$/.test(key))hits.add(KEYS[key])}return hits.size===1?[...hits][0]:-1}

function buildBooks(j){ // devuelve array de 66 libros -> capítulos -> versículos
  const out=Array.from({length:66},()=>[]);
  const put=(b,c,v,t)=>{if(b<0||b>65)return;const ch=out[b];while(ch.length<c)ch.push([]);const arr=ch[c-1];while(arr.length<v)arr.push('');arr[v-1]=String(t).trim()};
  if(Array.isArray(j)&&j.length&&j[0]&&Array.isArray(j[0].chapters)){
    j.forEach((bk,i)=>{let b=j.length===66?i:bookIdx(bk.name||bk.abbrev||'');bk.chapters.forEach((ch,ci)=>{(ch||[]).forEach((t,vi)=>put(b,ci+1,vi+1,t))})});return out}
  if(Array.isArray(j)&&j.length&&Array.isArray(j[0])&&typeof j[0][0]==='string'&&Array.isArray(j[0][j[0].length-1])){
    j.forEach((bk,i)=>{const ch=bk[bk.length-1];const b=j.length===66?i:bookIdx(bk[0]);ch.forEach((vs,ci)=>(vs||[]).forEach((t,vi)=>put(b,ci+1,vi+1,t)))});return out}
  if(Array.isArray(j)&&j.length&&j[0]&&('verse' in j[0]||'versiculo' in j[0])){
    j.forEach(r=>{put(bookIdx(r.book||r.libro||r.book_name||''),+(r.chapter||r.capitulo),+(r.verse||r.versiculo),r.text||r.texto)});return out}
  if(j&&typeof j==='object'&&!Array.isArray(j)){
    Object.keys(j).forEach(k=>{const v=j[k];const b=bookIdx(k);
      if(b>=0&&Array.isArray(v)){v.forEach((ch,ci)=>(ch||[]).forEach((t,vi)=>put(b,ci+1,vi+1,t)))}
      else if(b>=0&&v&&typeof v==='object'){Object.keys(v).forEach(c=>{const cv=v[c];if(cv&&typeof cv==='object')Object.keys(cv).forEach(vn=>put(b,+c,+vn,cv[vn]))})}
      else if(typeof v==='string'){const r=parseRef(k);if(r&&r.v1)put(r.b,r.c,r.v1,v)}});return out}
  return null}
function parseBibleText(txt){
  const t=String(txt).trim();if(!t)return null;
  if(t[0]==='['||t[0]==='{'){try{const o=buildBooks(JSON.parse(t.replace(/^﻿/,'')));if(o&&o.some(b=>b.length))return o}catch(e){}}

  for(const ln of t.split(/\r?\n/)){const m=ln.match(/^\s*(.+?)\s+(\d{1,3})\s*[:.]\s*(\d{1,3})\s*[\t\-–.]?\s+(.+)$/);if(!m)continue;const b=bookIdx(m[1]);if(b<0)continue;

  return n>20?out:null}
function lookup(ref,bid){

/* ===== Importar Biblias libres: USFX, USFM (también dentro de un .zip) ===== */
const USFM_CODES='GEN EXO LEV NUM DEU JOS JDG RUT 1SA 2SA 1KI 2KI 1CH 2CH EZR NEH EST JOB PSA PRO ECC SNG ISA JER LAM EZK DAN HOS JOL AMO OBA JON MIC NAM HAB ZEP HAG ZEC MAL MAT MRK LUK JHN ACT ROM 1CO 2CO GAL EPH PHP COL 1TH 2TH 1TI 2TI TIT PHM HEB JAS 1PE 2PE 1JN 2JN 3JN JUD REV'.split(' ');
const USFM_ALT={EZE:25,SOS:21,SON:21,JOE:28,NAH:33,ZEP:35,PHI:49,PHL:49,PHP:49,JAM:58,JMS:58,JUDE:64,RE:65,REV:65,ACTS:43,MRK:40,MAR:40,JHN:42,JOH:42};
const usfmBook=c=>{c=String(c||'').toUpperCase().trim();const i=USFM_CODES.indexOf(c);return i>=0?i:(c in USFM_ALT?USFM_ALT[c]:-1)};
function bAppend(out,b,c,v,t){if(b<0||b>65||c<1||v<1||!t)return;const ch=out[b];while(ch.length<c)ch.push([]);const a=ch[c-1];while(a.length<v)a.push('');a[v-1]=(a[v-1]||'')+t}
function bFinish(out){let n=0;out.forEach(b=>b.forEach(c=>{for(let i=0;i<c.length;i++){c[i]=String(c[i]||'').replace(/\s+/g,' ').trim();if(c[i])n++}}));return n>20?out:null}
const decodeEnt=s=>s.replace(/&#x([0-9a-f]+);/gi,(m,h)=>String.fromCodePoint(parseInt(h,16))).replace(/&#(\d+);/g,(m,d)=>String.fromCodePoint(+d)).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
const USFX_SKIP=new Set(['f','x','fig','id','ide','h','toc','rem','mt','ms','s','r','sts','cl','cp','cd','periph','sp','d']);
function parseUSFX(xml){
  const out=Array.from({length:66},()=>[]);const re=/<(\/?)([A-Za-z][A-Za-z0-9:_-]*)([^>]*?)(\/?)>|([^<]+)/g;
  let m,b=-1,c=0,v=0,skip=0;const stack=[];
  while((m=re.exec(xml))){
    if(m[5]!==undefined){if(!skip&&v>0)bAppend(out,b,c,v,decodeEnt(m[5]));continue}
    const close=m[1]==='/',tag=m[2],attrs=m[3]||'',self=m[4]==='/'||/\/\s*$/.test(attrs);
    const aid=()=>{const k=attrs.match(/\bid\s*=\s*"([^"]*)"/);return k?k[1]:''};
    if(close){for(let i=stack.length-1;i>=0;i--){if(stack[i]===tag){stack.length=i;break}}if(USFX_SKIP.has(tag)&&skip>0)skip--;continue}
    if(tag==='book'){b=usfmBook(aid());c=0;v=0}
    else if(tag==='c'){c=parseInt(aid(),10)||0;v=0}
    else if(tag==='v'){const k=aid().match(/\d+/);v=k?+k[0]:0}
    else if(tag==='ve'){v=0}
    if(!self){stack.push(tag);if(USFX_SKIP.has(tag))skip++}
  }
  return bFinish(out)}
function parseUSFM(texts){
  const out=Array.from({length:66},()=>[]);
  for(const t of texts){let b=-1,c=0,v=0;
    for(let ln of String(t).replace(/\r/g,'').split('\n')){
      let m=ln.match(/^\\id\s+([A-Z0-9]{3})/);if(m){b=usfmBook(m[1]);c=0;v=0;continue}
      if(b<0)continue;
      m=ln.match(/^\\c\s+(\d+)/);if(m){c=+m[1];v=0;continue}
      if(/^\\(s\d?|r|mt\d?|h|toc\d|ide|rem|sts|cl|cp|cd|ms\d?|mr|sp|d|periph|usfm)\b/.test(ln))continue;
      ln=ln.replace(/\\f\s.*?\\f\*/g,'').replace(/\\x\s.*?\\x\*/g,'').replace(/\\fig\s.*?\\fig\*/g,'').replace(/\\\+?w\s+([^|\\]*)(\|[^\\]*)?\\\+?w\*/g,'$1').replace(/^\\(p|m|q\d?|pi\d?|ph\d?|li\d?|nb|b|qc|qr|mi|pc|pr|cls)\b\s*/,'');
      const parts=ln.split(/\\v\s+(\d+)(?:[-,]\d+)?\s*/);
      if(parts[0]&&v)bAppend(out,b,c,v,' '+parts[0].replace(/\\[a-z0-9+]+\*?\s?/gi,''));
      for(let i=1;i<parts.length;i+=2){v=+parts[i];bAppend(out,b,c,v,' '+(parts[i+1]||'').replace(/\\[a-z0-9+]+\*?\s?/gi,''))}
    }}
  return bFinish(out)}

async function bibleFromFile(file){
  const nm=file.name.toLowerCase();
  if(/\.zip$/.test(nm)){await loadScript(L_ZIP);const z=await window.JSZip.loadAsync(file);const es=Object.values(z.files).filter(f=>!f.dir&&!/__MACOSX/.test(f.name));
    const ux=es.find(f=>/usfx.*\.xml$/i.test(f.name))||es.find(f=>/\.xml$/i.test(f.name)&&!/(copyright|license|index)/i.test(f.name));
    if(ux){const r=parseUSFX(await ux.async('string'));if(r)return r}
    const us=es.filter(f=>/\.(usfm|sfm|ptx)$/i.test(f.name));if(us.length){const r=parseUSFM(await Promise.all(us.map(f=>f.async('string'))));if(r)return r}
    const js=es.find(f=>/\.(json|txt)$/i.test(f.name));if(js)return parseBibleText(await js.async('string'));return null}
  const txt=await file.text();const head=txt.slice(0,8000);
  if(/<usfx|<book\s+id=/i.test(head))return parseUSFX(txt);
  if(/\\id\s+[A-Z0-9]{3}/.test(head))return parseUSFM([txt]);
  return parseBibleText(txt)}

function rich(s,quiz){
  let t=String(s==null?'':s);
  if(quiz){let i=0;t=t.split(/(\s+)/).map(w=>{if(/^\s+$/.test(w)||!w)return w;const m=w.match(/^([^A-Za-zÀ-ſ]*)([A-Za-zÀ-ſ]{6,})(.*)$/);if(!m)return w;i++;return i%3===2?m[1]+'\u0001'+m[2]+'\u0002'+m[3]:w}).join('')}
  t=esc(t).replace(/==(.+?)==/g,'<mark>$1</mark>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\{(\d{1,3})\}/g,'<sup class="vn">$1</sup>').replace(/\u0001/g,'<span class="qz">').replace(/\u0002/g,'</span>');
  return t.replace(/\n/g,'<br>')}
const vsz=n=>n<90?'s1':n<150?'s2':n<240?'s3':n<360?'s4':n<520?'s5':'s6';
const qsz=n=>n<40?'q1':n<80?'q2':n<140?'q3':'q4';
function zsz(items,grid){const n=items.length,c=items.reduce((a,x)=>a+x.length,0);if(grid)return n<=4&&c<200?'z2':n<=6&&c<300?'z3':'z4';return n<=3&&c<150?'z1':n<=4&&c<250?'z2':n<=6&&c<420?'z3':'z4'}
const tlen=t=>{const n=String(t||'').length;return n>70?' xt':n>34?' lt':''};

 wrap:e=>{const f=LASTF;if(!f||!f.isConnected){toast('Toca primero el texto y selecciona lo que quieres marcar');return}const m=e.dataset.m,a=f.selectionStart,b=f.selectionEnd;if(a===b){toast('Selecciona primero las palabras');return}f.value=f.value.slice(0,a)+m+f.value.slice(a,b)+m+f.value.slice(b);f.dispatchEvent(new Event('input',{bubbles:true}))},
 lookup:async()=>{const s=sel(),ref=s.f.ref||'';if(!(await ensureBib(S.set.b1))){toast('Primero cargue sus Biblias en el Taller: Ajustes → Texto bíblico');return}await ensureBib(S.set.b2);const r=lookup(ref,S.set.b1);if(!r){toast('No encontré esa cita. Revisa libro, capítulo y versículo');return}
   s.f.text=r.text;s.f.ref=r.label;s.f.ver1=BIB[S.set.b1].name;if(S.set.b2&&BIB[S.set.b2]){const r2=lookup(ref,S.set.b2);if(r2){s.f.text2=r2.text;s.f.ver2=BIB[S.set.b2].name}}

   if(best<0){toast('No encontré un buen punto para dividir');return}const c=clone(s);c.id=uid();s.f.text=t.slice(0,best).trim();c.f.text=t.slice(best).trim();c.f.text2='';s.f.text2=s.f.text2||'';c.f.ref=(s.f.ref||'')+' (cont.)';d.slides.splice(S.sel+1,0,c);saveDeck(d);refreshAll();toast('Dividido en dos diapositivas')},

function aiPrompt(mode,v){const base='Eres un asistente que arma las diapositivas de una enseñanza bíblica para un pastor.\nContexto doctrinal: '+S.set.ctx+'\n';
  const rules='\nReglas:\n- Español de Colombia, lenguaje pastoral natural y cercano; que suene a una persona, no a una máquina.\n- NO escribas el texto de ningún versículo. En las diapositivas "versiculo" entrega solo "ref" (por ejemplo "Hechos 2:38" o "Juan 3:16-18").\n- No incluyas versículo para memorizar, preguntas para conversar, tareas ni indicaciones de cómo dirigir el servicio.\n- Cada punto es corto (máximo 14 palabras). Usa ==así== para resaltar una o dos palabras clave en algunos puntos.\n- Estructura: portada; luego, por cada sección: "seccion" (num en romanos), "versiculo", "punto" y, solo a veces, un "personaje" (uno por sección, nunca varios) o una "columnas" o "pasos"; reparte 2 o 3 diapositivas "frase" con frases de impacto; termina con "cierre".\n- "notes" son apuntes breves para el orador, sin acotaciones de escena.\n- Reparte "min" para que el total quede cerca de '+v.dur+' minutos.\n\nDevuelve SOLO un JSON con esta forma (usa únicamente los tipos que necesites):\n'+AI_SCHEMA;
  if(mode==='topic')return base+'Tarea: crea el esqueleto de un taller sobre el tema «'+v.tema+'» con '+v.sec+' secciones. Tono: '+v.tono+'.'+rules;
  return base+'Tarea: convierte el siguiente sermón en diapositivas. Respeta su orden, su mensaje y sus expresiones; no agregues ideas que no estén en el texto. Si el sermón cita versículos, usa esas referencias.'+rules+'\n\nSERMÓN:\n'+v.text.slice(0,60000)}
function deckFromAI(j,th){const rot={};const slides=(j.slides||[]).filter(s=>s&&TYPES[s.type]).map(s=>{const f={};(FIELDS[s.type]||[]).forEach(x=>{let v=s[x[0]];if(Array.isArray(v))v=v.join('\n');f[x[0]]=v==null?'':String(v)});
    const sl=blank(s.type,f);if(+s.min)sl.min=+s.min;sl.notes=s.notes?String(s.notes):'';const nv=TYPES[s.type].vars;if(nv>1){rot[s.type]=rot[s.type]||0;sl.v='abc'[rot[s.type]%nv];rot[s.type]++}return sl});
  if(!slides.length)throw new Error('La IA no devolvió diapositivas');const d=newDeck(j.title||'Taller nuevo',th,null,slides);d.target=Math.max(5,Math.round(planned(d)/5)*5);
  let miss=0;d.slides.forEach(s=>{if(s.type!=='versiculo'||!s.f.ref)return;const b1=S.set.b1&&BIB[S.set.b1];if(b1){const r=lookup(s.f.ref,S.set.b1);if(r){s.f.text=r.text;s.f.ref=r.label;s.f.ver1=b1.name}else miss++}else miss++;
    const b2=S.set.b2&&BIB[S.set.b2];if(b2){const r2=lookup(s.f.ref,S.set.b2);if(r2){s.f.text2=r2.text;s.f.ver2=b2.name}}});
  return{d,miss}}
const AIERR={not_granted:'No diste permiso para usar Claude en esta app.',sampling_disabled:'Claude no está disponible en tu cuenta para esta función.',rate_limited:'Se alcanzó el límite de uso. Inténtalo más tarde.',session_expired:'Tu sesión venció. Vuelve a abrir la app.',invalid_json:'La respuesta llegó incompleta. Pulsa de nuevo; si se repite, pide menos secciones.',upstream_error:'Hubo un fallo de conexión. Inténtalo de nuevo.',prompt_too_large:'El texto es demasiado largo. Pega una parte.',refused:'No pude armar eso. Cambia el texto y vuelve a intentar.',empty_completion:'No hubo respuesta. Inténtalo de nuevo.'};
async function tpCfg(){let c={};try{const r=await kvGet('tp_cfg');c=(typeof r==='string'?JSON.parse(r):r)||{}}catch(e){}return c}
async function aiJSON(prompt,o){const c=await tpCfg();if(!c.key)throw Object.assign(new Error('Falta la clave de la IA. Póngala en el Taller: Ajustes → Inteligencia artificial.'),{code:'no_key'});
  let res;try{res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:o.signal,headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:c.modelDefault||'claude-sonnet-5-5',max_tokens:12000,stream:true,messages:[{role:'user',content:prompt}]})})}
  catch(e){if(e&&e.name==='AbortError')throw Object.assign(new Error('Detenido'),{code:'cancelled'});throw new Error('No hay conexión con internet. La IA la necesita.')}
  if(!res.ok){let j=null;try{j=await res.json()}catch(e){}const m=(j&&j.error&&j.error.message)||'';throw new Error(res.status===401||res.status===403?'La clave no fue aceptada. Revísela en Ajustes del Taller.':/credit balance/i.test(m)?'La cuenta de Anthropic no tiene saldo.':res.status===529||res.status>=500?'Claude está muy ocupado. Intente en un minuto.':(m||('Error '+res.status)))}
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='',text='';
  try{for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n\n'))>=0){const ev=buf.slice(0,i);buf=buf.slice(i+2);const line=ev.split('\n').find(l=>l.startsWith('data:'));if(!line)continue;let j;try{j=JSON.parse(line.slice(5))}catch(e){continue}
      if(j.type==='content_block_delta'&&j.delta&&j.delta.type==='text_delta'){text+=j.delta.text;if(o.onText)o.onText({text})}}}}
  catch(e){if(e&&e.name==='AbortError')throw Object.assign(new Error('Detenido'),{code:'cancelled'});throw e}
  const a=text.indexOf('{'),b=text.lastIndexOf('}');if(a<0||b<a)throw Object.assign(new Error('x'),{code:'invalid_json'});
  try{return JSON.parse(text.slice(a,b+1))}catch(e){throw Object.assign(new Error('x'),{code:'invalid_json'})}}
async function aiGo(){const out=$('#aiout');
  const v={tema:($('#aitema')||{}).value||'',sec:+($('#aisec')||{}).value||3,tono:($('#aitono')||{}).value||'pastoral',dur:+$('#aidur').value||50,text:($('#aitext')||{}).value||''};
  if(AIM==='topic'&&!v.tema.trim()){out.textContent='Escribe el tema del taller.';return}if(AIM==='sermon'&&v.text.trim().length<200){out.textContent='Pega el sermón completo (muy corto por ahora).';return}
  const th=$('#aith').value;AICTL=new AbortController();$('#aistop').hidden=false;$('#aigo').disabled=true;out.textContent='Pensando…';
  try{await ensureBib(S.set.b1);await ensureBib(S.set.b2);const j=await aiJSON(aiPrompt(AIM,v),{signal:AICTL.signal,onText:({text})=>{out.textContent='Escribiendo… '+Math.round(text.length/100)/10+' mil caracteres'}});
    const r=deckFromAI(j,th);S.decks[r.d.id]=r.d;saveDeck(r.d);closeSheet();openDeck(r.d.id);toast(r.miss?'Listo. A '+r.miss+' versículos les falta el texto: cargue sus Biblias en el Taller o péguelo.':'Listo: revisa y ajusta tu taller.',4200)}
  catch(e){if(e&&e.code==='cancelled')out.textContent='Detenido.';else out.textContent=(e&&AIERR[e.code])||(e&&e.message)||'No se pudo crear el taller.'}
  finally{AICTL=null;const b=$('#aistop');if(b)b.hidden=true;const g=$('#aigo');if(g)g.disabled=false}}
Object.assign(window.ACT2,{ai:()=>{closeSheet();openSheet(aiHTML())},aimode:e=>{AIM=e.dataset.m;openSheet(aiHTML())},aigo:()=>aiGo(),aistop:()=>{if(AICTL)AICTL.abort()}});

/* ===== Desde una enseñanza del Taller: arma la presentación sin IA ===== */
let ENSCACHE=null,LIBCACHE=null,ENSQ='',ENSTAB='mias';
async function myEns(){if(ENSCACHE)return ENSCACHE;let a=[];try{const r=await kvGet('tp_sermones');a=(typeof r==='string'?JSON.parse(r):r)||[]}catch(e){}
  ENSCACHE=a.filter(x=>x&&x.ensenanza&&x.ensenanza.trim()).sort((x,y)=>(y.actualizado||'').localeCompare(x.actualizado||''));return ENSCACHE}
async function libItems(){if(LIBCACHE)return LIBCACHE;try{const r=await fetch('biblioteca.json');const d=await r.json();LIBCACHE=d.items.map((it,i)=>Object.assign(it,{i}))}catch(e){LIBCACHE=[]}return LIBCACHE}
function libMd(it){const L=['# '+(it.T||it.t)];let i=0;const P=it.p;
  if(P[0]&&P[0][0]==='p'&&P[0][1]===it.S){L.push('*'+it.S+'*');i=1}
  for(;i<P.length;i++){const [k,t]=P[i];
    if(k==='h'&&/^vers[ií]culo clave$/i.test(t.replace(/:$/,'')))continue;
    if(k==='ref'){const nx=P[i+1];if(nx&&nx[0]==='q'){L.push('> '+t+' — '+nx[1].replace(/^\((RVR1960|NTV|NVI)\)\s*/,''));i++}else L.push('> '+t);continue}
    if(k==='q'){L.push('> '+t);continue}
    if(k==='h'){L.push('## '+t.replace(/:$/,''));continue}
    if(k==='li'){L.push('- '+t);continue}
    if(k==='i'){L.push('**'+t.replace(/\*/g,'')+'**');continue}
    L.push(t)}
  return L.join('\n')}
const nq=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
async function ensListHTML(){
  const mine=await myEns(),lib=ENSTAB==='archivo'?await libItems():[];const q=nq(ENSQ);
  const rows=ENSTAB==='mias'?mine.filter(x=>!q||nq(x.titulo+' '+(x.texto||'')).includes(q)).slice(0,60).map(x=>'<button class="btn" style="justify-content:flex-start;min-height:52px;white-space:normal;text-align:left" data-act="pickens" data-id="'+esc(x.id)+'"><span><b>'+esc(x.titulo||'Sin título')+'</b><br><span class="hint">'+esc(x.texto||'')+'</span></span></button>')
    :lib.filter(x=>!q||nq(x.t+' '+(x.r||'')).includes(q)).slice(0,60).map(x=>'<button class="btn" style="justify-content:flex-start;min-height:52px;white-space:normal;text-align:left" data-act="picklib" data-i="'+x.i+'"><span><b>'+esc(x.t)+'</b><br><span class="hint">'+esc(x.r||'')+'</span></span></button>');
  return rows.length?rows.join(''):'<p class="hint">'+(ENSTAB==='mias'&&!mine.length?'Todavía no tiene enseñanzas preparadas en el Taller.':'No encontré nada con esa búsqueda.')+'</p>'}
async function fromEnsSheet(){
  openSheet(sheetHead('Desde una enseñanza')+'<p class="hint" style="margin:0">Elija una enseñanza. La app arma las diapositivas con su título, el versículo inicial (de su Biblia), cada punto, sus frases de impacto y la conclusión. El desarrollo de cada punto queda en las notas del orador.</p>'+
   '<div class="row"><button class="btn'+(ENSTAB==='mias'?' pri':'')+'" data-act="enstab" data-t="mias">Mis enseñanzas</button><button class="btn'+(ENSTAB==='archivo'?' pri':'')+'" data-act="enstab" data-t="archivo">Mi archivo</button></div>'+
   '<input class="inp" type="search" id="ensq" placeholder="Buscar por título o pasaje" value="'+esc(ENSQ)+'"><div id="enslist" style="display:grid;gap:8px"><p class="hint">Cargando…</p></div>');
  $('#enslist').innerHTML=await ensListHTML();
  $('#ensq').oninput=async e=>{ENSQ=e.target.value;$('#enslist').innerHTML=await ensListHTML()}}
function supToBraces(t,v1){
  t=String(t||'').trim();const SUPS='⁰¹²³⁴⁵⁶⁷⁸⁹';
  if(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/.test(t)){t=t.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,m=>' {'+[...m].map(c=>SUPS.indexOf(c)).join('')+'} ').replace(/\s+/g,' ').trim();return v1?'{'+v1+'} '+t:t}
  if(/^\d{1,3}\s/.test(t)&&/\s\d{1,3}\s{1,2}\S/.test(t))return t.replace(/(^|\s)(\d{1,3})\s+(?=\S)/g,(m,a,n)=>a+'{'+n+'} ').trim();
  return t.replace(/^\d{1,3}\s+/,'')}
const mdClean=t=>String(t||'').replace(/\*\*/g,'').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1$2').replace(/«([^»]*)»\s*\(([^)]*)\)/g,'«$1» ($2)').trim();
function shortIdea(t){let x=mdClean(t);const m=String(t).match(/^\*\*(.+?)\*\*/);if(m)x=mdClean(m[1]);else{x=x.split(/(?<=[.:;!?])\s/)[0]}
  x=x.replace(/[.:]$/,'');const w=x.split(/\s+/);return w.length>18?w.slice(0,16).join(' ')+'…':x}
function deckFromMd(md,meta){
  const L=String(md).replace(/\r/g,'').split('\n');const slides=[];let title=meta.titulo||'Enseñanza',sub='',mainRef='',sec=null,buf=[],inConc=false,skip=false,nf=0;const conc=[];
  const flush=()=>{if(!sec||!buf.length){buf=[];return}
    for(let k=0;k<buf.length;k+=5){const part=buf.slice(k,k+5);const sl=blank('punto',{title:sec.title,items:part.map(b=>b.idea).join('\n')});
      sl.notes=part.map(b=>'• '+b.full).join('\n\n');sl.min=Math.max(3,Math.min(10,part.length*2));slides.push(sl)}buf=[]};
  for(let i=0;i<L.length;i++){const l=L[i].trim();if(!l)continue;let m;
    if((m=l.match(/^# (.+)/))){title=mdClean(m[1]);continue}
    if(!slides.length&&!sub&&(m=l.match(/^\*([^*].*)\*$/))){sub=m[1];continue}
    if((m=l.match(/^> (?!\()([^—]+?)\s+—\s+(.+)$/))){if(skip)continue;flush();const ref=m[1].trim();if(!mainRef)mainRef=ref;const v1=(ref.match(/:(\d+)/)||[])[1];
      const f={ref,text:supToBraces(m[2],v1),ver1:'RVR1960'};const nx=(L[i+1]||'').trim().match(/^> \(([^)]+)\)\s*(.+)$/);if(nx){f.text2=supToBraces(nx[2],v1);f.ver2=nx[1];i++}
      const sl=blank('versiculo',f);sl.min=2;if(f.text.length>480)sl.v='c';slides.push(sl);continue}
    if(/^>/.test(l))continue;
    if(/^#{3,6} /.test(l)){flush();skip=true;continue}
    if((m=l.match(/^## (.+)/))){flush();skip=false;const h=mdClean(m[1]);
      if(/^introducci/i.test(h)){sec=null;inConc=false;continue}
      if(/^conclusi/i.test(h)){sec=null;inConc=true;continue}
      inConc=false;const mm=h.match(/^([IVXLC]+)[.)]\s*(.+)$/);sec={num:mm?mm[1]:'',title:mm?mm[2]:h};
      const s=blank('seccion',{num:sec.num,title:sec.title});s.v='abc'[(slides.filter(x=>x.type==='seccion').length)%3];s.min=1;slides.push(s);continue}
    if(skip)continue;
    if((m=l.match(/^\*\*([^*]+)\*\*$/))){const t=m[1].trim();if(inConc){conc.push(t);continue}flush();const s=blank('frase',{text:t});s.min=1;s.v='abc'[nf++%3];slides.push(s);continue}
    if((m=l.match(/^[-•*] (.+)/))&&sec){buf.push({idea:shortIdea(m[1]),full:mdClean(m[1])});continue}
  }
  flush();
  const p=blank('portada',{kicker:'Enseñanza',title,sub});p.min=1;slides.unshift(p);
  const c=blank('cierre',{title:conc[0]||'Conclusión',sub:conc[1]||'',ref:mainRef});c.min=3;slides.push(c);
  const d=newDeck(title,'medianoche',null,slides);d.target=Math.max(10,Math.round(planned(d)/5)*5);d.fromEns=meta.id||null;return d}
async function makeDeck(md,meta){const d=deckFromMd(md,meta);
  /* el versículo sale de la Biblia del pastor cuando la tiene cargada */
  const B1=await ensureBib(S.set.b1);if(B1){for(const s of d.slides){if(s.type!=='versiculo'||!s.f.ref)continue;const r=lookup(s.f.ref,S.set.b1);if(r){s.f.text=r.text;s.f.ver1=B1.name}
    if(!s.f.text2&&S.set.b2&&s===d.slides.find(x=>x.type==='versiculo')){const B2=await ensureBib(S.set.b2);const r2=B2&&lookup(s.f.ref,S.set.b2);if(r2){s.f.text2=r2.text;s.f.ver2=B2.name}}}}
  S.decks[d.id]=d;saveDeck(d);closeSheet();openDeck(d.id);toast('Listo: '+d.slides.length+' diapositivas. Revíselas y ajuste lo que quiera.',3800)}
async function createFromEns(id){const a=await myEns();const s=a.find(x=>x.id===id);if(!s){toast('No encontré esa enseñanza');return}await makeDeck(s.ensenanza,{titulo:s.titulo,id:s.id})}
Object.assign(window.ACT2,{fromens:()=>fromEnsSheet(),enstab:e=>{ENSTAB=e.dataset.t;fromEnsSheet()},
  pickens:e=>createFromEns(e.dataset.id),
  picklib:async e=>{const it=(await libItems()).find(x=>x.i===+e.dataset.i);if(it)await makeDeck(libMd(it),{titulo:it.t})}});
