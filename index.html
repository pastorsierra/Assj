<style>
/* Layout: barra lateral de herramientas agrupadas (Escritura · Estudio · Preparación · Sermones) + mesa de trabajo amplia; en teléfono, pestañas arriba. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --sunk:#EBF1F8; --ink:#14223A; --muted:#5A6A82; --line:#D9E1EC;
  --azul:#1F4E78; --azul-ink:#FFFFFF; --oro:#A97A12; --oro-soft:#FBF1D9; --verde:#00695C; --mark:#FFE9A3;
  --danger:#A23B32;
  --f-text:"Literata","Noto Serif Hebrew",Georgia,"Times New Roman",serif;
  --f-ui:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1520; --surface:#131E2E; --sunk:#192940; --ink:#E4EBF5; --muted:#93A3BA; --line:#24354D;
  --azul:#7DB0E3; --azul-ink:#0D1520; --oro:#D8AE4E; --oro-soft:#2A2414; --verde:#5CC2AE; --mark:#5A4A12; --danger:#E08A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1520; --surface:#131E2E; --sunk:#192940; --ink:#E4EBF5; --muted:#93A3BA; --line:#24354D;
  --azul:#7DB0E3; --azul-ink:#0D1520; --oro:#D8AE4E; --oro-soft:#2A2414; --verde:#5CC2AE; --mark:#5A4A12; --danger:#E08A80; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* barra lateral */
.side{border-right:1px solid var(--line);background:var(--surface);padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px 16px}
.brand b{font-family:var(--f-text);font-weight:600;font-size:19px;letter-spacing:.2px;color:var(--azul)}
.brand span{font-size:12px;color:var(--muted)}
.navgroup{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.navgroup h6{margin:8px 8px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--oro);font-weight:700}
.nav{all:unset;cursor:pointer;display:block;padding:7px 10px;border-radius:8px;color:var(--ink);font-weight:500;font-size:14px}
.nav:hover{background:var(--sunk)}
.nav[aria-current="page"]{background:var(--azul);color:var(--azul-ink)}
.nav:focus-visible{outline:2px solid var(--oro)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top .mbrand{display:none;font-family:var(--f-text);font-weight:600;color:var(--azul);white-space:nowrap}
.jump{flex:1;min-width:0;display:flex;gap:8px}
.jump input{flex:1;min-width:0}
.tabs{display:none}
.content{padding-block:22px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));width:100%;max-width:1060px}
/* controles */
input[type=text],input[type=search],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{resize:vertical;line-height:1.55}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--azul)}
.btn.primary{background:var(--azul);border-color:var(--azul);color:var(--azul-ink)}
.btn.gold{background:var(--oro);border-color:var(--oro);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--azul)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
h1{font-family:var(--f-text);font-weight:600;font-size:28px;line-height:1.2;margin:0 0 4px;text-wrap:balance}
h2{font-family:var(--f-text);font-weight:600;font-size:20px;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 18px;max-width:68ch}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.chip:hover{background:var(--oro-soft)}
.chip:focus-visible{outline:2px solid var(--oro)}
.notice{font-size:13px;color:var(--muted);border-left:3px solid var(--oro);padding:4px 0 4px 10px;margin:14px 0}
/* inicio */
.tool-card{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tool-card:hover{border-color:var(--azul)}
.tool-card:focus-visible{outline:2px solid var(--oro)}
.tool-card b{font-size:15px}
.tool-card span{font-size:13px;color:var(--muted)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 10px}
/* biblia */
.reader-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.reader-bar select{width:auto;max-width:100%}
.chapter{font-family:var(--f-text);font-size:18px;line-height:1.75;max-width:68ch}
.chapter h2{font-size:24px;margin-bottom:12px;color:var(--azul)}
.vs{cursor:pointer;border-radius:4px;padding:1px 2px;-webkit-tap-highlight-color:transparent}
.vs sup{font-family:var(--f-ui);font-size:11px;color:var(--oro);font-weight:700;margin-right:3px;vertical-align:super}
.vs:hover{background:var(--sunk)}
.vs.sel{background:var(--mark)}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 -6px 20px rgba(10,20,40,.08)}
.actionbar .ref{font-weight:700;color:var(--azul);margin-right:6px}
/* concordancia */
.hit{padding:10px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px}
.hit a{color:var(--azul);font-weight:700;text-decoration:none;cursor:pointer;font-size:13.5px}
.hit .t{font-family:var(--f-text);font-size:16px;line-height:1.6}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.dist{display:flex;flex-direction:column;gap:3px;max-height:340px;overflow:auto}
.dist button{all:unset;cursor:pointer;display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:12.5px;padding:2px 4px;border-radius:5px}
.dist button:hover{background:var(--sunk)}
.dist .bar{height:7px;border-radius:4px;background:var(--azul);opacity:.75}
.dist .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.conc-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:22px;align-items:start}
/* herramientas IA */
.toolform{display:grid;gap:12px}
.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:600}
.output{margin-top:18px}
.md{font-family:var(--f-text);font-size:16.5px;line-height:1.7;max-width:72ch}
.md blockquote.otra{border-left-color:var(--oro);color:#7A5A00;background:var(--oro-soft);font-style:normal}
.md h3{font-family:var(--f-text);font-size:19px;color:var(--azul);margin:18px 0 6px}
.md h4{font-family:var(--f-ui);font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--oro);margin:20px 0 6px}
.md p{margin:0 0 10px}
.md ul,.md ol{margin:0 0 12px;padding-left:22px}
.md li{margin:3px 0}
.md blockquote{margin:8px 0 12px;padding:6px 14px;border-left:3px solid var(--verde);color:var(--verde);font-style:italic}
.md strong{font-weight:600}
.md .bq{color:var(--verde);font-style:italic}
.prep-out{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.reflink{color:var(--verde);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--verde) 40%,transparent);text-underline-offset:3px;cursor:pointer}
.out-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-style:italic}
.dot{width:8px;height:8px;border-radius:50%;background:var(--oro);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}
.history{margin-top:26px}
.history ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.history button{all:unset;cursor:pointer;font-size:13.5px;color:var(--azul)}
.history button:hover{text-decoration:underline}
/* chat */
.chat{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.bubble{max-width:78ch;border-radius:12px;padding:10px 14px}
.bubble.me{align-self:flex-end;background:var(--azul);color:var(--azul-ink);font-family:var(--f-ui)}
.bubble.ai{background:var(--surface);border:1px solid var(--line)}
/* sermones */
.sermon-list{display:flex;flex-direction:column;gap:8px}
.sitem{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.sitem:hover{border-color:var(--azul)}
.sitem:focus-visible{outline:2px solid var(--oro)}
.sitem b{font-family:var(--f-text);font-size:16.5px;font-weight:600}
.sitem small{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:0 0 16px}
.cat-tile{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-height:54px}
.cat-tile:hover{border-color:var(--azul)}
.cat-tile:focus-visible{outline:2px solid var(--oro)}
.cat-tile[aria-pressed=true]{border-color:var(--azul);background:color-mix(in srgb,var(--azul) 9%,var(--surface));box-shadow:inset 0 0 0 1px var(--azul)}
.cat-tile b{font-size:14px;font-weight:600;line-height:1.25}
.cat-tile span{font-size:12px;color:var(--muted)}
.bigsearch{position:relative;margin:0 0 14px}
.bigsearch input{font-size:16px;padding:12px 14px;border-radius:12px;border-width:1.5px}
.bigsearch input:focus{border-color:var(--azul);outline:none}
.snip{display:block;grid-column:1/-1;font-size:13px;color:var(--ink);opacity:.85;margin-top:2px}
.snip mark{background:var(--oro-soft);color:inherit;border-radius:3px;padding:0 2px}
.libread .md h2{margin-top:18px}
.serie-box{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:12px;border-radius:10px;background:var(--sunk)}
.serie-box[hidden],.sheet-bg[hidden]{display:none}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;align-self:start}
.pill.idea{background:var(--sunk);color:var(--muted)}
.pill.prep{background:var(--oro-soft);color:var(--oro)}
.pill.listo{background:color-mix(in srgb,var(--verde) 16%,transparent);color:var(--verde)}
.pill.predicado{background:color-mix(in srgb,var(--azul) 16%,transparent);color:var(--azul)}
.editor{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.editor .wide{grid-column:1/-1}
.mat{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;margin-top:10px}
.mat header{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.mat .md{font-size:15.5px}
.savestate{font-size:12.5px;color:var(--muted)}
/* hoja de pasaje */
.sheet-bg{position:fixed;inset:0;background:rgba(8,14,24,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:min(720px,100%);max-height:80vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet .chapter{font-size:17px}
.picker{display:flex;flex-direction:column;gap:6px;margin-top:12px}
/* responsive */
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .top{flex-wrap:wrap}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);scrollbar-width:none}
  .tabs .nav{white-space:nowrap;padding:6px 11px;font-size:13.5px}
  .conc-layout{grid-template-columns:minmax(0,1fr)}
  .hit{grid-template-columns:minmax(0,1fr);gap:2px}
  h1{font-size:24px}
}
/* ===== Estilo formal y sobrio ===== */
[hidden]{display:none!important}
:root{--bg:#F6F5F1;--surface:#FFFFFF;--sunk:#F0EEE8;--ink:#1B2230;--muted:#69707C;--line:#E2DFD7;--azul:#1D3557;--oro:#8C6D2E;--oro-soft:#F5EEDD;--verde:#1F6B57;--mark:#F3E3B5;--r:4px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111418;--surface:#171B21;--sunk:#1E232B;--ink:#E7E5E0;--muted:#9A9FA8;--line:#2B313A;--azul:#9DB7D9;--azul-ink:#111418;--oro:#C9A866;--oro-soft:#2A2519;--verde:#7CC3AE;--mark:#4A3F1F}}
:root[data-theme="dark"]{--bg:#111418;--surface:#171B21;--sunk:#1E232B;--ink:#E7E5E0;--muted:#9A9FA8;--line:#2B313A;--azul:#9DB7D9;--azul-ink:#111418;--oro:#C9A866;--oro-soft:#2A2519;--verde:#7CC3AE;--mark:#4A3F1F}
.side{background:var(--bg)}
.brand b{font-size:18px;color:var(--ink);letter-spacing:.01em}
.brand span{letter-spacing:.08em;text-transform:uppercase;font-size:10.5px}
.navgroup h6{color:var(--muted);font-weight:600;letter-spacing:.16em}
.nav{border-radius:0;font-weight:500;color:var(--muted)}
.nav:hover{background:transparent;color:var(--ink)}
.nav[aria-current="page"]{background:transparent;color:var(--ink);font-weight:700;box-shadow:inset 2px 0 0 var(--azul)}
.tabs .nav[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--azul)}
h1{font-weight:500;font-size:27px;letter-spacing:-.005em}
h2{font-weight:500;font-size:18px}
.section-head{border-bottom:1px solid var(--line);padding-bottom:6px}
.label{letter-spacing:.14em;font-weight:600}
.btn{border-radius:3px;font-weight:500;font-size:13.5px;padding:7px 13px}
.btn.primary{background:var(--azul);border-color:var(--azul)}
.btn.gold{background:var(--surface);border-color:var(--oro);color:var(--oro)}
.btn.gold:hover{background:var(--oro-soft)}
.btn.ghost{color:var(--ink);padding-left:0}
input[type=text],input[type=search],input[type=date],select,textarea{border-radius:3px}
.card,.tool-card,.mat{border-radius:4px;box-shadow:none}
.tool-card b{font-family:var(--f-text);font-weight:500;font-size:16px}
.chip{border-radius:3px}
.notice{border-left-color:var(--line)}
.sermon-list{gap:0;border-top:1px solid var(--line)}
.sitem{grid-template-columns:minmax(0,1fr) auto auto;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:13px 4px}
.sitem:hover{background:var(--surface)}
.sitem b{font-weight:500}
.pill{border-radius:2px;font-weight:600;letter-spacing:.1em;font-size:10px;background:transparent!important;border:1px solid currentColor;padding:2px 6px}
.tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted);border:1px solid var(--line);padding:2px 6px;border-radius:2px;align-self:start;white-space:nowrap}
.tag.ready{color:var(--verde);border-color:color-mix(in srgb,var(--verde) 45%,transparent)}
.cat-grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 22px;border-top:1px solid var(--line);margin-bottom:22px}
.cat-tile{flex-direction:row;align-items:baseline;gap:10px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:10px 2px;min-height:0}
.cat-tile:hover{border-color:var(--line);color:var(--azul)}
.cat-tile i{font-style:normal;font-family:var(--f-text);font-size:12.5px;color:var(--oro);min-width:20px;font-variant-numeric:tabular-nums}
.cat-tile b{flex:1;font-weight:500;font-size:14px}
.cat-tile span{font-variant-numeric:tabular-nums}
.cat-tile[aria-pressed=true]{background:transparent;box-shadow:inset 0 -2px 0 var(--azul);border-color:var(--line)}
.cat-tile[aria-pressed=true] b{color:var(--azul);font-weight:700}
.bigsearch input{border-radius:3px;border-width:1px;padding:13px 14px}
.serie-box{border-radius:3px}
.paperwrap{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
.paperbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:6px}
.md.paper{max-width:70ch;margin:0 auto;padding:18px 4px 6px}
.md.paper > h3:first-child{text-align:center;font-size:19px;letter-spacing:.02em;margin-top:0}
.md.paper > h3:first-child + p{text-align:center;color:var(--muted)}
.md.paper h3{font-weight:600}
.md.paper h4{color:var(--oro)}
#ensbox,#lres,#prepcard{scroll-margin-top:96px}
.savebar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:10px 14px;margin:0 0 14px;font-size:14px}
.sitem.flash{background:var(--oro-soft);box-shadow:inset 3px 0 0 var(--oro)}
.verlinks{margin:16px 0 0;padding-top:12px;border-top:1px solid var(--line)}
a.btn{text-decoration:none;color:inherit;display:inline-block}

.pu{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;--pbg:#FBFAF7;--pfg:#1A1A1A;--pmut:#6F6F6F;--pline:#E3E0D8;--pq:#1F6B57;--pov:#7A5A00;--pacc:#1D3557;--pimp:#8E2A22;--phl:#FCEBB0;background:var(--pbg);color:var(--pfg)}

@media (max-width:980px){.arm{grid-template-columns:minmax(0,1fr)}.arm-tabs{display:inline-flex;margin-bottom:4px}.arm[data-show="f"] .arm-prev,.arm[data-show="p"] .arm-form{display:none}.arm-sticky{position:static;max-height:none}.arm-vin{grid-template-columns:minmax(0,1fr) auto}.arm-vin textarea{grid-column:1/2}.arm-tools{top:120px}.arm-actions{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.arm-actions .btn{flex:none}}

/* consulta: historial */
.chatbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0 10px;margin-bottom:6px;border-bottom:1px solid var(--line);font-size:13.5px;position:sticky;top:74px;z-index:3;background:var(--bg)}
.chatbar:empty{display:none}
.qa{display:flex;flex-direction:column;gap:12px;border-radius:4px}
.qrow{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.qrow .bubble.me{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.qdel{opacity:.55}.qrow:hover .qdel,.qdel.danger{opacity:1}
.chat.selecting .qa{cursor:pointer;padding:8px;border:1px solid var(--line)}
.chat.selecting .qa.on{border-color:var(--azul);background:color-mix(in srgb,var(--azul) 7%,transparent)}
.chat.selecting .bubble.ai{max-height:120px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)}
.qchk{width:22px;height:22px;flex:none;border:1.5px solid var(--line);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:#fff;margin-right:auto}
.qa.on .qchk{background:var(--azul);border-color:var(--azul)}
.decide{border:1px solid var(--line);border-left:3px solid var(--azul);background:var(--surface);padding:12px 14px;margin-bottom:12px;border-radius:3px;font-size:14.5px}
.decide.quiet{border-left-color:var(--line);color:var(--muted);font-size:13.5px;padding:8px 12px}
.seg{display:inline-flex}.seg .btn{border-radius:0}.seg .btn:first-child{border-radius:3px 0 0 3px}.seg .btn:last-child{border-radius:0 3px 3px 0;margin-left:-1px}
.seg .btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.askbox{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.card.empty{background:transparent;border-style:dashed}
code{font-size:12.5px;background:var(--sunk);padding:1px 4px;border-radius:2px}
.bubble{border-radius:4px}
.sheet{border-radius:6px 6px 0 0}


/* ===== Versiones nuevas ===== */
.vnbanner{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--azul);border-left-width:5px;border-radius:14px;padding:14px 16px;margin:0 0 14px;cursor:pointer;color:inherit;font:inherit}
.disbanner{margin-top:10px;border-color:var(--oro,#C0802B)}
.vnbanner b{font-size:16px}.vnbanner span{grid-column:1;font-size:14px;opacity:.8}.vnbanner i{grid-column:2;grid-row:1/3;align-self:center;font-style:normal;font-size:26px;opacity:.6}
.vncmp{margin:14px 0}.vncmp.vn-lado{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.vncmp.vn-orig .vncol:last-child,.vncmp.vn-nueva .vncol:first-child{display:none}
.vnlab{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0 0 8px;opacity:.7}.vnlab.new{color:var(--azul);opacity:1}
.vnnote{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
/* ===== Navegación: barra inferior de 5 botones (iPad e iPhone) ===== */
.app{grid-template-columns:minmax(0,1fr)!important}
.side{display:none!important}
.top{flex-wrap:nowrap!important;gap:8px}
.top .mbrand{display:block!important;font-size:16px}
.top .gear{display:inline-flex;align-items:center;justify-content:center;width:40px;padding:7px 0}
.top .gear svg,.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.content{margin-inline:auto;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))!important}
.tabs{display:flex!important;position:fixed;left:0;right:0;bottom:0;z-index:15;justify-content:center;gap:4px;overflow:visible!important;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))!important;background:color-mix(in srgb,var(--surface) 94%,transparent)!important;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);border-bottom:0!important}
.tabs .nav{flex:1;max-width:150px;display:flex!important;flex-direction:column;align-items:center;gap:3px;padding:6px 2px!important;font-size:11.5px!important;font-weight:600;color:var(--muted);text-align:center;border-radius:12px;box-shadow:none!important;text-decoration:none;white-space:nowrap}
.tabs .nav svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabs .nav[aria-current="page"]{color:var(--azul);background:color-mix(in srgb,var(--azul) 10%,transparent);font-weight:700}
.actionbar{bottom:calc(66px + env(safe-area-inset-bottom,0px))!important;padding-bottom:10px!important;z-index:14}
@media (max-width:560px){.top .mbrand{display:none!important}}
/* inicio */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.hello h1{margin:0}
.hello .date{color:var(--muted);font-size:14px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:6px 0 26px}
.act{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:16px;border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:118px}
.act:hover{border-color:var(--azul)}
.act .ico{width:28px;height:28px;color:var(--azul)}
.act b{font-size:15.5px;font-weight:700;color:var(--ink)}
.act span{font-size:13px;color:var(--muted);line-height:1.4}
.act.main{background:var(--azul);border-color:var(--azul)}
.act.main b,.act.main span,.act.main .ico{color:var(--azul-ink)}
.act.main span{opacity:.85}
@media (max-width:699px){.acts{grid-template-columns:repeat(3,1fr);gap:8px}.act b{font-size:13.5px}.act.main{grid-column:1/-1}.act{min-height:0;padding:14px}.act:not(.main) span{display:none}}
#recent{display:flex;flex-direction:column}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 16px}
.seg2 button{all:unset;cursor:pointer;padding:8px 16px;font-weight:600;font-size:14px;color:var(--muted)}
.seg2 button[aria-current="page"]{background:var(--azul);color:var(--azul-ink)}
.tgroup{margin:18px 0 8px}
.tool-card .ico{width:22px;height:22px;color:var(--azul);margin-bottom:4px}
.cmpv .vrow{padding:10px 0;border-bottom:1px solid var(--line)}
.cmpv .vrow b{display:block;font-size:12.5px;letter-spacing:.08em;color:var(--oro);margin-bottom:4px}
.ptag{display:inline-block;vertical-align:2px;margin-left:8px;font-family:var(--f-ui,system-ui);font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--verde);background:color-mix(in srgb,var(--verde) 12%,transparent);border:1px solid color-mix(in srgb,var(--verde) 40%,transparent);border-radius:999px;padding:1px 8px;white-space:nowrap}
.predbox{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}
.predbox .pmark{font-weight:700;color:var(--verde);font-size:14.5px}
.predbox .pnote{font-size:12.5px}
.predbox .pdate{display:inline-flex;gap:6px;align-items:center}
.predbox .pdate[hidden]{display:none}
.predbox .pdate input{width:auto;padding:6px 8px}

/* ============ Bienvenida (hojas y viento) ============ */
.wl{--wl-bg1:#EAF2F5;--wl-bg2:#FBFCFB;--wl-ink:#1E3448;--wl-mut:#5E7385;--wl-acc:#C0802B;--wl-line:#9DB9C9;--wl-btn:#1F4E78;--wl-btnink:#fff;
  position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));overflow:hidden;
  background:linear-gradient(170deg,var(--wl-bg1) 0%,var(--wl-bg2) 62%);color:var(--wl-ink);font-family:var(--f-ui,system-ui,-apple-system,sans-serif);transition:opacity .5s ease,visibility .5s}
.wl.out{opacity:0;visibility:hidden}
.wl-wind{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wl-wind path{fill:none;stroke:var(--wl-line);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:260 800;opacity:.6;animation:wlWind 7s linear infinite;vector-effect:non-scaling-stroke}
.wl-wind path:nth-child(2){animation-delay:-2.3s;animation-duration:8.5s}
.wl-wind path:nth-child(3){animation-delay:-4.6s;animation-duration:9.5s}
.wl-leaf{position:absolute;top:-8%;left:6%;width:34px;height:34px;fill:var(--wl-acc);opacity:.85;pointer-events:none;animation:wlFall 11s linear infinite}
.wl-leaf:nth-of-type(3){left:24%;width:24px;height:24px;animation-duration:13s;animation-delay:-4s;opacity:.6}
.wl-leaf:nth-of-type(4){left:72%;width:40px;height:40px;animation-duration:10s;animation-delay:-7s;fill:#D9A441}
.wl-leaf:nth-of-type(5){left:88%;width:22px;height:22px;animation-duration:14s;animation-delay:-1s;opacity:.5}
.wl-leaf:nth-of-type(6){left:46%;width:28px;height:28px;animation-duration:12s;animation-delay:-9s;fill:#B5651D;opacity:.7}
.wl-card{position:relative;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;text-align:center}
.wl-photo{width:min(46vw,190px);aspect-ratio:1;border-radius:50%;padding:5px;background:var(--wl-bg2);box-shadow:0 0 0 1.5px var(--wl-acc),0 22px 50px rgba(30,52,72,.18);animation:wlIn .9s ease both}
.wl-photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:45% 30%;border-radius:50%}
.wl-hi{margin:26px 0 0;font-size:12.5px;letter-spacing:.38em;text-transform:uppercase;color:var(--wl-acc);font-weight:700;animation:wlUp .7s .15s ease both}
.wl-name{margin:8px 0 0;font-family:var(--f-text,Georgia,serif);font-size:clamp(26px,7vw,36px);line-height:1.12;font-weight:600;color:var(--wl-ink);animation:wlUp .7s .25s ease both}
.wl-date{margin:8px 0 0;font-size:14.5px;color:var(--wl-mut);animation:wlUp .7s .35s ease both}
.wl-verse{margin:26px 0 0;padding:0;max-width:340px;animation:wlUp .7s .45s ease both}
.wl-verse p{margin:0;font-family:var(--f-text,Georgia,serif);font-style:italic;font-size:16px;line-height:1.55;color:var(--wl-ink)}
.wl-verse cite{display:block;margin-top:8px;font-style:normal;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--wl-mut);font-weight:600}
.wl-btn{all:unset;cursor:pointer;margin-top:30px;padding:13px 44px;border-radius:999px;background:var(--wl-btn);color:var(--wl-btnink);font-weight:700;font-size:16px;letter-spacing:.05em;box-shadow:0 10px 26px rgba(31,78,120,.25);animation:wlUp .7s .55s ease both}
.wl-btn:focus-visible{outline:3px solid var(--wl-acc);outline-offset:3px}
.wl-btn:active{transform:translateY(1px)}
.wl-sub{margin:18px 0 0;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--wl-mut);animation:wlUp .7s .65s ease both}
@media (min-width:820px) and (orientation:landscape){.wl-photo{width:210px}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wl{--wl-bg1:#0F1E28;--wl-bg2:#0B141B;--wl-ink:#EEF2F4;--wl-mut:#93A6B4;--wl-acc:#E0A84E;--wl-line:#3E5C6E;--wl-btn:#E0A84E;--wl-btnink:#14202A}}
:root[data-theme="dark"] .wl{--wl-bg1:#0F1E28;--wl-bg2:#0B141B;--wl-ink:#EEF2F4;--wl-mut:#93A6B4;--wl-acc:#E0A84E;--wl-line:#3E5C6E;--wl-btn:#E0A84E;--wl-btnink:#14202A}
@keyframes wlIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
@keyframes wlUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes wlWind{from{stroke-dashoffset:1060}to{stroke-dashoffset:0}}
@keyframes wlFall{0%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(-40px,28vh) rotate(90deg)}50%{transform:translate(30px,55vh) rotate(200deg)}75%{transform:translate(-25px,82vh) rotate(290deg)}100%{transform:translate(20px,112vh) rotate(380deg)}}
@media (prefers-reduced-motion:reduce){.wl,.wl *{animation:none!important;transition:none!important}.wl-leaf{display:none}}

:root[data-theme="dark"]{--hoja:#E0A84E}

<script type="text/app">
/* ============ Ajustes (versión independiente) ============ */
function bvRows(){
  const row=(ab,name,builtin)=>`<div class="row" style="justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line,#ddd);border-radius:10px;padding:8px 10px"><span><b>${esc(ab)}</b> · ${esc(name)}${BVER.abbr===ab?` <span class="label" style="margin-left:6px">Principal</span>`:""}</span><span class="row" style="gap:6px">${BVER.abbr===ab?"":`<button class="btn small" data-bv="${esc(ab)}" data-act="main">Hacer principal</button>`}${builtin?"":`<button class="btn small ghost" data-bv="${esc(ab)}" data-act="del">Quitar</button>`}</span></div>`;
  return row("RV1909","Reina-Valera 1909 (incluida en la app)",true)+bvList().filter(x=>bvGet(x.abbr)).map(x=>row(x.abbr,x.name,false)).join("");
}
function viewAjustes(v){
  const c=TP.cfg();
  const opts=sel=>TP.MODELOS.map(([id,n,d])=>`<option value="${id}" ${sel===id?"selected":""}>${n} · ${d}</option>`).join("");
  const nd=ls.get("tp_sermones",[]).length;
  v.innerHTML=`<h1>Ajustes</h1>
  <p class="lede">Aquí conecta la inteligencia artificial y cuida sus enseñanzas. Todo se guarda solo en este equipo.</p>

  <div class="section-head"><h2>Inteligencia artificial</h2></div>
  <div class="card" style="display:grid;gap:12px">
    <p class="muted" style="margin:0">Preparar enseñanzas, mejorarlas, las herramientas de estudio y la Consulta libre usan Claude a través de una clave de la API de Anthropic. Se paga por uso (no es una suscripción). Si no la pone, todo lo demás funciona igual.</p>
    <div class="row" style="gap:8px"><a class="btn primary" href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">Crear mi clave</a><a class="btn" href="https://console.anthropic.com/settings/billing" target="_blank" rel="noopener">Cargar saldo</a></div>
    <ol class="muted" style="margin:0;padding-left:20px;font-size:14px;line-height:1.6"><li>Toque <b>Crear mi clave</b> y entre con su correo (la primera vez le pide crear la cuenta).</li><li>En <b>Cargar saldo</b> agregue un saldo pequeño con su tarjeta, por ejemplo 5 dólares.</li><li>Vuelva a <b>Crear mi clave</b>, toque <b>Create Key</b>, póngale un nombre (por ejemplo «Taller») y copie la clave que empieza con <code>sk-ant-</code>.</li><li>Péguela abajo, toque <b>Guardar</b> y luego <b>Probar conexión</b>.</li></ol>
    <div class="field"><label for="ak">Clave de la API</label>
      <div class="row" style="gap:6px"><input type="password" id="ak" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-ant-…" value="${esc(c.key)}" style="flex:1"><button class="btn" type="button" id="akshow">Ver</button></div></div>
    <div class="field"><label for="m1">Modelo para consultas, herramientas de estudio y hojas</label><select id="m1">${opts(c.modelDefault)}</select></div>
    <div class="field"><label for="m2">Modelo para preparar y mejorar enseñanzas</label><select id="m2">${opts(c.modelComplex)}</select></div>
    <div class="row" style="gap:8px"><button class="btn primary" id="aksave">Guardar</button><button class="btn" id="aktest">Probar conexión</button><span class="muted" id="akmsg" role="status"></span></div>
    <p class="muted" style="margin:0;font-size:13.5px">Como referencia, con Sonnet una enseñanza completa cuesta unos centavos de dólar. Puede ver su gasto y ponerle un límite mensual en la misma página de Anthropic. La clave queda guardada solo en este equipo: no la comparta ni comparta el enlace de la app.</p>
  </div>

  <div class="section-head"><h2>Copia de seguridad</h2></div>
  <div class="card" style="display:grid;gap:12px">
    <p class="muted" style="margin:0">Hoy tiene <b>${nd}</b> ${nd===1?"enseñanza guardada":"enseñanzas guardadas"} en este equipo, sin contar las de su archivo. Descargue una copia de vez en cuando y guárdela en Archivos o iCloud. Con ese archivo puede recuperar todo en otro equipo o si se borran los datos.</p>
    <div class="row" style="gap:8px"><button class="btn primary" id="bkout">Descargar copia</button><button class="btn" id="bkin">Restaurar desde una copia</button><input type="file" id="bkfile" accept=".json,application/json" hidden></div>
  </div>

  ${lockSection()}

  ${syncSection()}

  <div class="section-head"><h2>Texto bíblico</h2></div>
  <div class="card" style="display:grid;gap:12px">
    <p class="muted" style="margin:0">Cargue sus Biblias (archivos .json) y quedan guardadas en este equipo para usarlas <b>sin internet</b>. La <b>principal</b> es la que se abre en la pestaña Biblia, en la Concordancia y al tocar una cita. Estas Biblias no se incluyen en las copias de seguridad.</p>
    <div id="bvlist" style="display:grid;gap:8px">${bvRows()}</div>

/* ============ Sincronizar Safari y la app (repositorio PRIVADO de GitHub) ============
   Safari y el ícono de la pantalla de inicio guardan cada uno sus datos por separado (así es el iPad).
   Esto los une a través de un archivo en un repositorio privado del pastor: solo él lo puede ver.
   La clave (token) queda solo en este equipo y nunca va en las copias de seguridad. */
const SYNC={file:"taller-datos.json",busy:false,applying:false,timer:null,poll:null,etag:null,sha:null,last:null,err:""};
function syncCfg(){try{return JSON.parse(TP.kv.get("sync_cfg")||"null")}catch{return null}}
function syncSaveCfg(c){if(c){const t=JSON.stringify(c);TP.kv.set("sync_cfg",t);TP.put("sync_cfg",t)}else TP.del("sync_cfg")}
function syncMeta(){try{return JSON.parse(TP.kv.get("sync_meta")||"null")||{s:{},del:{},kv:{}}}catch{return {s:{},del:{},kv:{}}}}
function syncSaveMeta(m){const t=JSON.stringify(m);TP.kv.set("sync_meta",t);TP.put("sync_meta",t)}

/* registrar cada cambio local con su hora */
function syncInit(){const orig=ls.set.bind(ls);
  ls.set=function(k,v){
    if(SYNC.applying||!syncCfg())return orig(k,v);
    const now=Date.now(),m=syncMeta();
    if(k==="tp_sermones"){const old=new Map((ls.get("tp_sermones",[])||[]).map(s=>[s.id,JSON.stringify(s)]));const nu=new Set();
      for(const s of (v||[])){nu.add(s.id);if(old.get(s.id)!==JSON.stringify(s))m.s[s.id]=now}
      for(const id of old.keys())if(!nu.has(id)){m.del[id]=now;delete m.s[id]}}
    else if(!SYNC_SKIP(k))m.kv[k]=now;
    syncSaveMeta(m);const r=orig(k,v);syncSoon();return r};syncStart()}
setTimeout(syncInit,0);
function syncSoon(){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(()=>syncNow(),1500)}
/* GitHub */
function ghHead(c,extra){return Object.assign({"Accept":"application/vnd.github+json","Authorization":"Bearer "+c.token,"X-GitHub-Api-Version":"2022-11-28"},extra||{})}
function ghUrl(c,p){return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}${p||""}`}
function b64enc(str){const b=new TextEncoder().encode(str);let s="";for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}

async function ghCheck(c){let r;try{r=await fetch(ghUrl(c),{headers:ghHead(c),cache:"no-store"})}catch{throw new Error("Sin conexión a internet.")}
  if(r.status===401)throw new Error("La clave (token) no fue aceptada. Revísela.");
  if(r.status===404)throw new Error("No se encontró el repositorio. Revise el usuario y el nombre, y que la clave tenga acceso a él.");
  if(!r.ok)throw new Error("GitHub respondió con un error ("+r.status+").");
  const j=await r.json();if(!j.private)throw new Error("Ese repositorio es PÚBLICO. Por privacidad solo se permite un repositorio privado.");return j}
async function ghGet(c){

  if(r.status===304)return {same:true};
  if(r.status===404){SYNC.sha=null;SYNC.etag=null;return {data:null}}
  if(r.status===401)throw new Error("La clave (token) ya no es válida.");
  if(!r.ok)throw new Error("Error de GitHub ("+r.status+")");

async function ghPut(c,data){
  const body={message:"Taller: datos "+new Date().toISOString(),content:b64enc(JSON.stringify(data))};if(SYNC.sha)body.sha=SYNC.sha;
  const r=await fetch(ghUrl(c,"/contents/"+SYNC.file),{method:"PUT",headers:ghHead(c,{"Content-Type":"application/json"}),body:JSON.stringify(body)});
  if(r.status===409||r.status===422){SYNC.etag=null;return false}
  if(!r.ok)throw new Error("No se pudo guardar en GitHub ("+r.status+")");

/* unir lo local con lo remoto: gana el cambio más reciente */
function syncMerge(R){
  const m=syncMeta();R=R||{v:1,s:{},del:{},kv:{}};R.s=R.s||{};R.del=R.del||{};R.kv=R.kv||{};
  const local=ls.get("tp_sermones",[])||[];const L=new Map(local.map(s=>[s.id,s]));
  const tL=id=>m.s[id]||Date.parse((L.get(id)||{}).actualizado||"")||1;
  const ids=new Set([...L.keys(),...Object.keys(R.s),...Object.keys(R.del),...Object.keys(m.del)]);
  const out={v:1,s:{},del:{},kv:{}};const merged=[];let changedLocal=false;
  for(const id of ids){
    const lt=L.has(id)?tL(id):0,rt=R.s[id]?R.s[id].t:0,dt=Math.max(m.del[id]||0,R.del[id]||0);
    if(dt&&dt>=lt&&dt>=rt){out.del[id]=dt;if(L.has(id))changedLocal=true;continue}
    if(rt>lt){merged.push(R.s[id].d);out.s[id]={t:rt,d:R.s[id].d};m.s[id]=rt;if(!L.has(id)||JSON.stringify(L.get(id))!==JSON.stringify(R.s[id].d))changedLocal=true}

  }

  for(const k of keys){if(SYNC_SKIP(k))continue;
    const lt=m.kv[k]||(TP.kv.has(k)?1:0),r=R.kv[k],rt=r?r.t:0;
    if(rt&&rt===lt&&r.v&&typeof r.v==="object"&&!Array.isArray(r.v)){const lv=ls.get(k,null);if(lv&&typeof lv==="object"&&!Array.isArray(lv)){const mv={...r.v,...lv};out.kv[k]={t:lt,v:mv};if(JSON.stringify(mv)!==JSON.stringify(lv))kvApply.push([k,mv]);continue}}
    if(rt>lt){out.kv[k]=r;m.kv[k]=rt;const cur=TP.kv.get(k);const want=r.v==null?undefined:JSON.stringify(r.v);if(cur!==want)kvApply.push([k,r.v])}

async function syncNow(opts={}){
  const c=syncCfg();if(!c||SYNC.busy)return;if(!navigator.onLine){SYNC.err="Sin conexión";syncStatus();return}
  SYNC.busy=true;

    for(let tries=0;tries<3;tries++){
      const g=await ghGet(c);
      if(g.same&&!syncDirty()){SYNC.last=Date.now();SYNC.err="";break}
      let R=g.same?SYNC.remote:g.data;if(!g.same)SYNC.remote=R;
      const {out,m,merged,changedLocal,kvApply}=syncMerge(R);
      if(changedLocal||kvApply.length){SYNC.applying=true;try{
          if(changedLocal)Store.localSave(merged);
          for(const [k,v] of kvApply)ls.set(k,v==null?undefined:v);
        }finally{SYNC.applying=false}
        try{if(typeof viewSermones!=="undefined"&&viewSermones.draw&&document.getElementById("lres"))viewSermones.draw()}catch{}
        if(!opts.quiet)toast("Se actualizó con los cambios del otro lado")}
      m.pend=false;syncSaveMeta(m);
      const same=R&&JSON.stringify(R)===JSON.stringify(out);
      if(same){SYNC.last=Date.now();SYNC.err="";break}
      if(await ghPut(c,out)){SYNC.remote=out;SYNC.last=Date.now();SYNC.err="";break}
    }

function syncDirty(){const m=syncMeta();const R=SYNC.remote;if(!R)return true;
  for(const [id,t] of Object.entries(m.s))if(!R.s||!R.s[id]||R.s[id].t<t)return true;
  for(const [id,t] of Object.entries(m.del))if(!R.del||(R.del[id]||0)<t)return true;
  for(const [k,t] of Object.entries(m.kv))if(!R.kv||!R.kv[k]||R.kv[k].t<t)return true;return false}
function syncStatus(){const el=document.getElementById("syst");if(!el)return;const c=syncCfg();
  if(!c){el.textContent="Apagado.";return}
  el.textContent=SYNC.err?("Aviso: "+SYNC.err):SYNC.last?("Conectado a "+c.owner+"/"+c.repo+" (privado). Última sincronización: "+new Date(SYNC.last).toLocaleTimeString("es-CO",{hour:"numeric",minute:"2-digit",second:"2-digit"})):"Conectado. Sincronizando…";
  el.style.color=SYNC.err?"var(--danger)":"var(--verde)"}
function syncStart(){clearInterval(SYNC.poll);if(!syncCfg())return;

document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&syncCfg())syncNow()});

window.addEventListener("online",()=>{if(syncCfg())syncNow()});

/* ============ Bloqueo de la app: contraseña + Face ID / huella ============
   Protege la app si el iPad queda desbloqueado. Se pide la contraseña (o Face ID / huella)
   al abrir la app y al volver después de 2 minutos fuera de ella.
   La contraseña nunca se guarda: solo un resumen (PBKDF2). Esta clave tampoco viaja a GitHub. */
const LOCK={idle:120000,hiddenAt:0,el:null,iters:200000};
const lkB64=u=>{let s="";const a=new Uint8Array(u);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)};
const lkUnB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function lockCfg(){try{return JSON.parse(TP.kv.get("tp_lock")||"null")}catch{return null}}
function lockSave(c){if(c){const t=JSON.stringify(c);TP.kv.set("tp_lock",t);TP.put("tp_lock",t)}else TP.del("tp_lock")}
async function lkHash(pw,salt,iters){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:iters,hash:"SHA-256"},k,256);return lkB64(bits)}
async function lockSetPass(pw){const salt=crypto.getRandomValues(new Uint8Array(16));const h=await lkHash(pw,salt,LOCK.iters);

/* ============ markdown + enlaces a pasajes ============ */
function linkRefs(html){
  if(!REFRE)return html;
  return html.replace(REFRE,(all,pre,book,c,v1,v2)=>{
    const b=bookIndex(book);if(b==null||!BIBLE[b].chs[+c-1])return all;
    const ref=`${b}|${c}|${v1||""}|${v2||""}`;
    return `${pre}<span class="reflink" role="button" tabindex="0" data-ref="${ref}">${all.slice(pre.length)}</span>`;
  });
}
function inline(s){return linkRefs(esc(s).replace(/«([^»]+)»/g,'<span class="bq">«$1»</span>').replace(/==(.+?)==/g,"<mark>$1</mark>").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g,"$1<em>$2</em>"))}
function md(src){
  const lines=String(src).replace(/\r/g,"").split("\n");let html="",list=null,para=[];
  const flush=()=>{if(para.length){html+=`<p>${inline(para.join(" "))}</p>`;para=[]}};
  const close=()=>{if(list){html+=`</${list}>`;list=null}};
  for(const raw of lines){const l=raw.trimEnd();let m;
    if(!l.trim()){flush();close();continue}
    if(m=l.match(/^#{1,2}\s+(.*)/)){flush();close();html+=`<h3>${inline(m[1])}</h3>`;continue}
    if(m=l.match(/^#{3,6}\s+(.*)/)){flush();close();html+=`<h4>${inline(m[1])}</h4>`;continue}
    if(m=l.match(/^\s*[-*•]\s+(.*)/)){flush();if(list!=="ul"){close();html+="<ul>";list="ul"}html+=`<li>${inline(m[1])}</li>`;continue}
    if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){flush();if(list!=="ol"){close();html+="<ol>";list="ol"}html+=`<li>${inline(m[1])}</li>`;continue}
    if(m=l.match(/^>\s?(.*)/)){flush();close();const ov=/^\((NTV|NVI|DHH|TLA|PDT|LBLA|BLP|NBV)\)/.test(m[1]);html+=`<blockquote${ov?' class="otra"':""}>${inline(m[1])}</blockquote>`;continue}
    if(/^(-{3,}|_{3,})$/.test(l.trim())){flush();close();continue}
    close();para.push(l.trim());
  }
  flush();close();return html;
}

const Store={
  mode:"cargando",db:null,uid:null,subs:[],
  async init(){
    try{
      if(!window.claude){this.mode="local";return}
      const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
      const id=user?await user.id():null;
      if(db&&id){this.db=db;this.uid=id;this.mode="nube"}else this.mode="local";
    }catch{this.mode="local"}
  },
  col(){return this.db.doc(`data/users/${this.uid}/perfil`).collection("sermones")},
  localAll(){return ls.get("tp_sermones",[])},
  localSave(a){ls.set("tp_sermones",a);this.subs.forEach(f=>f())},
  watchSermons(cb){
    if(this.mode==="nube"){return this.col().onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.actualizado||"").localeCompare(a.actualizado||""))),e=>{console.warn(e);this.mode="local";cb(this.localAll())})}
    const f=()=>cb(this.localAll().map(({materiales,...s})=>s).sort((a,b)=>(b.actualizado||"").localeCompare(a.actualizado||"")));this.subs.push(f);f();return()=>{this.subs=this.subs.filter(x=>x!==f)};
  },
  async saveSermon(s){
    s.actualizado=new Date().toISOString();
    if(this.mode==="nube"){const {id,...body}=s;const ref=id?this.col().doc(id):this.col().doc();await ref.set(body);return ref.id}
    const all=this.localAll();if(!s.id){s.id="s"+Date.now();s.materiales=[];all.push(s)}else{const i=all.findIndex(x=>x.id===s.id);all[i]={...all[i],...s}}this.localSave(all);return s.id;
  },
  async deleteSermon(id){
    if(this.mode==="nube"){const mats=await this.col().doc(id).collection("materiales").get();for(const d of mats.docs)await this.col().doc(id).collection("materiales").doc(d.id).delete();await this.col().doc(id).delete();return}
    this.localSave(this.localAll().filter(x=>x.id!==id));
  },
  watchMaterials(sid,cb){
    if(this.mode==="nube")return this.col().doc(sid).collection("materiales").onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.creado||"").localeCompare(b.creado||""))),e=>console.warn(e));
    const f=()=>cb((this.localAll().find(x=>x.id===sid)?.materiales)||[]);this.subs.push(f);f();return()=>{this.subs=this.subs.filter(x=>x!==f)};
  },
  async addMaterial(sid,m){
    m.creado=new Date().toISOString();
    try{
      if(this.mode==="nube"){await this.col().doc(sid).collection("materiales").add(m);await this.col().doc(sid).update({actualizado:m.creado})}
      else{const all=this.localAll();const s=all.find(x=>x.id===sid);s.materiales=s.materiales||[];s.materiales.push({id:"m"+Date.now(),...m});s.actualizado=m.creado;this.localSave(all)}
      toast("Guardado en el sermón");
    }catch(e){toast(e?.code==="quota_exceeded"?"No hay espacio: borre materiales viejos":"No se pudo guardar")}
  },
  async deleteMaterial(sid,mid){
    if(this.mode==="nube"){await this.col().doc(sid).collection("materiales").doc(mid).delete();return}
    const all=this.localAll();const s=all.find(x=>x.id===sid);s.materiales=(s.materiales||[]).filter(m=>m.id!==mid);this.localSave(all);
  }
};

async function allSermonsForBackup(){
  if(Store.mode==="nube"){
    const snap=await Store.col().get();const out=[];
    for(const d of snap.docs){const s={id:d.id,...d.data()};try{const m=await Store.col().doc(d.id).collection("materiales").get();s.materiales=m.docs.map(x=>({id:x.id,...x.data()}))}catch{s.materiales=[]}out.push(s)}
    return out;
  }
  return Store.localAll();
}

function buildMatcher(q,modo){
  const phrases=[];q.replace(/"([^"]+)"|“([^”]+)”|(\S+)/g,(_,a,b,c)=>{phrases.push(norm(a||b||c))});
  const terms=phrases.filter(Boolean).map(p=>p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/\s+/g,"\\s+"));
  if(!terms.length)return null;
  const res=terms.map(t=>modo==="palabra"?new RegExp(`(?<![a-z0-9])${t}(?![a-z0-9])`,"g"):new RegExp(t,"g"));
  return {res,test:n=>res.every(r=>{r.lastIndex=0;return r.test(n)})};
}
function highlight(t,n,res){
  const spans=[];for(const r of res){r.lastIndex=0;let m;while(m=r.exec(n)){spans.push([m.index,m.index+m[0].length]);if(!m[0].length)r.lastIndex++}}
  spans.sort((a,b)=>a[0]-b[0]);let out="",p=0;for(const [a,z] of spans){if(a<p)continue;out+=esc(t.slice(p,a))+"<mark>"+esc(t.slice(a,z))+"</mark>";p=z}return out+esc(t.slice(p));
}

  let pool=VERSES;if(CONC.test==="at")pool=pool.filter(x=>x.b<NT_START);if(CONC.test==="nt")pool=pool.filter(x=>x.b>=NT_START);

    <div id="hits">${hits.slice(0,CONC.shown).map(x=>`<div class="hit"><a data-b="${x.b}" data-c="${x.c}" data-v="${x.v}">${esc(BIBLE[x.b].name)} ${x.c}:${x.v}</a><div class="t">${highlight(x.t,x.n,m.res)}</div></div>`).join("")}</div>
    ${hits.length>CONC.shown?`<p><button class="btn" id="more">Mostrar más (${(hits.length-CONC.shown).toLocaleString("es-CO")} restantes)</button></p>`:""}
    <div class="row" style="margin-top:16px"><button class="btn gold" id="towords">Estudiar “${esc(CONC.q.replace(/["“”]/g,""))}” en hebreo y griego</button></div>
  </div>
  <aside class="card" aria-label="Distribución por libro"><p class="label" style="margin:0 0 8px">Por libro</p>
    <div class="dist">${Object.entries(per).map(([b,n])=>`<button data-lib="${b}" ${CONC.libro===b?'style="background:var(--oro-soft)"':""}><span>${esc(BIBLE[b].name)}</span><span class="bar" style="width:${Math.max(4,n/max*100)}%"></span><span class="n">${n}</span></button>`).join("")||'<span class="muted">Sin resultados.</span>'}</div>
    ${CONC.libro!==""?'<button class="btn small" style="margin-top:8px" data-lib="">Ver todos los libros</button>':""}</aside></div>`;

  };

const ERR={not_granted:"La app necesita su permiso para consultar a Claude. Puede darlo desde el menú de permisos de esta página.",sampling_disabled:"Las consultas a Claude no están disponibles en esta cuenta.",rate_limited:"Se alcanzó el límite de consultas por ahora. Intente de nuevo en un rato.",session_expired:"Su sesión se cerró. Vuelva a iniciar sesión en Claude.",refused:"Claude no respondió esa consulta. Intente formularla de otra manera.",empty_completion:"No llegó respuesta. Intente con una consulta más corta.",prompt_too_large:"El pasaje es demasiado largo. Pruebe con menos versículos.",no_key:"Falta la clave de la IA. Vaya a Ajustes, en el menú, y péguela allí. Se crea en console.anthropic.com.",bad_key:"La clave no fue aceptada. Revísela en Ajustes.",no_credit:"La cuenta de Anthropic no tiene saldo. Cargue un poco de saldo en console.anthropic.com.",overloaded:"Claude está muy ocupado en este momento. Intente de nuevo en un minuto.",network:"No hay conexión con internet. La IA la necesita; el resto de la app sigue funcionando.",bad_model:"Ese modelo no está disponible en su cuenta. Elija otro en Ajustes.",api_error:"Anthropic devolvió un error. Intente de nuevo."};
async function runTool(id,fresh=false){
  const t=TOOLS[id];const st=RUNS[id];
  const vals={};for(const c of t.campos){vals[c.id]=($("#f_"+c.id)?.value||"").trim()}
  const need=t.campos.find(c=>c.tipo!=="select"&&!/opcional/i.test(c.label));
  if(need&&!vals[need.id]){toast("Escriba "+need.label.toLowerCase());$("#f_"+need.id)?.focus();return}
  st.vals=vals;st.out="";st.status="running";renderOut(id);
  const sample=await getSample();
  if(!sample){st.status="error";st.err="Las herramientas de estudio necesitan abrirse dentro de Claude (claude.ai o la app). La Biblia, la concordancia y Mis enseñanzas sí funcionan aquí.";renderOut(id);return}
  const ctl=new AbortController();st.ctl=ctl;$("#stop")&&($("#stop").onclick=()=>ctl.abort());
  try{
    const {text,truncated}=await sample(DOCTRINA+"\n\n"+t.prompt(vals),{signal:ctl.signal,cache:fresh?{gcTime:300000,refresh:true}:{gcTime:300000},modelTier:id==="bosquejo"?"complex":"default",onText:({text})=>{st.out=text;renderOut(id)}});
    st.out=text+(truncated?"\n\n*La respuesta se cortó por su extensión. Pruebe con un pasaje más corto.*":"");st.status="done";
    const h=ls.get(histKey(id),[]);h.unshift({titulo:toolTitle(id,vals),vals,out:st.out,fecha:new Date().toLocaleDateString("es-CO")});ls.set(histKey(id),h.slice(0,15));
  }catch(e){
    if(e?.code==="cancelled"){st.out=e.text||"";st.status=st.out?"done":"idle"}
    else{st.status="error";st.err=ERR[e?.code]||"Hubo un problema de conexión. Intente de nuevo.";st.out=e?.text||""}
  }
  renderOut(id);renderHist(id);
}

function libToMd(it){if(it.md)return it.md;const L=[`# ${it.T||it.t}`];let i=0;const P=it.p;
  if(P[0]&&P[0][0]==="p"&&P[0][1]===it.S){L.push(`*${it.S}*`);i=1}
  let lastLi=false;
  for(;i<P.length;i++){const [k,t]=P[i];
    if(k!=="li"&&lastLi){L.push("");lastLi=false}
    if(k==="h"&&/^vers[ií]culo clave$/i.test(t.replace(/:$/,"")))continue;
    if(k==="ref"){const nx=P[i+1];if(nx&&nx[0]==="q"){L.push(`> ${t} — ${nx[1].replace(/^\((RVR1960|NTV|NVI)\)\s*/,"")}`);i++}else L.push(`> ${t}`);L.push("");continue}
    if(k==="q"){L.push(`> ${t}`,"");continue}
    if(k==="h"){L.push(`## ${t.replace(/:$/,"")}`);continue}
    if(k==="li"){L.push(`- ${t}`);lastLi=true;continue}
    if(k==="i"){L.push("",`**${t.replace(/\*/g,"")}**`,"");continue}
    L.push(t,"")}
  return L.join("\n")}

  const box=$("#mats");if(!box)return;
  box.innerHTML=MATS.length?MATS.map(m=>`<div class="mat"><header><div><span class="label">${esc(m.tipo)}</span><div style="font-weight:600">${esc(m.titulo||"")}</div></div><span class="row" style="gap:6px">${/preparad|Hoja para/.test(m.tipo)?`<button class="btn small" data-w="${esc(m.id)}">Word</button>`:""}<span id="md_${esc(m.id)}"><button class="btn small ghost" data-del="${esc(m.id)}">Quitar</button></span></span></header><div class="md">${md(m.texto||"")}</div></div>`).join(""):`<div class="card muted">Aún no hay materiales. Marque versículos en la Biblia o use una herramienta y toque “Guardar en un sermón”.</div>`;
  box.onclick=e=>{const w=e.target.closest("[data-w]");if(w){const m=MATS.find(x=>x.id===w.dataset.w);if(m)exportWord(m.texto,ls.get("tp_wstyle","clasico"),/Hoja/.test(m.tipo)?"Hoja para la congregación":"");return}const d=e.target.closest("[data-del]");if(d){const mid=d.dataset.del;$("#md_"+mid).innerHTML=`<button class="btn small danger" data-dy="${esc(mid)}">Quitar</button><button class="btn small" data-dn>No</button>`;return}
    const y=e.target.closest("[data-dy]");if(y){Store.deleteMaterial(id,y.dataset.dy);return}
    if(e.target.closest("[data-dn]"))drawMats(id)};
}

/* ============ barra de búsqueda ============ */
$("#jumpform").onsubmit=e=>{e.preventDefault();const q=$("#jump").value.trim();if(!q)return;const r=parseRef(q);if(r){goBible(r.b,r.c,r.v1?[r.v1,r.v2||r.v1]:null)}else go("concordancia",{q});$("#jump").blur()};

/* ============ arranque ============ */
(async function start(){
  const h=(location.hash||"").replace("#","");
  go(NAV.flatMap(g=>g.items).some(([id])=>id===h)?h:"inicio");
  loadBible().then(()=>{if(["biblia","concordancia"].includes(CURRENT))go(CURRENT,{keepSel:true});else if(TOOLS[CURRENT])renderOut(CURRENT)}).catch(()=>{$("#view").insertAdjacentHTML("afterbegin",`<div class="card">No se pudo cargar el texto bíblico. Recargue la página.</div>`)});
  await Store.init();
  Store.watchSermons(list=>{SERMONS=list;if(CURRENT==="inicio")renderRecent();if(CURRENT==="sermones"&&!$("#e_titulo")&&$("#fest")&&viewSermones.draw)viewSermones.draw()});
})();
</script>
</body></html>
