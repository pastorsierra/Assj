<style>
/* Layout: barra lateral de herramientas agrupadas (Escritura · Estudio · Preparación · Sermones) + mesa de trabajo amplia; en teléfono, pestañas arriba. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --sunk:#EBF1F8; --ink:#14223A; --muted:#5A6A82; --line:#D9E1EC;
  --azul:#1F4E78; --azul-ink:#FFFFFF; --oro:#A97A12; --oro-soft:#FBF1D9; --verde:#00695C; --mark:#FFE9A3;
  --danger:#A23B32;
  --f-text:"Literata","Noto Serif Hebrew",Georgia,"Times New Roman",serif;
  --f-ui:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1520; --surface:#131E2E; --sunk:#192940; --ink:#E4EBF5; --muted:#93A3BA; --line:#24354D;
  --azul:#7DB0E3; --azul-ink:#0D1520; --oro:#D8AE4E; --oro-soft:#2A2414; --verde:#5CC2AE; --mark:#5A4A12; --danger:#E08A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1520; --surface:#131E2E; --sunk:#192940; --ink:#E4EBF5; --muted:#93A3BA; --line:#24354D;
  --azul:#7DB0E3; --azul-ink:#0D1520; --oro:#D8AE4E; --oro-soft:#2A2414; --verde:#5CC2AE; --mark:#5A4A12; --danger:#E08A80; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* barra lateral */
.side{border-right:1px solid var(--line);background:var(--surface);padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px 16px}
.brand b{font-family:var(--f-text);font-weight:600;font-size:19px;letter-spacing:.2px;color:var(--azul)}
.brand span{font-size:12px;color:var(--muted)}
.navgroup{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.navgroup h6{margin:8px 8px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--oro);font-weight:700}
.nav{all:unset;cursor:pointer;display:block;padding:7px 10px;border-radius:8px;color:var(--ink);font-weight:500;font-size:14px}
.nav:hover{background:var(--sunk)}
.nav[aria-current="page"]{background:var(--azul);color:var(--azul-ink)}
.nav:focus-visible{outline:2px solid var(--oro)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top .mbrand{display:none;font-family:var(--f-text);font-weight:600;color:var(--azul);white-space:nowrap}
.jump{flex:1;min-width:0;display:flex;gap:8px}
.jump input{flex:1;min-width:0}
.tabs{display:none}
.content{padding-block:22px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));width:100%;max-width:1060px}
/* controles */
input[type=text],input[type=search],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{resize:vertical;line-height:1.55}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--azul)}
.btn.primary{background:var(--azul);border-color:var(--azul);color:var(--azul-ink)}
.btn.gold{background:var(--oro);border-color:var(--oro);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--azul)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
h1{font-family:var(--f-text);font-weight:600;font-size:28px;line-height:1.2;margin:0 0 4px;text-wrap:balance}
h2{font-family:var(--f-text);font-weight:600;font-size:20px;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 18px;max-width:68ch}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.chip:hover{background:var(--oro-soft)}
.chip:focus-visible{outline:2px solid var(--oro)}
.notice{font-size:13px;color:var(--muted);border-left:3px solid var(--oro);padding:4px 0 4px 10px;margin:14px 0}
/* inicio */
.tool-card{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tool-card:hover{border-color:var(--azul)}
.tool-card:focus-visible{outline:2px solid var(--oro)}
.tool-card b{font-size:15px}
.tool-card span{font-size:13px;color:var(--muted)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 10px}
/* biblia */
.reader-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.reader-bar select{width:auto;max-width:100%}
.chapter{font-family:var(--f-text);font-size:18px;line-height:1.75;max-width:68ch}
.chapter h2{font-size:24px;margin-bottom:12px;color:var(--azul)}
.vs{cursor:pointer;border-radius:4px;padding:1px 2px;-webkit-tap-highlight-color:transparent}
.vs sup{font-family:var(--f-ui);font-size:11px;color:var(--oro);font-weight:700;margin-right:3px;vertical-align:super}
.vs:hover{background:var(--sunk)}
.vs.sel{background:var(--mark)}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 -6px 20px rgba(10,20,40,.08)}
.actionbar .ref{font-weight:700;color:var(--azul);margin-right:6px}
/* concordancia */
.hit{padding:10px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px}
.hit a{color:var(--azul);font-weight:700;text-decoration:none;cursor:pointer;font-size:13.5px}
.hit .t{font-family:var(--f-text);font-size:16px;line-height:1.6}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.dist{display:flex;flex-direction:column;gap:3px;max-height:340px;overflow:auto}
.dist button{all:unset;cursor:pointer;display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:12.5px;padding:2px 4px;border-radius:5px}
.dist button:hover{background:var(--sunk)}
.dist .bar{height:7px;border-radius:4px;background:var(--azul);opacity:.75}
.dist .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.conc-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:22px;align-items:start}
/* herramientas IA */
.toolform{display:grid;gap:12px}
.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:600}
.output{margin-top:18px}
.md{font-family:var(--f-text);font-size:16.5px;line-height:1.7;max-width:72ch}
.md blockquote.otra{border-left-color:var(--oro);color:#7A5A00;background:var(--oro-soft);font-style:normal}
.md h3{font-family:var(--f-text);font-size:19px;color:var(--azul);margin:18px 0 6px}
.md h4{font-family:var(--f-ui);font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--oro);margin:20px 0 6px}
.md p{margin:0 0 10px}
.md ul,.md ol{margin:0 0 12px;padding-left:22px}
.md li{margin:3px 0}
.md blockquote{margin:8px 0 12px;padding:6px 14px;border-left:3px solid var(--verde);color:var(--verde);font-style:italic}
.md strong{font-weight:600}
.md .bq{color:var(--verde);font-style:italic}
.prep-out{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.reflink{color:var(--verde);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--verde) 40%,transparent);text-underline-offset:3px;cursor:pointer}
.out-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-style:italic}
.dot{width:8px;height:8px;border-radius:50%;background:var(--oro);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}
.history{margin-top:26px}
.history ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.history button{all:unset;cursor:pointer;font-size:13.5px;color:var(--azul)}
.history button:hover{text-decoration:underline}
/* chat */
.chat{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.bubble{max-width:78ch;border-radius:12px;padding:10px 14px}
.bubble.me{align-self:flex-end;background:var(--azul);color:var(--azul-ink);font-family:var(--f-ui)}
.bubble.ai{background:var(--surface);border:1px solid var(--line)}
/* sermones */
.sermon-list{display:flex;flex-direction:column;gap:8px}
.sitem{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.sitem:hover{border-color:var(--azul)}
.sitem:focus-visible{outline:2px solid var(--oro)}
.sitem b{font-family:var(--f-text);font-size:16.5px;font-weight:600}
.sitem small{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:0 0 16px}
.cat-tile{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-height:54px}
.cat-tile:hover{border-color:var(--azul)}
.cat-tile:focus-visible{outline:2px solid var(--oro)}
.cat-tile[aria-pressed=true]{border-color:var(--azul);background:color-mix(in srgb,var(--azul) 9%,var(--surface));box-shadow:inset 0 0 0 1px var(--azul)}
.cat-tile b{font-size:14px;font-weight:600;line-height:1.25}
.cat-tile span{font-size:12px;color:var(--muted)}
.bigsearch{position:relative;margin:0 0 14px}
.bigsearch input{font-size:16px;padding:12px 14px;border-radius:12px;border-width:1.5px}
.bigsearch input:focus{border-color:var(--azul);outline:none}
.snip{display:block;grid-column:1/-1;font-size:13px;color:var(--ink);opacity:.85;margin-top:2px}
.snip mark{background:var(--oro-soft);color:inherit;border-radius:3px;padding:0 2px}
.libread .md h2{margin-top:18px}
.serie-box{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:12px;border-radius:10px;background:var(--sunk)}
.serie-box[hidden],.sheet-bg[hidden]{display:none}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;align-self:start}
.pill.idea{background:var(--sunk);color:var(--muted)}
.pill.prep{background:var(--oro-soft);color:var(--oro)}
.pill.listo{background:color-mix(in srgb,var(--verde) 16%,transparent);color:var(--verde)}
.pill.predicado{background:color-mix(in srgb,var(--azul) 16%,transparent);color:var(--azul)}
.editor{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.editor .wide{grid-column:1/-1}
.mat{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;margin-top:10px}
.mat header{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.mat .md{font-size:15.5px}
.savestate{font-size:12.5px;color:var(--muted)}
/* hoja de pasaje */
.sheet-bg{position:fixed;inset:0;background:rgba(8,14,24,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:min(720px,100%);max-height:80vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet .chapter{font-size:17px}
.picker{display:flex;flex-direction:column;gap:6px;margin-top:12px}
/* responsive */
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .top{flex-wrap:wrap}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);scrollbar-width:none}
  .tabs .nav{white-space:nowrap;padding:6px 11px;font-size:13.5px}
  .conc-layout{grid-template-columns:minmax(0,1fr)}
  .hit{grid-template-columns:minmax(0,1fr);gap:2px}
  h1{font-size:24px}
}
/* ===== Estilo formal y sobrio ===== */
[hidden]{display:none!important}
:root{--bg:#F6F5F1;--surface:#FFFFFF;--sunk:#F0EEE8;--ink:#1B2230;--muted:#69707C;--line:#E2DFD7;--azul:#1D3557;--oro:#8C6D2E;--oro-soft:#F5EEDD;--verde:#1F6B57;--mark:#F3E3B5;--r:4px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111418;--surface:#171B21;--sunk:#1E232B;--ink:#E7E5E0;--muted:#9A9FA8;--line:#2B313A;--azul:#9DB7D9;--azul-ink:#111418;--oro:#C9A866;--oro-soft:#2A2519;--verde:#7CC3AE;--mark:#4A3F1F}}
:root[data-theme="dark"]{--bg:#111418;--surface:#171B21;--sunk:#1E232B;--ink:#E7E5E0;--muted:#9A9FA8;--line:#2B313A;--azul:#9DB7D9;--azul-ink:#111418;--oro:#C9A866;--oro-soft:#2A2519;--verde:#7CC3AE;--mark:#4A3F1F}
.side{background:var(--bg)}
.brand b{font-size:18px;color:var(--ink);letter-spacing:.01em}
.brand span{letter-spacing:.08em;text-transform:uppercase;font-size:10.5px}
.navgroup h6{color:var(--muted);font-weight:600;letter-spacing:.16em}
.nav{border-radius:0;font-weight:500;color:var(--muted)}
.nav:hover{background:transparent;color:var(--ink)}
.nav[aria-current="page"]{background:transparent;color:var(--ink);font-weight:700;box-shadow:inset 2px 0 0 var(--azul)}
.tabs .nav[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--azul)}
h1{font-weight:500;font-size:27px;letter-spacing:-.005em}
h2{font-weight:500;font-size:18px}
.section-head{border-bottom:1px solid var(--line);padding-bottom:6px}
.label{letter-spacing:.14em;font-weight:600}
.btn{border-radius:3px;font-weight:500;font-size:13.5px;padding:7px 13px}
.btn.primary{background:var(--azul);border-color:var(--azul)}
.btn.gold{background:var(--surface);border-color:var(--oro);color:var(--oro)}
.btn.gold:hover{background:var(--oro-soft)}
.btn.ghost{color:var(--ink);padding-left:0}
input[type=text],input[type=search],input[type=date],select,textarea{border-radius:3px}
.card,.tool-card,.mat{border-radius:4px;box-shadow:none}
.tool-card b{font-family:var(--f-text);font-weight:500;font-size:16px}
.chip{border-radius:3px}
.notice{border-left-color:var(--line)}
.sermon-list{gap:0;border-top:1px solid var(--line)}
.sitem{grid-template-columns:minmax(0,1fr) auto auto;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:13px 4px}
.sitem:hover{background:var(--surface)}
.sitem b{font-weight:500}
.pill{border-radius:2px;font-weight:600;letter-spacing:.1em;font-size:10px;background:transparent!important;border:1px solid currentColor;padding:2px 6px}
.tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted);border:1px solid var(--line);padding:2px 6px;border-radius:2px;align-self:start;white-space:nowrap}
.tag.ready{color:var(--verde);border-color:color-mix(in srgb,var(--verde) 45%,transparent)}
.cat-grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 22px;border-top:1px solid var(--line);margin-bottom:22px}
.cat-tile{flex-direction:row;align-items:baseline;gap:10px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:10px 2px;min-height:0}
.cat-tile:hover{border-color:var(--line);color:var(--azul)}
.cat-tile i{font-style:normal;font-family:var(--f-text);font-size:12.5px;color:var(--oro);min-width:20px;font-variant-numeric:tabular-nums}
.cat-tile b{flex:1;font-weight:500;font-size:14px}
.cat-tile span{font-variant-numeric:tabular-nums}
.cat-tile[aria-pressed=true]{background:transparent;box-shadow:inset 0 -2px 0 var(--azul);border-color:var(--line)}
.cat-tile[aria-pressed=true] b{color:var(--azul);font-weight:700}
.bigsearch input{border-radius:3px;border-width:1px;padding:13px 14px}
.serie-box{border-radius:3px}
.paperwrap{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
.paperbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:6px}
.md.paper{max-width:70ch;margin:0 auto;padding:18px 4px 6px}
.md.paper > h3:first-child{text-align:center;font-size:19px;letter-spacing:.02em;margin-top:0}
.md.paper > h3:first-child + p{text-align:center;color:var(--muted)}
.md.paper h3{font-weight:600}
.md.paper h4{color:var(--oro)}
#ensbox,#lres,#prepcard{scroll-margin-top:96px}
.savebar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:10px 14px;margin:0 0 14px;font-size:14px}
.sitem.flash{background:var(--oro-soft);box-shadow:inset 3px 0 0 var(--oro)}
.verlinks{margin:16px 0 0;padding-top:12px;border-top:1px solid var(--line)}
a.btn{text-decoration:none;color:inherit;display:inline-block}

<script type="text/app">
/* ============ Ajustes (versión independiente) ============ */
function viewAjustes(v){
  const c=TP.cfg();
  const opts=sel=>TP.MODELOS.map(([id,n,d])=>`<option value="${id}" ${sel===id?"selected":""}>${n} · ${d}</option>`).join("");
  const nd=ls.get("tp_sermones",[]).length;
  v.innerHTML=`<h1>Ajustes</h1>
  <p class="lede">Aquí conecta la inteligencia artificial y cuida sus enseñanzas. Todo se guarda solo en este equipo.</p>

  <div class="section-head"><h2>Inteligencia artificial</h2></div>
  <div class="card" style="display:grid;gap:12px">
    <p class="muted" style="margin:0">Preparar enseñanzas, mejorarlas, las herramientas de estudio y la Consulta libre usan Claude a través de una clave de la API de Anthropic. La clave se crea en <b>console.anthropic.com</b> y se paga por uso. Si no la pone, todo lo demás funciona igual.</p>
    <div class="field"><label for="ak">Clave de la API</label>
      <div class="row" style="gap:6px"><input type="password" id="ak" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-ant-…" value="${esc(c.key)}" style="flex:1"><button class="btn" type="button" id="akshow">Ver</button></div></div>
    <div class="field"><label for="m1">Modelo para consultas, herramientas de estudio y hojas</label><select id="m1">${opts(c.modelDefault)}</select></div>
    <div class="field"><label for="m2">Modelo para preparar y mejorar enseñanzas</label><select id="m2">${opts(c.modelComplex)}</select></div>
    <div class="row" style="gap:8px"><button class="btn primary" id="aksave">Guardar</button><button class="btn" id="aktest">Probar conexión</button><span class="muted" id="akmsg" role="status"></span></div>
    <p class="muted" style="margin:0;font-size:13.5px">Como referencia, con Sonnet una enseñanza completa cuesta unos centavos de dólar. Puede ver su gasto y ponerle un límite mensual en la misma página de Anthropic. La clave queda guardada solo en este equipo: no la comparta ni comparta el enlace de la app.</p>
  </div>

  <div class="section-head"><h2>Copia de seguridad</h2></div>
  <div class="card" style="display:grid;gap:12px">
    <p class="muted" style="margin:0">Hoy tiene <b>${nd}</b> ${nd===1?"enseñanza guardada":"enseñanzas guardadas"} en este equipo, sin contar las de su archivo. Descargue una copia de vez en cuando y guárdela en Archivos o iCloud. Con ese archivo puede recuperar todo en otro equipo o si se borran los datos.</p>
    <div class="row" style="gap:8px"><button class="btn primary" id="bkout">Descargar copia</button><button class="btn" id="bkin">Restaurar desde una copia</button><input type="file" id="bkfile" accept=".json,application/json" hidden></div>
    <p class="muted" style="margin:0;font-size:13.5px">Si usaba la app dentro de Claude, abra allá Inicio y toque "Copia de seguridad de mis enseñanzas"; luego restáurela aquí.</p>
  </div>

  <div class="section-head"><h2>Sin conexión</h2></div>
  <div class="card"><p style="margin:0" id="offst" class="muted">Revisando…</p></div>`;
  $("#akshow").onclick=()=>{const i=$("#ak");const s=i.type==="password";i.type=s?"text":"password";$("#akshow").textContent=s?"Ocultar":"Ver"};
  const msg=(t,bad)=>{const m=$("#akmsg");m.textContent=t;m.style.color=bad?"var(--danger)":"var(--verde)"};
  const read=()=>({key:$("#ak").value.trim(),modelDefault:$("#m1").value,modelComplex:$("#m2").value});
  $("#aksave").onclick=()=>{TP.saveCfg(read());msg(read().key?"Guardado.":"Guardado sin clave: la IA queda apagada.")};
  $("#aktest").onclick=async()=>{const c2=read();if(!c2.key){msg("Escriba primero la clave.",true);return}
    TP.saveCfg(c2);msg("Probando…");
    try{await TP.ping(c2.key,c2.modelDefault);msg("Conexión correcta. La IA está lista.")}
    catch(e){msg(ERR[e.code]||e.message||"No se pudo conectar.",true)}};
  $("#bkout").onclick=backupData;
  $("#bkin").onclick=()=>$("#bkfile").click();
  $("#bkfile").onchange=async e=>{const f=e.target.files[0];if(!f)return;
    try{
      const d=JSON.parse(await f.text());
      if(d.app!=="taller-del-predicador"||!Array.isArray(d.sermones))throw new Error("formato");
      if(!confirm("Se van a unir "+d.sermones.length+" enseñanzas de la copia con las que ya tiene aquí. Si una está en los dos lados, queda la más reciente. ¿Continuar?"))return;
      const cur=Store.localAll();const byId=new Map(cur.map(s=>[s.id,s]));
      for(const s of d.sermones){const o=byId.get(s.id);if(!o||(s.actualizado||"")>=(o.actualizado||""))byId.set(s.id,s)}
      Store.localSave([...byId.values()]);
      for(const [k,val] of Object.entries(d.kv||{})){if(/^tp_/.test(k)&&k!=="tp_cfg"&&k!=="tp_sermones")ls.set(k,val)}
      toast("Copia restaurada");setTimeout(()=>location.reload(),700);
    }catch{toast("Ese archivo no es una copia del Taller del Predicador")}
    e.target.value="";
  };
  (async()=>{const el=$("#offst");let t="Esta app guarda lo necesario en el equipo para abrir sin internet.";

let BIBLE=null, VERSES=[], ALIAS=new Map(), REFRE=null;

function buildAliases(){
  const extra={"Salmos":["Salmo","Sal"],"Cantares":["Cantar de los Cantares","Cantar","Cnt","Cant"],"Eclesiastés":["Ecl","Ec"],"Proverbios":["Prov","Pr"],"Génesis":["Gn","Gén","Gen"],"Éxodo":["Éx","Ex"],"Levítico":["Lv","Lev"],"Números":["Nm","Núm","Num"],"Deuteronomio":["Dt","Deut"],"Josué":["Jos"],"Jueces":["Jue","Jc"],"Rut":["Rt"],"Nehemías":["Neh"],"Ester":["Est"],"Isaías":["Is","Isa"],"Jeremías":["Jer"],"Lamentaciones":["Lm","Lam"],"Ezequiel":["Ez","Eze"],"Daniel":["Dn","Dan"],"Oseas":["Os"],"Joel":["Jl"],"Amós":["Am"],"Abdías":["Abd"],"Jonás":["Jon"],"Miqueas":["Mi","Miq"],"Nahúm":["Nah"],"Habacuc":["Hab"],"Sofonías":["Sof"],"Hageo":["Hag"],"Zacarías":["Zac"],"Malaquías":["Mal"],"Mateo":["Mt"],"Marcos":["Mr","Mc"],"Lucas":["Lc"],"Juan":["Jn"],"Hechos":["Hch"],"Romanos":["Ro","Rom"],"Gálatas":["Gá","Gál","Gal"],"Efesios":["Ef"],"Filipenses":["Fil","Flp"],"Colosenses":["Col"],"Tito":["Tit"],"Filemón":["Flm"],"Hebreos":["He","Heb"],"Santiago":["Stg","Sant"],"Judas":["Jud"],"Apocalipsis":["Ap","Apoc"],"Esdras":["Esd"],"Job":["Job"]};
  const nums={"1":["1","I","Primera de","1ra"],"2":["2","II","Segunda de","2da"],"3":["3","III","Tercera de"]};
  const forms=[];
  BIBLE.forEach((b,i)=>{
    const m=b.name.match(/^([123]) (.+)$/);
    const add=f=>{forms.push(f);ALIAS.set(norm(f).replace(/\s+/g," "),i)};
    if(m){
      const base=m[2];const short=b.abbr.replace(/^[123] /,"");
      const extraBase={"Samuel":["S","Sam","Sm"],"Reyes":["R","Re","Rey"],"Crónicas":["Cr","Cro","Crón"],"Corintios":["Co","Cor"],"Tesalonicenses":["Ts","Tes"],"Timoteo":["Ti","Tim"],"Pedro":["P","Pe","Ped"],"Juan":["Jn"]}[base]||[];
      for(const n of nums[m[1]]) for(const bb of [base,short,...extraBase]) add(n+" "+bb);
      for(const bb of [base,short,...extraBase]) add(m[1]+bb);
    }else{add(b.name);add(b.abbr);(extra[b.name]||[]).forEach(add)}
  });
  const uniq=[...new Set(forms)].sort((a,b)=>b.length-a.length).map(f=>f.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/ /g,"\\s+"));
  REFRE=new RegExp("(^|[^\\p{L}\\d])("+uniq.join("|")+")\\.?\\s+(\\d{1,3})(?::(\\d{1,3})(?:\\s*[-–]\\s*(\\d{1,3}))?)?(?![\\d\\p{L}])","gu");
}
function bookIndex(name){return ALIAS.get(norm(name).replace(/\./g,"").replace(/\s+/g," ").trim())}
function parseRef(str){
  if(!BIBLE)return null;
  const s=str.trim().replace(/\s+/g," ");

}

function linkRefs(html){
  if(!REFRE)return html;
  return html.replace(REFRE,(all,pre,book,c,v1,v2)=>{
    const b=bookIndex(book);if(b==null||!BIBLE[b].chs[+c-1])return all;
    const ref=`${b}|${c}|${v1||""}|${v2||""}`;
    return `${pre}<span class="reflink" role="button" tabindex="0" data-ref="${ref}">${all.slice(pre.length)}</span>`;
  });
}
function inline(s){return linkRefs(esc(s).replace(/«([^»]+)»/g,'<span class="bq">«$1»</span>').replace(/==(.+?)==/g,"<mark>$1</mark>").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g,"$1<em>$2</em>"))}
function md(src){
  const lines=String(src).replace(/\r/g,"").split("\n");let html="",list=null,para=[];
  const flush=()=>{if(para.length){html+=`<p>${inline(para.join(" "))}</p>`;para=[]}};
  const close=()=>{if(list){html+=`</${list}>`;list=null}};
  for(const raw of lines){const l=raw.trimEnd();let m;
    if(!l.trim()){flush();close();continue}
    if(m=l.match(/^#{1,2}\s+(.*)/)){flush();close();html+=`<h3>${inline(m[1])}</h3>`;continue}
    if(m=l.match(/^#{3,6}\s+(.*)/)){flush();close();html+=`<h4>${inline(m[1])}</h4>`;continue}
    if(m=l.match(/^\s*[-*•]\s+(.*)/)){flush();if(list!=="ul"){close();html+="<ul>";list="ul"}html+=`<li>${inline(m[1])}</li>`;continue}
    if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){flush();if(list!=="ol"){close();html+="<ol>";list="ol"}html+=`<li>${inline(m[1])}</li>`;continue}
    if(m=l.match(/^>\s?(.*)/)){flush();close();const ov=/^\((NTV|NVI|DHH|TLA|PDT|LBLA|BLP|NBV)\)/.test(m[1]);html+=`<blockquote${ov?' class="otra"':""}>${inline(m[1])}</blockquote>`;continue}
    if(/^(-{3,}|_{3,})$/.test(l.trim())){flush();close();continue}
    close();para.push(l.trim());
  }
  flush();close();return html;
}

function buildMatcher(q,modo){
  const phrases=[];q.replace(/"([^"]+)"|“([^”]+)”|(\S+)/g,(_,a,b,c)=>{phrases.push(norm(a||b||c))});
  const terms=phrases.filter(Boolean).map(p=>p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/\s+/g,"\\s+"));
  if(!terms.length)return null;
  const res=terms.map(t=>modo==="palabra"?new RegExp(`(?<![a-z0-9])${t}(?![a-z0-9])`,"g"):new RegExp(t,"g"));
  return {res,test:n=>res.every(r=>{r.lastIndex=0;return r.test(n)})};
}
function highlight(t,n,res){
  const spans=[];for(const r of res){r.lastIndex=0;let m;while(m=r.exec(n)){spans.push([m.index,m.index+m[0].length]);if(!m[0].length)r.lastIndex++}}
  spans.sort((a,b)=>a[0]-b[0]);let out="",p=0;for(const [a,z] of spans){if(a<p)continue;out+=esc(t.slice(p,a))+"<mark>"+esc(t.slice(a,z))+"</mark>";p=z}return out+esc(t.slice(p));
}
function doSearch(){
  const box=$("#cres");if(!box)return;
  if(!BIBLE){box.innerHTML=`<div class="thinking"><span class="dot"></span>Cargando la Biblia…</div>`;return}
  if(!CONC.q){box.innerHTML=`<div class="card"><p style="margin:0 0 8px">Pruebe con:</p><div class="chips">${["gracia","\"no temas\"","misericordia","diezmo","Espíritu","resucitó"].map(w=>`<button class="chip" data-q='${esc(w)}'>${esc(w)}</button>`).join("")}</div></div>`;box.onclick=e=>{const c=e.target.closest("[data-q]");if(c){$("#cq").value=c.dataset.q;$("#cform").requestSubmit()}};return}
  const m=buildMatcher(CONC.q,CONC.modo);if(!m){box.innerHTML="";return}
  let pool=VERSES;if(CONC.test==="at")pool=pool.filter(x=>x.b<NT_START);if(CONC.test==="nt")pool=pool.filter(x=>x.b>=NT_START);
  const all=pool.filter(x=>m.test(x.n));
  const per={};all.forEach(x=>per[x.b]=(per[x.b]||0)+1);
  const hits=CONC.libro!==""?all.filter(x=>x.b===+CONC.libro):all;
  const max=Math.max(1,...Object.values(per));
  box.innerHTML=`<div class="conc-layout"><div style="min-width:0">
    <p><b>${hits.length.toLocaleString("es-CO")}</b> versículo${hits.length===1?"":"s"}${CONC.libro!==""?` en ${esc(BIBLE[+CONC.libro].name)}`:""}${CONC.libro!==""&&all.length!==hits.length?` <span class="muted">(${all.length.toLocaleString("es-CO")} en total)</span>`:""}</p>
    <div id="hits">${hits.slice(0,CONC.shown).map(x=>`<div class="hit"><a data-b="${x.b}" data-c="${x.c}" data-v="${x.v}">${esc(BIBLE[x.b].name)} ${x.c}:${x.v}</a><div class="t">${highlight(x.t,x.n,m.res)}</div></div>`).join("")}</div>
    ${hits.length>CONC.shown?`<p><button class="btn" id="more">Mostrar más (${(hits.length-CONC.shown).toLocaleString("es-CO")} restantes)</button></p>`:""}
    <div class="row" style="margin-top:16px"><button class="btn gold" id="towords">Estudiar “${esc(CONC.q.replace(/["“”]/g,""))}” en hebreo y griego</button></div>
  </div>
  <aside class="card" aria-label="Distribución por libro"><p class="label" style="margin:0 0 8px">Por libro</p>
    <div class="dist">${Object.entries(per).map(([b,n])=>`<button data-lib="${b}" ${CONC.libro===b?'style="background:var(--oro-soft)"':""}><span>${esc(BIBLE[b].name)}</span><span class="bar" style="width:${Math.max(4,n/max*100)}%"></span><span class="n">${n}</span></button>`).join("")||'<span class="muted">Sin resultados.</span>'}</div>
    ${CONC.libro!==""?'<button class="btn small" style="margin-top:8px" data-lib="">Ver todos los libros</button>':""}</aside></div>`;
  box.onclick=e=>{
    const a=e.target.closest("a[data-b]");if(a){goBible(+a.dataset.b,+a.dataset.c,[+a.dataset.v,+a.dataset.v]);return}
    const l=e.target.closest("[data-lib]");if(l){CONC.libro=l.dataset.lib;$("#clibro").value=CONC.libro;CONC.shown=100;doSearch();return}
    if(e.target.id==="more"){CONC.shown+=200;doSearch()}
    if(e.target.id==="towords")go("palabras",{prefill:{palabra:CONC.q.replace(/["“”]/g,""),pasaje:""}});
  };
}

function toolTitle(id,vals){const t=TOOLS[id];return t.campos.filter(c=>c.tipo!=="select").map(c=>vals[c.id]).filter(Boolean).join(" · ")}
function renderOut(id){

  box.onclick=e=>{const a=e.target.closest("[data-o]")?.dataset.o;if(!a)return;

const ERR={not_granted:"La app necesita su permiso para consultar a Claude. Puede darlo desde el menú de permisos de esta página.",sampling_disabled:"Las consultas a Claude no están disponibles en esta cuenta.",rate_limited:"Se alcanzó el límite de consultas por ahora. Intente de nuevo en un rato.",session_expired:"Su sesión se cerró. Vuelva a iniciar sesión en Claude.",refused:"Claude no respondió esa consulta. Intente formularla de otra manera.",empty_completion:"No llegó respuesta. Intente con una consulta más corta.",prompt_too_large:"El pasaje es demasiado largo. Pruebe con menos versículos.",no_key:"Falta la clave de la IA. Vaya a Ajustes, en el menú, y péguela allí. Se crea en console.anthropic.com.",bad_key:"La clave no fue aceptada. Revísela en Ajustes.",no_credit:"La cuenta de Anthropic no tiene saldo. Cargue un poco de saldo en console.anthropic.com.",overloaded:"Claude está muy ocupado en este momento. Intente de nuevo en un minuto.",network:"No hay conexión con internet. La IA la necesita; el resto de la app sigue funcionando.",bad_model:"Ese modelo no está disponible en su cuenta. Elija otro en Ajustes.",api_error:"Anthropic devolvió un error. Intente de nuevo."};
async function runTool(id,fresh=false){
  const t=TOOLS[id];const st=RUNS[id];
  const vals={};for(const c of t.campos){vals[c.id]=($("#f_"+c.id)?.value||"").trim()}
  const need=t.campos.find(c=>c.tipo!=="select"&&!/opcional/i.test(c.label));
  if(need&&!vals[need.id]){toast("Escriba "+need.label.toLowerCase());$("#f_"+need.id)?.focus();return}
  st.vals=vals;st.out="";st.status="running";renderOut(id);
  const sample=await getSample();
  if(!sample){st.status="error";st.err="Las herramientas de estudio necesitan abrirse dentro de Claude (claude.ai o la app). La Biblia, la concordancia y Mis enseñanzas sí funcionan aquí.";renderOut(id);return}
  const ctl=new AbortController();st.ctl=ctl;$("#stop")&&($("#stop").onclick=()=>ctl.abort());
  try{
    const {text,truncated}=await sample(DOCTRINA+"\n\n"+t.prompt(vals),{signal:ctl.signal,cache:fresh?{gcTime:300000,refresh:true}:{gcTime:300000},modelTier:id==="bosquejo"?"complex":"default",onText:({text})=>{st.out=text;renderOut(id)}});
    st.out=text+(truncated?"\n\n*La respuesta se cortó por su extensión. Pruebe con un pasaje más corto.*":"");st.status="done";
    const h=ls.get(histKey(id),[]);h.unshift({titulo:toolTitle(id,vals),vals,out:st.out,fecha:new Date().toLocaleDateString("es-CO")});ls.set(histKey(id),h.slice(0,15));
  }catch(e){
    if(e?.code==="cancelled"){st.out=e.text||"";st.status=st.out?"done":"idle"}
    else{st.status="error";st.err=ERR[e?.code]||"Hubo un problema de conexión. Intente de nuevo.";st.out=e?.text||""}
  }
  renderOut(id);renderHist(id);
}

function libToMd(it){const L=[`# ${it.T||it.t}`];let i=0;const P=it.p;
  if(P[0]&&P[0][0]==="p"&&P[0][1]===it.S){L.push(`*${it.S}*`);i=1}
  let lastLi=false;
  for(;i<P.length;i++){const [k,t]=P[i];
    if(k!=="li"&&lastLi){L.push("");lastLi=false}
    if(k==="h"&&/^vers[ií]culo clave$/i.test(t.replace(/:$/,"")))continue;
    if(k==="ref"){const nx=P[i+1];if(nx&&nx[0]==="q"){L.push(`> ${t} — ${nx[1].replace(/^\((RVR1960|NTV|NVI)\)\s*/,"")}`);i++}else L.push(`> ${t}`);L.push("");continue}
    if(k==="q"){L.push(`> ${t}`,"");continue}
    if(k==="h"){L.push(`## ${t.replace(/:$/,"")}`);continue}
    if(k==="li"){L.push(`- ${t}`);lastLi=true;continue}
    if(k==="i"){L.push("",`**${t.replace(/\*/g,"")}**`,"");continue}
    L.push(t,"")}
  return L.join("\n")}
function libToText(it){return [it.T||it.t,...it.p.map(([k,t])=>k==="li"?"• "+t:t)].join("\n\n")}

function pgInline(s,st){
  const re=/(\*\*[^*]+\*\*|==[^=]+==|«[^»]+»(?:\s*\([^)]+\))?|\*[^*\s][^*]*\*)/g;let out="",last=0,m;
  while((m=re.exec(s))){out+=esc(s.slice(last,m.index));const t=m[0];
    if(t.startsWith("**"))out+=`<b class="pb">${esc(t.slice(2,-2))}</b>`;
    else if(t.startsWith("=="))out+=`<span class="phl">${esc(t.slice(2,-2))}</span>`;
    else if(t.startsWith("«")){const mm=t.match(/^«([^»]+)»(?:\s*\(([^)]+)\))?/);const ov=mm[2]&&/\b(NTV|NVI|DHH|TLA|PDT|LBLA|BLP|NBV)\b/.test(mm[2]);
      out+=`<span class="${ov?"pov":"pq"}">“${esc(mm[1].trim())}”${mm[2]?` <small>(${esc(mm[2].trim())})</small>`:""}</span>`}
    else out+=`<i>${esc(t.slice(1,-1))}</i>`;
    last=m.index+t.length}

    <div class="cmp-head"><div><h2 style="margin:0">Comparar</h2>${note?`<p class="muted" style="margin:2px 0 0;font-size:13px">${esc(note)}</p>`:""}</div>
      <div class="row" style="gap:8px"><label class="row" style="gap:6px;font-size:13.5px"><input type="checkbox" id="cmp_hl" checked> Resaltar diferencias</label><button class="btn" data-x>Cerrar</button></div></div>
    <div class="seg cmp-tabs"><button class="btn small on" data-side="a">${esc(lt)}</button><button class="btn small" data-side="b">${esc(rt)}</button></div>
    <div class="cmp-cols hl" id="cmp_cols"><section data-col="a"><p class="label">${esc(lt)}</p><div class="md">${md(lmd||"")}</div></section><section data-col="b"><p class="label">${esc(rt)}</p><div class="md">${md(rmd||"")}</div></section></div>
    <p class="muted cmp-legend"><span class="sw old"></span> Solo en «${esc(lt)}» &nbsp; <span class="sw new"></span> Nuevo o cambiado en «${esc(rt)}»</p>
  </div>`;
  const sel="p,li,blockquote,h3,h4";const key=el=>norm(el.textContent).replace(/[^a-z0-9ñ]+/g," ").trim();
  const A=[...m.querySelectorAll('[data-col="a"] .md '+sel)],B=[...m.querySelectorAll('[data-col="b"] .md '+sel)];
  const SA=new Set(A.map(key)),SB=new Set(B.map(key));
  A.forEach(el=>{if(!SB.has(key(el)))el.classList.add("d-old")});B.forEach(el=>{if(!SA.has(key(el)))el.classList.add("d-new")});
  m.hidden=false;document.body.style.overflow="hidden";
  const close=()=>{m.hidden=true;m.innerHTML="";document.body.style.overflow=""};
  m.onclick=e=>{if(e.target===m||e.target.closest("[data-x]"))return close();const t=e.target.closest("[data-side]");if(t){m.querySelectorAll("[data-side]").forEach(x=>x.classList.toggle("on",x===t));$("#cmp_cols").dataset.show=t.dataset.side}};
  $("#cmp_hl").onchange=e=>$("#cmp_cols").classList.toggle("hl",e.target.checked);
  $("#cmp_cols").dataset.show="a";
  document.addEventListener("keydown",function esc_(e){if(e.key==="Escape"){close();document.removeEventListener("keydown",esc_)}});
}
async function compareOrigin(){
  try{await loadLib()}catch{toast("No se pudo abrir su archivo");return}
  const it=LIB.items[+OPEN.origen];if(!it)return;
  openCompare("Original de su archivo",libToMd(it),"Versión trabajada",OPEN.ensenanza,`«${it.t}» · ${LIB.carpetas[it.c].t}`);
}
function saveBtn(){return `<button class="btn primary" data-e="tofolder">${OPEN.categoria&&CATMAP[OPEN.categoria]?`Guardar en ${esc(CATMAP[OPEN.categoria][2])}`:"Guardar en una carpeta"}</button>`}
function drawSaveBar(id){const b=$("#savebar");if(!b||OPEN?.id!==id)return;const c=CATMAP[OPEN.categoria];
  b.innerHTML=`<span class="muted">${c?(OPEN.guardada?`Guardada en la carpeta <b>${esc(c[2])}</b>`:`Carpeta: <b>${esc(c[2])}</b> · aún no guardada ahí`):"Sin carpeta: escójala en «Datos y notas» y guarde"}</span><span class="row" style="gap:8px">${OPEN.ensenanza?`<button class="btn" data-e="pulpit">Predicar</button>`:""}${saveBtn()}</span>`}
async function saveToFolder(id){
  if(!OPEN||OPEN.id!==id)return;
  for(const f of ["titulo","texto","categoria","culto","fecha","serie","estado","notas"]){const el=$("#e_"+f);if(el)OPEN[f]=el.value}
  const c=CATMAP[OPEN.categoria];
  if(!c){toast("Escoja primero la carpeta");const sel=$("#e_categoria");sel?.scrollIntoView({block:"center"});sel?.focus();return}
  clearTimeout(saveTimer);OPEN.guardada=true;
  try{await saveOpen();}catch{}
  toast(`Guardada en la carpeta ${c[2]}`);
  LSTATE.item=null;LSTATE.q="";LSTATE.f="todas";LSTATE.c=catIdx(OPEN.categoria);LSTATE.flash=id;
  go("sermones");
}
function saveOpen(){const snap={...OPEN};saving=saving.then(()=>Store.saveSermon(snap)).catch(()=>toast("No se pudo guardar"));return saving}
function setEns(id,text){if(OPEN?.id!==id)return;
  if(OPEN.ensenanza&&OPEN.ensenanza!==text){ENSUI[id]={mode:"pending",pending:text,show:"new"};renderEns(id);renderPrep(id);$("#ensbox")?.scrollIntoView({block:"start",behavior:"smooth"});return}
  OPEN.ensenanza=text;if(OPEN.estado==="idea"){OPEN.estado="prep";const e=$("#e_estado");if(e)e.value="prep"}saveOpen();ENSUI[id]={mode:"view"};renderEns(id);renderPrep(id);$("#ensbox")?.scrollIntoView({block:"start",behavior:"smooth"})}
function renderEns(id){
  const box=$("#ensbox");if(!box||OPEN?.id!==id)return;const ui=ENSUI[id]||(ENSUI[id]={mode:"view"});const st=PREP[id]||{};
  const txt=ui.mode==="rev"&&ui.out?ui.out:ui.mode==="pending"?(ui.show==="old"?OPEN.ensenanza:ui.pending):OPEN.ensenanza;
  if(!txt){const old=MATS.find(m=>m.tipo==="Enseñanza preparada");
    box.innerHTML=old?`<div class="card"><p style="margin:0 0 10px">Este sermón tiene una enseñanza preparada guardada en sus materiales.</p><button class="btn primary" id="ens_use">Abrirla en la vista previa</button></div>`:`<div class="card empty"><p class="label" style="margin:0 0 4px">La enseñanza</p><p style="margin:0 0 10px" class="muted">Todavía no hay una enseñanza escrita para este sermón. Ármela usted mismo con el croquis o prepárela con Claude; quedará aquí para revisarla, corregirla y descargarla.</p><div class="row"><button class="btn primary" id="ens_arm">Armarla yo mismo</button><button class="btn" id="ens_cl">Prepararla con Claude</button></div></div>`;
    const ea=$("#ens_arm");if(ea)ea.onclick=()=>{clearTimeout(saveTimer);saveOpen();go("armar",{id})};const ec=$("#ens_cl");if(ec)ec.onclick=()=>$("#prepcard")?.scrollIntoView({block:"start",behavior:"smooth"});
    const u=$("#ens_use");if(u)u.onclick=()=>{OPEN.ensenanza=old.texto;saveOpen();renderEns(id);renderPrep(id)};return}
  const hoja=st.hstatus?`<div class="paperwrap" style="margin-top:18px"><div class="paperbar"><span class="label">Hoja para la congregación</span></div><div class="md paper">${st.hoja?md(st.hoja):`<div class="thinking"><span class="dot"></span>Armando la hoja…</div>`}</div>${st.hstatus==="done"?`<div class="out-actions">${wordButtons("hoja")}<button class="btn" data-e="hsave">Guardar en materiales</button><button class="btn" data-e="hcopy">Copiar</button></div>`:""}</div>`:"";
  let body;
  if(ui.mode==="edit"){
    body=`<p class="muted" style="font-size:13px;margin:8px 0">Corrija, quite o añada lo que quiera. Guía rápida: <code># Título</code> · <code>## I. Punto</code> · <code>- viñeta</code> · <code>**negrita**</code> · <code>==resaltado==</code> · <code>&gt; cita en bloque</code> · una frase de impacto va sola en su línea en <code>**¡negrita!**</code></p>
    <textarea id="ens_ta" rows="26" style="font-family:ui-monospace,Menlo,monospace;font-size:14px">${esc(OPEN.ensenanza)}</textarea>
    <div class="out-actions"><button class="btn primary" data-e="esave">Guardar cambios</button><button class="btn" data-e="ecancel">Cancelar</button></div>`;
  }else{
    body=`${ui.mode==="view"?designPicker("ens"):""}${ui.mode==="view"?pageHTML(txt,curStyle()):`<div class="md paper">${md(txt)}</div>`}${ui.mode==="rev"?`<div class="thinking" style="margin-top:8px"><span class="dot"></span>Aplicando el cambio…</div>`:""}`;
  }
  const tools=ui.mode==="view"?`<div class="askbox"><label for="ens_ask" class="label">Pedirle un cambio a Claude</label><div class="row" style="margin-top:6px"><input type="text" id="ens_ask" placeholder="Ej.: quite el punto III · añada el ejemplo de Ana · haga la conclusión más corta" style="flex:1;min-width:220px"><button class="btn" data-e="ask">Aplicar</button></div></div>
  <div class="out-actions">${saveBtn()}<button class="btn" data-e="dl">Descargar Word · ${WSHORT[curStyle()]}</button><button class="btn" data-e="hoja" ${st.hstatus==="running"?"disabled":""}>${st.hoja?"Rehacer la hoja":"Hoja para la congregación"}</button><button class="btn" data-e="copy">Copiar</button><button class="btn" data-e="notes">Pasar a mis notas</button></div>
  <p class="muted" style="font-size:12.5px;margin:10px 0 0">El Word se descarga tal como se ve aquí. Revise las citas antes de predicar: Claude escribe la RVR1960 de memoria; toque las referencias en verde para compararlas con la RV1909.</p>`:ui.mode==="rev"?`<div class="out-actions"><button class="btn" data-e="revstop">Detener</button></div>`:"";
  const pend=ui.mode==="pending"?`<div class="decide"><p style="margin:0 0 4px"><b>Hay una versión nueva de esta enseñanza.</b> Revísela y decida qué hacer con ella.</p>
    <div class="row" style="margin:8px 0 2px;gap:6px"><span class="seg"><button class="btn small ${ui.show!=="old"?"on":""}" data-e="shownew">Ver la nueva</button><button class="btn small ${ui.show==="old"?"on":""}" data-e="showold">Ver la que tenía</button></span></div>
    <div class="row" style="margin-top:10px"><button class="btn" data-e="cmppend">Comparar lado a lado</button><button class="btn primary" data-e="replace">Reemplazar la que tenía</button><button class="btn" data-e="keepboth">Guardar como enseñanza aparte</button><button class="btn ghost" data-e="discard">Descartar la nueva</button></div></div>`:"";
  const orig=ui.mode==="view"&&OPEN.origen!=null&&OPEN.ensenanza?(OPEN.reemplaza?`<div class="decide quiet">Esta versión reemplaza a «${esc(OPEN.origenTitulo||"")}» en su carpeta. <button class="btn small ghost" data-e="cmporig">Comparar con la original</button> <button class="btn small ghost" data-e="restore">Volver a mostrar la original</button></div>`:OPEN.origenOk?"":`<div class="decide"><p style="margin:0">Esta enseñanza es una copia trabajada de «${esc(OPEN.origenTitulo||"")}», de su archivo. Cuando esté conforme, decida:</p><div class="row" style="margin-top:10px"><button class="btn" data-e="cmporig">Comparar con la original</button><button class="btn primary" data-e="origrep">Reemplazar la original</button><button class="btn" data-e="origkeep">Conservar las dos</button></div></div>`):"";
  box.innerHTML=`${pend}${orig}<div class="paperwrap"><div class="paperbar"><span class="label">${ui.mode==="pending"?(ui.show==="old"?"La que tenía":"Versión nueva"):"Vista previa de la enseñanza"}</span>${ui.mode==="view"?`<span class="row" style="gap:6px">${OPEN.ensanterior?`<button class="btn small ghost" data-e="cmpprev">Comparar con la anterior</button><button class="btn small ghost" data-e="undo">Volver a la anterior</button>`:""}<button class="btn small" data-e="edit">Editar</button><button class="btn small primary" data-e="pulpit">Predicar</button></span>`:""}</div>${body}${tools}</div>${hoja}`;
  const sb=$("#savebar");if(sb)drawSaveBar(id);
  const ask=$("#ens_ask");if(ask)ask.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();reviseEns(id,ask.value.trim())}};
  box.onclick=e=>{const a=e.target.closest("[data-e],[data-p]");if(!a)return;const k=a.dataset.e||a.dataset.p;
    if(k.startsWith("w_")){const [,kind,style]=k.split("_");return exportWord(kind==="hoja"?st.hoja:OPEN.ensenanza,style,kind==="hoja"?"Hoja para la congregación":"")}
    if(k==="edit"){ui.mode="edit";renderEns(id);$("#ens_ta")?.focus();return}
    if(k==="ecancel"){ui.mode="view";renderEns(id);return}
    if(k==="esave"){const t=$("#ens_ta").value;if(t!==OPEN.ensenanza){OPEN.ensanterior=OPEN.ensenanza;OPEN.ensenanza=t;saveOpen();toast("Cambios guardados")}ui.mode="view";renderEns(id);return}
    if(k==="undo"){const t=OPEN.ensenanza;OPEN.ensenanza=OPEN.ensanterior;OPEN.ensanterior=t;saveOpen();renderEns(id);toast("Volvió a la versión anterior");return}
    if(k==="ask")return reviseEns(id,$("#ens_ask").value.trim());
    if(k==="tofolder")return saveToFolder(id);
    if(k==="pulpit")return openPulpit(OPEN.ensenanza,OPEN.titulo);
    if(k==="dl")return exportWord(OPEN.ensenanza,curStyle(),"");
    if(k.startsWith("ds_")){ls.set("tp_wstyle",k.slice(3));renderEns(id);return}
    if(k==="cmporig")return compareOrigin();
    if(k==="cmppend")return openCompare("La que tenía",OPEN.ensenanza,"Versión nueva",ui.pending,"Revise los cambios antes de decidir");
    if(k==="cmpprev")return openCompare("Versión anterior",OPEN.ensanterior,"Versión actual",OPEN.ensenanza);
    if(k==="shownew"||k==="showold"){ui.show=k==="showold"?"old":"new";renderEns(id);return}
    if(k==="replace"){OPEN.ensanterior=OPEN.ensenanza;OPEN.ensenanza=ui.pending;ENSUI[id]={mode:"view"};saveOpen();renderEns(id);renderPrep(id);toast("Listo: la nueva reemplazó a la anterior");return}
    if(k==="discard"){ENSUI[id]={mode:"view"};renderEns(id);renderPrep(id);toast("Se conservó la que tenía");return}
    if(k==="keepboth"){const pend=ui.pending;const {id:_x,actualizado,ensanterior,reemplaza,origenOk,...base}=OPEN;Store.saveSermon({...base,titulo:(OPEN.titulo||"Enseñanza")+" (nueva versión)",ensenanza:pend}).then(()=>toast("Guardada aparte, en la misma carpeta"));ENSUI[id]={mode:"view"};renderEns(id);renderPrep(id);return}
    if(k==="origrep"){OPEN.reemplaza=true;OPEN.origenOk=true;saveOpen();renderEns(id);toast("La original ya no aparece en su carpeta; queda esta en su lugar");return}
    if(k==="origkeep"){OPEN.origenOk=true;OPEN.reemplaza=false;saveOpen();renderEns(id);toast("Se conservan las dos");return}
    if(k==="restore"){OPEN.reemplaza=false;saveOpen();renderEns(id);toast("La original vuelve a aparecer en su carpeta");return}
    if(k==="revstop"){ui.ctl?.abort();return}
    if(k==="hoja")return runHoja(id);
    if(k==="copy")return copyText(prepToText(OPEN.ensenanza));
    if(k==="hcopy")return copyText(prepToText(st.hoja));
    if(k==="hsave"){Store.addMaterial(id,{tipo:"Hoja para la congregación",titulo:OPEN.titulo||"Hoja",texto:st.hoja});toast("Guardada en materiales");return}
    if(k==="notes"){const ta=$("#e_notas");ta.value=(ta.value.trim()?ta.value.trim()+"\n\n":"")+prepToText(OPEN.ensenanza);ta.dispatchEvent(new Event("input"));toast("Añadido a sus notas")}
  };
}
async function reviseEns(id,pedido){
  if(!pedido){$("#ens_ask")?.focus();return}
  const ui=ENSUI[id];const sample=await getSample();
  if(!sample){toast("Los cambios con Claude necesitan abrir la app dentro de Claude");return}
  ui.mode="rev";ui.out="";ui.ctl=new AbortController();renderEns(id);
  const prompt=`${DOCTRINA}

TAREA: el Pastor Antonio Sierra J. revisó su enseñanza y pide este cambio:
«${pedido}»

Aplica SOLO ese cambio y devuelve la enseñanza COMPLETA con el mismo formato Markdown exacto (mismos títulos, citas, viñetas, frases de impacto y textos de apoyo). Lo que él no pidió cambiar se queda igual, palabra por palabra. Mantén su voz: lenguaje humano de pastor colombiano. Si añades citas bíblicas, en RVR1960 solo si estás seguro de la redacción exacta; si no, solo la referencia. No agregues comentarios ni explicaciones antes o después: solo la enseñanza.

ENSEÑANZA ACTUAL:
${OPEN.ensenanza}`;
  try{const {text}=await sample(prompt,{signal:ui.ctl.signal,cache:false,modelTier:"complex",onText:({text})=>{ui.out=text;renderEns(id)}});
    ui.out=null;if(text.trim()){ui.mode="pending";ui.pending=text;ui.show="new"}else ui.mode="view"}
  catch(e){ui.mode="view";ui.out=null;if(e?.code!=="cancelled")toast(ERR[e?.code]||"No se pudo aplicar el cambio")}
  renderEns(id);
}
function drawMats(id){
  const box=$("#mats");if(!box)return;
  box.innerHTML=MATS.length?MATS.map(m=>`<div class="mat"><header><div><span class="label">${esc(m.tipo)}</span><div style="font-weight:600">${esc(m.titulo||"")}</div></div><span class="row" style="gap:6px">${/preparad|Hoja para/.test(m.tipo)?`<button class="btn small" data-w="${esc(m.id)}">Word</button>`:""}<span id="md_${esc(m.id)}"><button class="btn small ghost" data-del="${esc(m.id)}">Quitar</button></span></span></header><div class="md">${md(m.texto||"")}</div></div>`).join(""):`<div class="card muted">Aún no hay materiales. Marque versículos en la Biblia o use una herramienta y toque “Guardar en un sermón”.</div>`;
  box.onclick=e=>{const w=e.target.closest("[data-w]");if(w){const m=MATS.find(x=>x.id===w.dataset.w);if(m)exportWord(m.texto,ls.get("tp_wstyle","clasico"),/Hoja/.test(m.tipo)?"Hoja para la congregación":"");return}const d=e.target.closest("[data-del]");if(d){const mid=d.dataset.del;$("#md_"+mid).innerHTML=`<button class="btn small danger" data-dy="${esc(mid)}">Quitar</button><button class="btn small" data-dn>No</button>`;return}
    const y=e.target.closest("[data-dy]");if(y){Store.deleteMaterial(id,y.dataset.dy);return}
    if(e.target.closest("[data-dn]"))drawMats(id)};
}

/* ============ barra de búsqueda ============ */
$("#jumpform").onsubmit=e=>{e.preventDefault();const q=$("#jump").value.trim();if(!q)return;const r=parseRef(q);if(r){goBible(r.b,r.c,r.v1?[r.v1,r.v2||r.v1]:null)}else go("concordancia",{q});$("#jump").blur()};

/* ============ arranque ============ */
(async function start(){
  const h=(location.hash||"").replace("#","");
  go(NAV.flatMap(g=>g.items).some(([id])=>id===h)?h:"inicio");
  loadBible().then(()=>{if(["biblia","concordancia"].includes(CURRENT))go(CURRENT,{keepSel:true});else if(TOOLS[CURRENT])renderOut(CURRENT)}).catch(()=>{$("#view").insertAdjacentHTML("afterbegin",`<div class="card">No se pudo cargar el texto bíblico. Recargue la página.</div>`)});
  await Store.init();
  Store.watchSermons(list=>{SERMONS=list;if(CURRENT==="inicio")renderRecent();if(CURRENT==="sermones"&&!$("#e_titulo")&&$("#fest")&&viewSermones.draw)viewSermones.draw()});
})();
